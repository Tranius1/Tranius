    var lines = code.split('\n');
    for (var li = 0; li < lines.length; li++) {
      for (var ci = 0; ci < lines[li].length; ci++) {
        var ch = lines[li][ci];
        if ('{(['.indexOf(ch) >= 0) { if (start === null) start = li + 1; stack.push(ch); }
        else if ('})]'.indexOf(ch) >= 0) {
          var o = stack.pop();
          if (pairs[o] !== ch) { bad = true; break; }
          if (!stack.length) start = null;
        }
      }
      if (bad) break;
    }
    if (bad) issues.push({ lv: 'err', msg: '括号不匹配，从第 ' + start + ' 行开始出错' });
    else if (stack.length) issues.push({ lv: 'err', msg: '有 ' + stack.length + ' 个括号没闭合（从第 ' + start + ' 行开始）' });
    var cn = [];
    lines.forEach(function (l, i) {
      var s = l.replace(/"[^"]*"/g, '').replace(/'[^']*'/g, '');
      if (/[；，。“”‘’（）]/.test(s)) cn.push(i + 1);
    });
    if (cn.length) issues.push({ lv: 'err', msg: '第 ' + cn.slice(0, 3).join('、') + ' 行混入了中文标点，会报 stray 错误' });
    if (!issues.length) issues.push({ lv: 'ok', msg: '结构自检通过（这不能替代真正的编译）' });
    return issues;
  };

  /* ============================ 进度统计 ============================ */
  U.allLessonCount = function () {
    return Object.keys(window.CONTENT).reduce(function (n, k) { return n + (window.CONTENT[k].lessons || []).length; }, 0);
  };
  U.doneCount = function () {
    var s = U.state(), n = 0;
    Object.keys(window.CONTENT).forEach(function (k) {
      (window.CONTENT[k].lessons || []).forEach(function (l) { if (s.completed.indexOf(l.id) >= 0) n++; });
    });
    return n;
  };
  U.streak = function () {
    var set = {};
    U.state().checkin.forEach(function (d) { set[d] = 1; });
    var d = new Date(), n = 0;
    if (!set[U.fmtDate(d)]) d.setDate(d.getDate() - 1);
    while (set[U.fmtDate(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  };
  U.countInter = function () {
    var s = U.state(), n = 0;
    Object.keys(s.inter).forEach(function (k) { if (s.inter[k] && s.inter[k].done) n++; });
    return n;
  };
  U.reviewedCount = function () {
    return Object.keys(U.state().srs).reduce(function (n, k) { return n + (U.state().srs[k].seen || 0); }, 0);
  };
  U.level = function () {
    var xp = U.state().xp || 0;
    var lv = Math.floor(Math.sqrt(xp / 60)) + 1;
    var cur = Math.pow(lv - 1, 2) * 60, next = Math.pow(lv, 2) * 60;
    return { lv: lv, xp: xp, cur: xp - cur, next: Math.max(1, next - cur), pct: Math.min(100, Math.round((xp - cur) / Math.max(1, next - cur) * 100)) };
  };
  U.addXp = function (n, reason) {
    var s = U.state();
    s.xp = (s.xp || 0) + n;
    s.log = (s.log || []).slice(-59);
    s.log.push({ t: Date.now(), xp: n, r: reason || '' });
    store.save();
  };
  U.recordActivity = function (n) {
    var s = U.state(), t = U.today();
    s.activity[t] = (s.activity[t] || 0) + (n || 1);
    store.save();
  };

  /* ============================ 成就 ============================ */
  U.achievements = function () {
    var s = U.state();
    return [
      { id: 'a1', name: '启程', desc: '完成第一次打卡', icon: 'flame', check: function () { return s.checkin.length >= 1; } },
      { id: 'a2', name: '勤学不辍', desc: '累计打卡 10 天', icon: 'cal', check: function () { return s.checkin.length >= 10; }, prog: function () { return Math.min(s.checkin.length, 10) + ' / 10'; } },
      { id: 'a3', name: '三日成势', desc: '连续打卡 3 天', icon: 'flame', check: function () { return U.streak() >= 3; }, prog: function () { return Math.min(U.streak(), 3) + ' / 3'; } },
      { id: 'a4', name: '一周自律', desc: '连续打卡 7 天', icon: 'award', check: function () { return U.streak() >= 7; }, prog: function () { return Math.min(U.streak(), 7) + ' / 7'; } },
      { id: 'a5', name: '初窥门径', desc: '完成第一个课时', icon: 'check', check: function () { return s.completed.length >= 1; } },
      { id: 'a6', name: '第一周通关', desc: '完成第 1 周全部课时', icon: 'layers', check: function () { var c = window.CONTENT[1]; return !!c && (c.lessons || []).every(function (l) { return s.completed.indexOf(l.id) >= 0; }); } },
      { id: 'a7', name: '概念达人', desc: '任意课时快测全部答对', icon: 'target', check: function () { return Object.keys(s.quiz).some(function (k) { return s.quiz[k].right === s.quiz[k].total; }); } },
      { id: 'a8', name: '实战交付', desc: '完成第一个周末实战项目', icon: 'note', check: function () { return !!(s.weekend[1] && s.weekend[1].project); } },
      { id: 'a9', name: '动手派', desc: '完成 10 个互动练习', icon: 'puzzle', check: function () { return U.countInter() >= 10; }, prog: function () { return Math.min(U.countInter(), 10) + ' / 10'; } },
      { id: 'a10', name: '真机验明', desc: '成功在线编译运行一次 C++', icon: 'play', check: function () { return !!(s.settings && s.settings.ran); } },
      { id: 'a11', name: '过目不忘', desc: '累计复习 30 张卡片', icon: 'cards', check: function () { return U.reviewedCount() >= 30; }, prog: function () { return Math.min(U.reviewedCount(), 30) + ' / 30'; } },
      { id: 'a12', name: '半程以上', desc: '完成 40% 总课时', icon: 'spark', check: function () { return U.doneCount() / Math.max(1, U.allLessonCount()) >= 0.4; }, prog: function () { return Math.round(U.doneCount() / Math.max(1, U.allLessonCount()) * 100) + '%'; } }
    ];
  };

  /* ============================ 开放访问：全部内容无付费门槛 ============================ */
  U.isUnlocked = function () { return true; };

  window.U = U;
  window.Store = store;
})();

</script>
<script data-src="assets/js/normalize.js">
/* ================================================================
   normalize.js · 把各课时文件里「字段名不一致」的块统一成标准形状
   ================================================================ */
(function () {
  'use strict';

  function arr(x) { return Array.isArray(x) ? x : (x == null ? [] : [x]); }
  function str(x) { return x == null ? '' : String(x); }

  /* ---------- 占位符识别：支持 ____ / {{1}} / {{n}} / ___1___ ---------- */
  var PLACEHOLDERS = [
    { re: /\{\{\s*(\d+)\s*\}\}/g },
    { re: /_{3,}\s*(\d+)\s*_{3,}/g },
    { re: /_{(3,)}\s*(\d+)\s*_{(3,)}/g }
  ];

  function scanBlanks(code) {
    var found = [];
    PLACEHOLDERS.forEach(function (p) {
      var re = new RegExp(p.re.source, 'g'), m;
      while ((m = re.exec(code))) found.push({ raw: m[0], token: m[1], at: m.index });
    });
    if (found.length) {
      found.sort(function (a, b) { return a.at - b.at; });
      return found;
    }
    // 连续下划线（每一个 ____ 视为一个空）
    var re = /_{3,}/g, m, out = [];
    while ((m = re.exec(code))) out.push({ raw: m[0], token: String(out.length + 1), at: m.index });
    return out;
  }

  function normalizeFill(b) {
    var code = str(b.code);
    var phs = scanBlanks(code);
    var answers = arr(b.answers).map(str);
    var blanks = arr(b.blanks).map(function (x, i) {
      return {
        ans: str(x.ans != null ? x.ans : x.answer != null ? x.answer : answers[i]),
        hint: str(x.hint || ''),
        options: arr(x.options)
      };
    });
    if (!blanks.length && answers.length) {
      blanks = answers.map(function (a) { return { ans: a, hint: '', options: [] }; });
    }
    if (!blanks.length) blanks = phs.map(function () { return { ans: '', hint: '', options: [] }; });
    return {
      t: 'fill',
      key: b.key,
      title: str(b.title),
      prompt: str(b.prompt || b.desc || b.ask || ''),
      hint: str(b.hint || ''),
      why: str(b.why || b.explain || ''),
      output: str(b.output || b.result || ''),
      code: code,
      phs: phs,
      blanks: blanks
    };
  }

  function normalizePredict(b) {
    var out = b.output;
    if (Array.isArray(out)) out = out.join('\n');
    return {
      t: 'predict',
      key: b.key,
      title: str(b.title),
      prompt: str(b.prompt || b.desc || b.ask || ''),
      file: str(b.file || 'main.cpp'),
      code: str(b.code),
      lines: Array.isArray(out) ? out : str(out).replace(/\n$/, '').split('\n'),
      hint: str(b.hint || ''),
      why: str(b.why || b.note || b.explain || '')
    };
  }

  function normalizeOrder(b) {
    var items = arr(b.items).map(function (x, i) {
      if (typeof x === 'string') return { t: x, n: i + 1 };
      return { t: str(x.t || x.text || x.code), n: i + 1 };
    });
    var ans = arr(b.answer).map(function (x) { return parseInt(x, 10); });
    if (!ans.length) ans = items.map(function (_, i) { return i + 1; });
    return {
      t: 'order',
      key: b.key,
      title: str(b.title),
      prompt: str(b.prompt || b.desc || b.ask || ''),
      items: items,
      answer: ans,
      hint: str(b.hint || ''),
      why: str(b.why || b.explain || b.note || '')
    };
  }

  function normalizeTrace(b) {
    // 形态 A：表格型 cols + rows[{expr,ans}]
    if (arr(b.cols).length || (arr(b.rows).length && b.rows[0] && b.rows[0].expr != null)) {
      var cols = arr(b.cols);
      if (!cols.length) cols = ['表达式', '结果'];
      var rows = arr(b.rows).map(function (r) {
        if (Array.isArray(r)) return { cells: r.map(str) };
        return { expr: str(r.expr != null ? r.expr : (r.e != null ? r.e : '')), ans: str(r.ans != null ? r.ans : (r.v != null ? r.v : '')), note: str(r.note || '') };
      });
      return {
        t: 'trace', mode: 'table', key: b.key, title: str(b.title),
        prompt: str(b.prompt || b.desc || b.ask || ''), cols: cols, rows: rows,
        code: str(b.code || ''), output: str(b.output || ''),
        why: str(b.why || b.note || b.explain || '')
      };
    }
    // 形态 B：步骤型 steps[{line,value}]
    var steps = arr(b.steps).map(function (s) {
      return { line: str(s.line != null ? s.line : s.e || ''), value: str(s.value != null ? s.value : s.v || '') };
    });
    return {
      t: 'trace', mode: 'steps', key: b.key, title: str(b.title),
      prompt: str(b.prompt || b.desc || b.ask || ''), steps: steps,
      code: str(b.code || ''), output: str(b.output || b.result || ''),
      why: str(b.why || b.note || b.explain || '')
    };
  }

  function normalizeMatch(b) {
    var pairs = arr(b.pairs).map(function (p) {
      return { l: str(p.l != null ? p.l : (p.a != null ? p.a : (p.left || ''))), r: str(p.r != null ? p.r : (p.b != null ? p.b : (p.right || ''))) };
    });
    return {
      t: 'match', key: b.key, title: str(b.title),
      prompt: str(b.prompt || b.desc || b.ask || ''), pairs: pairs,
      why: str(b.why || b.note || b.explain || '')
    };
  }

  function normalizeBug(b) {
    var lines = arr(b.answers).map(function (x) { return parseInt(x, 10); });
    if (!lines.length && b.line != null) lines = [parseInt(b.line, 10)];
    if (!lines.length && b.bugLines) lines = arr(b.bugLines).map(function (x) { return parseInt(x, 10); });
    return {
      t: 'bug', key: b.key, title: str(b.title),
      prompt: str(b.prompt || b.desc || b.ask || ''),
      code: str(b.code), lines: lines,
      actual: str(b.actual || ''), expected: str(b.expected || ''),
      fix: str(b.fix || ''), hint: str(b.hint || ''),
      answer: str(b.answer || ''),
      why: str(b.why || b.explain || b.note || '')
    };
  }

  function normalizeQuiz(b) {
    var qs = arr(b.questions).map(function (q, qi) {
      var opts = arr(q.opts).map(function (o, oi) {
        return { t: str(o.t != null ? o.t : o.text), ok: !!(o.correct || o.ok || o.right), idx: oi };
      });
      var okIdx = opts.findIndex(function (o) { return o.ok; });
      if (okIdx < 0) { okIdx = 0; if (opts[0]) opts[0].ok = true; }
      return {
        i: qi, q: str(q.q || q.question), opts: opts, ok: okIdx,
        why: str(q.why || ''), wrongWhy: str(q.wrongWhy || q.wrong || '')
      };
    });
    return { t: 'quiz', key: b.key, questions: qs };
  }

  function normalizeExercise(b) {
    var items = arr(b.items).map(function (it, i) {
      return { i: i, level: str(it.level || 'easy'), title: str(it.title), desc: str(it.desc || '') };
    });
    return { t: 'exercise', key: b.key, items: items };
  }

  function normalizeBlock(b, i, lessonId) {
    if (!b || !b.t) return null;
    b.key = lessonId + '#' + i;
    switch (b.t) {
      case 'prose': return { t: 'prose', key: b.key, html: str(b.html || b.text || '') };
      case 'code': return {
        t: 'code', key: b.key, file: str(b.file || 'main.cpp'),
        code: str(b.code), note: str(b.note || b.desc || ''), lang: str(b.lang || 'cpp')
      };
      case 'box': return {
        t: 'box', key: b.key, kind: str(b.kind || 'tip'),
        title: str(b.title || ''), text: str(b.text || b.body || '')
      };
      case 'fill': return normalizeFill(b);
      case 'predict': return normalizePredict(b);
      case 'order': return normalizeOrder(b);
      case 'trace': return normalizeTrace(b);
      case 'match': return normalizeMatch(b);
      case 'bug': return normalizeBug(b);
      case 'quiz': return normalizeQuiz(b);
      case 'exercise': return normalizeExercise(b);
      default: return null;
    }
  }

  function normalizeWeek(w) {
    if (!w || !Array.isArray(w.lessons)) return null;
    w.lessons.forEach(function (l) {
      if (!l) return;
      var out = [];
      arr(l.blocks).forEach(function (b, i) {
        var n = normalizeBlock(b, i, l.id);
        if (n) out.push(n);
      });
      l.blocks = out;
      l.summary = str(l.summary || '');
      l.keypoints = arr(l.keypoints);
      l.total = out.length;
      l.interactive = out.filter(function (b) {
        return ['fill', 'predict', 'order', 'trace', 'match', 'bug', 'quiz', 'exercise'].indexOf(b.t) >= 0;
      }).length;
    });
    return w;
  }

  window.normalizeAll = function () {
    Object.keys(window.CONTENT).forEach(function (k) {
      var w = normalizeWeek(window.CONTENT[k]);
      if (!w) delete window.CONTENT[k];
    });
  };
  window.normalizeAll = window.normalizeAll;
})();

</script>
<script data-src="assets/js/blocks.js">
/* ================================================================
   blocks.js · 内容块渲染 + 互动判题
   ================================================================ */
(function () {
  'use strict';

  /* ---------------- C++ 轻量高亮 ---------------- */
  var KW = 'int double float char bool void long short unsigned signed if else for while do switch case default break continue return const static struct class enum typedef template typename namespace using public private protected new delete sizeof try catch throw auto'.split(' ');
  var STD = 'include iostream algorithm vector string cmath cstdlib iomanip bits std cstdio climits stdc++.h'.split(' ');
  var LIT = 'true false NULL nullptr endl cout cin cerr'.split(' ');

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function hlLine(line) {
    if (/^\s*#/.test(line)) return '<span class="t-pre">' + esc(line) + '</span>';
    var out = '', re = /(\/\/[^\n]*$)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
    var last = 0, m;
    while ((m = re.exec(line))) {
      out += esc(line.slice(last, m.index));
      if (m[1]) out += '<span class="t-com">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="t-str">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="t-num">' + esc(m[3]) + '</span>';
      else {
        var w = m[4];
        if (KW.indexOf(w) >= 0) out += '<span class="t-kw">' + w + '</span>';
        else if (LIT.indexOf(w) >= 0) out += '<span class="t-lit">' + w + '</span>';
        else if (STD.indexOf(w) >= 0) out += '<span class="t-inc">' + w + '</span>';
        else out += esc(w);
      }
      last = m.index + m[0].length;
    }
    out += esc(line.slice(last));
    return out;
  }
  function hl(code) { return String(code).split('\n').map(hlLine).join('\n'); }

  /* ---------------- 通用小件 ---------------- */
  var CODE_INDEX = {};
  window.__CODE__ = CODE_INDEX;

  function head(iconName, label, tone) {
    return '<div class="blk-head tone-' + (tone || 'plain') + '"><span class="blk-ico">' + U.icon(iconName, 15) + '</span>' +
      '<span class="blk-label">' + esc(label) + '</span><span class="blk-state"></span></div>';
  }
  function setState(el, kind, text) {
    if (!el) return;
    var s = el.querySelector('.blk-state');
    if (!s) return;
    s.className = 'blk-state ' + (kind || '');
    s.innerHTML = text || '';
  }
  function paintState(root, kind, text) {
    var s = root.querySelector('.blk-state');
    if (!s) return;
    s.className = 'blk-state ' + (kind || '');
    s.innerHTML = text || '';
  }
  function solvedState(key) {
    var st = U.state().inter[key];
    if (!st) return '';
    return st.ok ? '<span class="blk-state ok">' + U.icon('check', 13) + '已通过</span>'
      : '<span class="blk-state bad">' + U.icon('x', 13) + '再试一次</span>';
  }
  function patchState(root, b) {
    var st = U.state().inter[b.key];
    if (!st) { paintState(root, '', U.icon('puzzle', 13) + '待挑战'); return; }
    paintState(root, st.ok ? 'ok' : 'bad', U.icon(st.ok ? 'check' : 'x', 13) + (st.ok ? '已通过' : '再试一次'));
  }
  function markInter(key, ok, xp) {
    var s = U.state();
    var prev = s.inter[key];
    s.inter[key] = { done: true, ok: !!ok };
    U.store.save();
    if (!prev) { U.addXp(xp || 8, 'inter:' + key); U.recordActivity(1); }
    else if (!prev.ok && ok) U.addXp(Math.round((xp || 8) / 2), 'inter-fix:' + key);
    document.dispatchEvent(new Event('lessonprogress'));
  }
  function verdict(root, ok, html) {
    var box = root.querySelector('.vz');
    if (!box) return;
    box.className = 'vz show ' + (ok ? 'ok' : 'bad');
    box.innerHTML = '<span class="fb-ico">' + U.icon(ok ? 'check' : 'x', 15) + '</span><div>' + html +
      '<div class="fb-sub">' + U.icon('bulb', 13) + ' ' + esc(ok ? '做对了。解析在下面，花 10 秒看一眼，印象会更深。' : '先把思路过一遍，再回头改，别急着乱试。') + '</div></div>';
  }
  function note(root, html) {
    var box = root.querySelector('.why');
    if (!box) { box = document.createElement('div'); box.className = 'why'; root.appendChild(box); }
    box.className = 'why show';
    box.innerHTML = '<b>' + U.icon('bulb', 13) + ' 为什么</b><div>' + html + '</div>';
  }

  /* ---------------- 代码块（可真跑） ---------------- */
  function renderCode(b) {
    CODE_INDEX[b.key] = b;
    var needIn = /\bcin\s*(>>|\.get)/.test(b.code) || /getline/.test(b.code);
    return '<figure class="cb" data-cb="' + b.key + '">' +
      '<div class="cb-bar"><span class="cb-file">' + U.icon('note', 13) + ' ' + esc(b.file) + '</span>' +
      '<span class="cb-tools">' +
      '<button class="cb-btn primary" data-act="run-code" data-key="' + b.key + '">' + U.icon('play', 13) + ' 运行</button>' +
      '<button class="cb-btn" data-act="copy-code" data-key="' + b.key + '">复制</button>' +
      '<button class="cb-btn" data-act="to-ide" data-key="' + b.key + '">练习场打开</button>' +
      '</span></div>' +
      '<pre class="cb-code"><code>' + hl(b.code) + '</code></pre>' +
      '<div class="cb-run">' +
      (needIn ? '<label class="cb-stdin"><span>输入 stdin</span><textarea rows="2" data-stdin="' + b.key + '" placeholder="88 95 76"></textarea></label>' : '') +
      '<div class="cb-result" data-result="' + b.key + '"></div></div>' +
      (b.note ? '<figcaption class="cb-note">' + esc(b.note) + '</figcaption>' : '') +
      '</figure>';
  }
  function showResult(key, html, cls) {
    var box = document.querySelector('[data-result="' + key + '"]');
    if (!box) return;
    box.className = 'cb-result show ' + (cls || '');
    box.innerHTML = html;
  }
  function runByKey(key, codeOverride) {
    var b = CODE_INDEX[key];
    if (!b) return;
    var code = codeOverride != null ? codeOverride : b.code;
    var el = document.querySelector('[data-stdin="' + key + '"]');
    var stdin = el ? el.value.replace(/\r/g, '') : '';
    showResult(key, '<div class="rs pending"><span class="spin"></span>正在提交给 g++ 13.2 编译（最多 12 秒，超时会自动切本地自检）…</div>');
    U.runCode(code, stdin).then(function (r) {
      if (r.offline) {
        var iss = U.staticCheck(code);
        showResult(key, '<div class="rs warn"><div class="rs-h">' + U.icon('alert', 14) + ' 在线编译器暂不可用（' + esc(r.message || '网络受限') + '）</div>' +
          '<div class="rs-sub">已切换本地静态自检：</div><ul class="rs-list">' +

  function fillMarkup(b) {
    var code = b.code, out = '', last = 0, seen = {};
    b.phs.forEach(function (p, i) {
      var token = p.token, owner = seen[token];
      if (owner === undefined) { seen[token] = i; owner = i; }
      var at = code.indexOf(p.raw, last);
      if (at < 0) return;
      out += hl(code.slice(last, at));
      if (owner === i) {
        out += '<span class="gap" data-gap="' + i + '"><input class="gap-in" data-blank="' + i + '" spellcheck="false" autocomplete="off" placeholder="空' + (i + 1) + '"></span>';
      } else {
        out += '<span class="gap ghost" data-gap="' + owner + '"><span class="ghost-in" data-mirror="' + owner + '"></span></span>';
      }
      last = at + p.raw.length;
    });
    out += hl(code.slice(last));
    return out;
  }
  function fillValues(root) {
    var vals = [];

  }
  function fillResolved(b, vals) {
    var code = b.code, out = '', last = 0;
    b.phs.forEach(function (p, i) {
      var at = code.indexOf(p.raw, last);
      if (at < 0) return;
      out += code.slice(last, at);
      out += vals[i] != null && vals[i] !== '' ? vals[i] : p.raw;
      last = at + p.raw.length;
    });
    return out + code.slice(last);
  }
  function checkFill(root, b) {
    var vals = fillValues(root);
    var results = [], allOk = true, empty = false;

      var v = vals[i];
      if (v == null || U.norm(v) === '') { empty = true; results.push({ i: i, ok: false, why: '还没填' }); allOk = false; return; }
      var ok = U.tight(v).toLowerCase() === U.tight(bl.ans).toLowerCase();
      if (!ok) allOk = false;
      results.push({ i: i, ok: ok, why: bl.hint || ('正确答案是 ' + bl.ans) });
    });
    U.$$('.gap-in', root).forEach(function (inp) {
      var i = +inp.getAttribute('data-blank');
      inp.classList.remove('ok', 'bad');
      inp.classList.add(results[i] && results[i].ok ? 'ok' : 'bad');
    });
    syncMirrors(root, vals);
    if (empty) { verdict(root, false, '还有空没填。'); return; }
    markInter(b.key, allOk, 10);
    patchState(root, b);
    verdict(root, allOk, '<b>' + (allOk ? '全对，这段程序可以跑了。' : '有空填错了，黄色输入是正确方向：') + '</b>' +
      (allOk ? '' : '<ul class="vz-list">' + results.filter(function (r) { return !r.ok; }).map(function (r) {
        return '<li>空 ' + (r.i + 1) + '：' + esc(r.why) + '</li>';
      }).join('') + '</ul>'));

    return '<section class="blk inter" data-bug="' + b.key + '">' + head('bug', b.title || '找出有问题的那一行', 'red') +
      (b.prompt ? '<p class="blk-p">' + b.prompt + '</p>' : '') +
      (b.hint ? '<div class="blk-row"><button class="cb-btn" data-act="hint" data-target="' + b.key + '">' + U.icon('bulb', 13) + ' 提示</button></div><div class="hint" data-hint="' + b.key + '" hidden>' + U.icon('bulb', 13) + ' ' + esc(b.hint) + '</div>' : '') +
      '<div class="bug-code">' + lines.map(function (l, i) {
        return '<div class="bug-line" data-ln="' + (i + 1) + '"><span class="bug-n">' + (i + 1) + '</span><code>' + (hl(l) || '&nbsp;') + '</code></div>';
      }).join('') + '</div>' +
      '<div class="blk-row"><span class="blk-tip">点击你认为有问题的行，可选多行</span>' +
      '<button class="cb-btn" data-act="reset-bug" data-key="' + b.key + '">重新作答</button>' +
      '<button class="cb-btn primary" data-act="check-bug" data-key="' + b.key + '">' + U.icon('check', 13) + ' 指认</button>' +
      (b.code && /int\s+main/.test(b.code) ? '<button class="cb-btn" data-act="run-bug" data-key="' + b.key + '">' + U.icon('play', 13) + ' 运行看报错</button>' : '') +
      '</div>' +
      '<div class="vz"></div><div class="cb-result" data-result="' + b.key + '"></div>' +
      '</section>';
  }
  function bugToggle(el) {
    el.classList.toggle('picked');
  }
  function resetBug(root) {
    U.$$('.bug-line', root).forEach(function (x) { x.classList.remove('picked', 'truth', 'bad'); });
    var v = root.querySelector('.vz'); if (v) v.className = 'vz';
    var why = root.querySelector('.why'); if (why) why.className = 'why';
  }
  function checkBug(root, b) {
    var got = U.$$('.bug-line.picked', root).map(function (x) { return +x.getAttribute('data-ln'); });
    if (!got.length) { verdict(root, false, '先点一行。'); return; }
    var ok = got.length === b.lines.length && got.every(function (n) { return b.lines.indexOf(n) >= 0; });
    U.$$('.bug-line', root).forEach(function (x) {
      var n = +x.getAttribute('data-ln');
      if (b.lines.indexOf(n) >= 0) x.classList.add('truth');
      else if (x.classList.contains('picked')) x.classList.add('bad');
    });
    markInter(b.key, ok, 10);
    patchState(root, b);
    verdict(root, ok, ok ? '<b>抓到了，就是这 ' + b.lines.length + ' 行。</b>' : '<b>不完全对。</b>问题在第 ' + b.lines.join('、') + ' 行。');
    var extra = '';
    if (b.actual) extra += '<div class="kv"><span>现在的输出</span><code>' + esc(b.actual) + '</code></div>';
    if (b.expected) extra += '<div class="kv"><span>应有的输出</span><code>' + esc(b.expected) + '</code></div>';
    if (b.fix) extra += '<div class="kv"><span>怎么改</span><pre class="rs-pre">' + hl(b.fix) + '</pre></div>';
    note(root, '<div>' + (b.why || b.answer || '') + '</div>' + extra);
  }

  /* ---------------- exercise ---------------- */
  function renderExercise(b) {
    var s = U.state();
    return '<section class="blk inter" data-ex="' + b.key + '">' + head('code', '动手题 · 做完自己打勾', 'green') +
      '<div class="ex-list">' + b.items.map(function (it) {
        var done = s.exercise[b.key] && s.exercise[b.key][it.i];
        return '<div class="ex-card"><div class="ex-top"><span class="ex-badge ' + (it.level === 'easy' ? 'easy' : 'mid') + '">' + (it.level === 'easy' ? '基础' : '进阶') + '</span>' +
          '<b>' + esc(it.title) + '</b></div>' +
          '<p class="ex-desc">' + esc(it.desc) + '</p>' +
          '<button class="ex-check' + (done ? ' done' : '') + '" data-exi="' + it.i + '">' +
          '<span class="tick">' + U.icon('check', 13) + '</span>' + (done ? '已完成' : '标记完成') + '</button></div>';
      }).join('') + '</div></section>';
  }
  function exToggle(root, b, btn) {
    var i = +btn.getAttribute('data-exi');
    var s = U.state();
    s.exercise[b.key] = s.exercise[b.key] || {};
    var now = !s.exercise[b.key][i];
    s.exercise[b.key][i] = now;
    U.store.save();
    btn.classList.toggle('done', now);
    btn.innerHTML = '<span class="tick">' + U.icon('check', 13) + '</span>' + (now ? '已完成' : '标记完成');
    if (now) { U.addXp(8, 'ex:' + b.key); U.recordActivity(1); }
    var total = b.items.length, n = U.$$('.ex-check.done', root).length;
    paintState(root, n === total ? 'ok' : '', U.icon(n === total ? 'check' : 'code', 13) + n + ' / ' + total + ' 题');
    document.dispatchEvent(new Event('lessonprogress'));
  }

  /* ---------------- 渲染入口 ---------------- */
  function render(b) {
    switch (b.t) {
      case 'prose': return renderProse(b);
      case 'code': return renderCode(b);
      case 'box': return renderBox(b);
      case 'quiz': return renderQuiz(b);
      case 'fill': b.display = null; return renderFill(b);
      case 'predict': return renderPredict(b);
      case 'order': b.display = U.shuffle(b.answer); return renderOrder(b);
      case 'trace': return renderTrace(b);
      case 'match': return renderMatch(b);
      case 'bug': return renderBug(b);
      case 'exercise': return renderExercise(b);
      default: return '';
    }
  }
  function afterRender(root, blocks) {
    blocks.forEach(function (b) {
      var node = root.querySelector('[data-quiz="' + b.key + '"],[data-fill="' + b.key + '"],[data-predict="' + b.key + '"],[data-order="' + b.key + '"],[data-trace="' + b.key + '"],[data-match="' + b.key + '"],[data-bug="' + b.key + '"],[data-ex="' + b.key + '"]');
      if (!node) return;
      patchState(node, b);
      if (b.t === 'quiz') {
        var saved = U.state().quiz[b.key];
        if (saved) {
          var allRight = saved.right === saved.total;
          paintState(node, allRight ? 'ok' : 'bad', U.icon(allRight ? 'check' : 'x', 13) + (allRight ? '已通过' : '有错题'));
        }
      }
      if (b.t === 'order') {
        node.__display = b.display;
      }
      if (b.t === 'exercise') {
        var total = b.items.length, n = U.$$('.ex-check.done', node).length;
        paintState(node, n === total ? 'ok' : '', U.icon(n === total ? 'check' : 'code', 13) + n + ' / ' + total + ' 题');
      }
    });
  }

  /* ---------------- 事件总线 ---------------- */
  function onClick(e) {
    var t = e.target;
    var act = t.closest('[data-act]');
    if (act) {
      var a = act.getAttribute('data-act');
      if (a === 'run-code') { runByKey(act.getAttribute('data-key')); return true; }
      if (a === 'copy-code') { var bb = CODE_INDEX[act.getAttribute('data-key')]; U.copy(bb.code); U.toast('代码已复制', 'ok'); return true; }
      if (a === 'to-ide') {
        var b2 = CODE_INDEX[act.getAttribute('data-key')];
        var st = U.state(); st.drafts.main = b2.code; U.store.save();
        var el = document.querySelector('[data-stdin="' + b2.key + '"]');
        if (el) { st.drafts['main:stdin'] = el.value; U.store.save(); }
        location.hash = '#/playground';
        U.toast('已带到练习场', 'ok');
        return true;
      }
      if (a === 'check-fill') { var root1 = act.closest('[data-fill]'); var b3 = findBlock(root1); checkFill(root1, b3); return true; }
      if (a === 'run-fill') { var rf = act.closest('[data-fill]'); var bf = findBlock(rf); runByKey(bf.key, fillResolved(bf, fillValues(rf))); return true; }
      if (a === 'check-pred') { var rp = act.closest('[data-predict]'); checkPredict(rp, findBlock(rp)); return true; }
      if (a === 'run-pred') { var rp2 = act.closest('[data-predict]'); runByKey(findBlock(rp2).key); return true; }
      if (a === 'check-order') { var ro = act.closest('[data-order]'); var bo = findBlock(ro); checkOrder(ro, bo, orderSequence(ro)); return true; }
      if (a === 'reset-order') { var ro2 = act.closest('[data-order]'); resetOrder(ro2, findBlock(ro2)); return true; }
      if (a === 'check-trace') { var rt = act.closest('[data-trace]'); checkTrace(rt, findBlock(rt)); return true; }
      if (a === 'run-trace') { var rt2 = act.closest('[data-trace]'); var bt = findBlock(rt2); runByKey(bt.key, bt.code || bt.output); return true; }
      if (a === 'reset-match') { resetMatch(act.closest('[data-match]')); return true; }
      if (a === 'check-match') { var rm = act.closest('[data-match]'); var bm = findBlock(rm); checkMatchAll(rm, bm); return true; }
      if (a === 'check-bug') { var rb = act.closest('[data-bug]'); checkBug(rb, findBlock(rb)); return true; }
      if (a === 'reset-bug') { resetBug(act.closest('[data-bug]')); return true; }
      if (a === 'run-bug') { var rb2 = act.closest('[data-bug]'); var bb2 = findBlock(rb2); runByKey(bb2.key, bb2.code); return true; }
      if (a === 'hint') { var h = root().querySelector('[data-hint="' + act.getAttribute('data-target') + '"]'); if (h) h.hidden = !h.hidden; return true; }
    }
    // 卡片类
    var opt = t.closest('.q-opt');
    if (opt) {
      var card = opt.closest('.q-card');
      if (!card.classList.contains('answered')) {
        U.$$('.q-opt', card).forEach(function (x) { x.classList.remove('sel'); });
        opt.classList.add('sel');
        var rq = card.closest('[data-quiz]');
        quizClick(card, rq, findBlock(rq));   // 豆包 P0 修复：选中即判定
      }
      return true;
    }
    if (t.closest('.q-card') && t.closest('.q-card').classList.contains('answered') === false) {
      var c2 = t.closest('.q-card');
      if (c2.querySelector('.q-opt.sel')) {
        var r2 = c2.closest('[data-quiz]');
        quizClick(c2, r2, findBlock(r2));
        return true;
      }
    }
    var ord = t.closest('.ord-item');
    if (ord) {
      var ro3 = ord.closest('[data-order]');
      if (!ro3.querySelector('.vz.show')) orderPick(ro3, ord, findBlock(ro3));
      return true;
    }
    var mt = t.closest('.mt-item');
    if (mt) { var rm2 = mt.closest('[data-match]'); if (!mt.classList.contains('matched')) matchPick(rm2, mt, findBlock(rm2)); return true; }
    var bg = t.closest('.bug-line');
    if (bg) { if (!bg.closest('[data-bug]').querySelector('.truth')) bugToggle(bg); return true; }
    var ex = t.closest('.ex-check');
    if (ex) { var rx = ex.closest('[data-ex]'); exToggle(rx, findBlock(rx), ex); return true; }
    return false;
  }
  function root() { return document.getElementById('view'); }
  var BLOCKS = [];
  function setBlocks(list) { BLOCKS = list; }
  function findBlock(node) {
    var key = null;
    ['data-quiz', 'data-fill', 'data-predict', 'data-order', 'data-trace', 'data-match', 'data-bug', 'data-ex'].some(function (at) {
      var v = node.getAttribute(at); if (v) { key = v; return true; } return false;
    });
    return BLOCKS.filter(function (b) { return b.key === key; })[0];
  }
  function checkMatchAll(root2, b) {
    var picked = U.$$('.mt-item.matched', root2).length;
    if (picked === b.pairs.length * 2) { markInter(b.key, true, 10); verdict(root2, true, '<b>全部连对。</b>'); if (b.why) note(root2, '<div>' + b.why + '</div>'); return; }
    verdict(root2, false, '还有 ' + ((b.pairs.length * 2 - picked) / 2) + ' 对没连上。');
  }

  window.Blocks = {
    render: render,
    afterRender: afterRender,
    onClick: onClick,
    setBlocks: setBlocks,
    runByKey: runByKey,
    hl: hl
  };
})();

</script>
<script data-src="assets/js/views.js">
/* ================================================================
   views.js · 各路由视图
   ================================================================ */
(function () {
  'use strict';
  var V = {};

  function pct(n, d) { return d ? Math.round(n / d * 100) : 0; }
  function weekDoneCount(w) {
    var c = window.CONTENT[w]; if (!c) return 0;
    return c.lessons.filter(function (l) { return U.state().completed.indexOf(l.id) >= 0; }).length;
  }
  function weekTotal(w) { var c = window.CONTENT[w]; return c ? c.lessons.length : 0; }

  /* 连续可学的下一课时 */
  function nextLesson() {
    var s = U.state();
    var weeks = Object.keys(window.CONTENT).map(Number).sort(function (a, b) { return a - b; });
    for (var i = 0; i < weeks.length; i++) {
      var w = weeks[i];
      var c = window.CONTENT[w];
      for (var j = 0; j < c.lessons.length; j++) {
        var l = c.lessons[j];
        if (s.completed.indexOf(l.id) < 0) return { week: w, lesson: l, index: j };
      }
    }
    return null;
  }
  V.nextLesson = nextLesson;

  /* ============================ 仪表盘 ============================ */
  V.dashboard = function (el) {
    var s = U.state();
    var done = U.doneCount(), total = U.allLessonCount();
    var lv = U.level();
    var nxt = nextLesson();
    var due = dueReviewCards().length;
    var todayN = s.activity[U.today()] || 0;
    var checked = s.checkin.indexOf(U.today()) >= 0;

    var html = '';
    /* Hero */
    html += '<section class="hero">' +
      '<div class="hero-main">' +
      '<div class="hero-kicker">' + U.icon('spark', 13) + '数据科学 · 大一 C++ · 16 周陪跑</div>' +
      '<h1 class="hero-title">把 C++ 学成能交差的活儿</h1>' +
      '<p class="hero-sub">每课都能<b>当场编译运行</b>，看得到报错、改得动代码。不是看视频记笔记，是把手弄脏。</p>' +
      '<div class="hero-cta">' +
      (nxt
        ? '<a class="btn primary lg" href="#/lesson/' + nxt.week + '/' + nxt.lesson.id + '">' + U.icon('play', 15) + '继续第 ' + nxt.week + ' 周 · ' + U.esc(nxt.lesson.title) + '</a>'
        : '<a class="btn primary lg" href="#/curriculum">' + U.icon('book', 15) + '回到课程大纲</a>') +
      '<a class="btn ghost lg" href="#/playground">' + U.icon('terminal', 15) + '打开练习场</a>' +
      '</div>' +
      '<div class="hero-meta">' +
      '<span><b>' + total + ' 课时</b>已上线</span>' +
      '<span><b>' + total + ' 课时</b>完整大纲</span>' +
      '<span><b>真实 g++</b> 在线编译</span>' +
      '</div>' +
      '</div>' +
      '<aside class="hero-side">' +
      '<div class="lvl"><div class="lvl-top"><span class="lvl-n">Lv.' + lv.lv + '</span><span class="lvl-xp">' + lv.xp + ' XP</span></div>' +
      '<div class="lvl-bar"><i style="width:' + lv.pct + '%"></i></div>' +
      '<div class="lvl-foot">距离 Lv.' + (lv.lv + 1) + ' 还差 ' + Math.max(0, lv.next - lv.cur) + ' XP</div></div>' +
      '<div class="hero-stats">' +
      '<div><b>' + done + '</b><span>完成课时</span></div>' +
      '<div><b>' + U.streak() + '</b><span>连续天数</span></div>' +
      '<div><b>' + due + '</b><span>待复习卡片</span></div>' +
      '<div><b>' + todayN + '</b><span>今日互动</span></div>' +
      '</div>' +
      '<button class="btn ' + (checked ? 'ghost' : 'primary') + ' full" id="checkinBtn">' + U.icon(checked ? 'check' : 'flame', 15) + (checked ? '今天已打卡' : '今日打卡 +5 XP') + '</button>' +
      '</aside>' +
      '</section>';

    /* 今日任务 + 复习 */
    html += '<div class="grid g2">';
    html += '<section class="card">' +
      '<div class="card-h"><h3>' + U.icon('target', 15) + '今日任务</h3><span class="card-x">' + U.today() + '</span></div>' +
      '<div class="tasks">' +
      taskRow(checked, '打卡 1 次', '+5 XP', null) +
      taskRow(todayN >= 3, '完成 3 个互动练习', todayN + ' / 3', null) +
      taskRow(due === 0, '清空今日复习队列', due + ' 张待复习', '#/review') +
      taskRow(!!nxt && weekDoneCount(nxt.week) === weekTotal(nxt.week), '推进一个课时', nxt ? '第 ' + nxt.week + ' 周 · ' + U.esc(nxt.lesson.title) : '已全部完成', nxt ? '#/lesson/' + nxt.week + '/' + nxt.lesson.id : null) +
      '</div></section>';

    html += '<section class="card">' +
      '<div class="card-h"><h3>' + U.icon('cards', 15) + '复习本</h3><a class="card-link" href="#/review">全部卡片</a></div>' +
      (due ? '<p class="card-p">今天有 <b>' + due + '</b> 张卡片到期，每张 10 秒，错过明天会重新排期。</p>' +
        '<a class="btn primary full" href="#/review">' + U.icon('play', 15) + '开始复习 round</a>'
        : '<p class="card-p muted">今天的复习清空了。答错过的题会自动按艾宾浩斯曲线排回来。</p>' +
        '<div class="empty-mini">' + U.icon('check', 22) + '<span>今日无待复习卡片</span></div>') +
      '<div class="mini-line">累计复习 <b>' + U.reviewedCount() + '</b> 次 · 错题 <b>' + U.state().mistakes.length + '</b> 条</div>' +
      '</section>';
    html += '</div>';

    /* 热力图 */
    html += '<section class="card">' +
      '<div class="card-h"><h3>' + U.icon('calendar', 15) + '学习日历</h3><span class="card-x">最近 16 周</span></div>' +
      heatmap() + '</section>';

    /* 周进度条 */
    html += '<section class="card">' +
      '<div class="card-h"><h3>' + U.icon('layers', 15) + '各周进度</h3><a class="card-link" href="#/curriculum">完整大纲</a></div>' +
      '<div class="wbar-list">' + Object.keys(window.CONTENT).map(Number).sort(function (a, b) { return a - b; }).map(function (w) {
        var wk = WEEKS.filter(function (x) { return x.id === w; })[0];
        var t = weekTotal(w), d = weekDoneCount(w), p = pct(d, t);
        return '<a class="wbar" href="#/week/' + w + '">' +
          '<span class="wbar-n">' + String(w).padStart(2, '0') + '</span>' +
          '<span class="wbar-t">' + esc((wk && wk.title) || ('第 ' + w + ' 周')) + '</span>' +
          '<span class="wbar-bar"><i style="width:' + p + '%"></i></span>' +
          '<span class="wbar-p">' + d + '/' + t + '</span></a>';
      }).join('') + '</div></section>';

    /* 速览：本周待办 + 最近打卡 */
    html += '<div class="grid g2">' +
      '<section class="card"><div class="card-h"><h3>' + U.icon('bulb', 15) + '学习建议</h3></div><div class="tips">' +
      tipRow('先跑再读', '看到代码块先点「运行」，看输出长什么样，再回头读讲解。') +
      tipRow('改一行试试', '把 7/2 改成 7.0/2，把 100 改成 100.0，看屏幕怎么变——这比记规则管用。') +
      tipRow('错题别放过', '答错的题自动进复习本，第二天会出现一次，别跳过。') +
      '</div></section>' +
      '<section class="card"><div class="card-h"><h3>' + U.icon('clock', 15) + '最近打卡</h3></div>' +
      (s.checkin.length
        ? '<div class="timeline">' + s.checkin.slice().sort().reverse().slice(0, 8).map(function (d) {
          return '<div class="tl"><span class="tl-dot"></span><span class="tl-d">' + d + '</span><span class="tl-x">打了卡</span></div>';
        }).join('') + '</div>'
        : '<div class="empty-mini">' + U.icon('flame', 22) + '<span>还没有打卡记录</span></div>') +
      '</section></div>';

    el.innerHTML = html;
    el.classList.toggle('is-new', done === 0);   // 豆包 P0：0/45 首屏只留 hero + 今日任务
  };
  function esc(s) { return U.esc(s); }
  function tipRow(t, d) {
    return '<div class="tip-row"><b>' + esc(t) + '</b><span>' + esc(d) + '</span></div>';
  }
  function taskRow(done, title, sub, href) {
    var inner = '<span class="tick">' + U.icon(done ? 'check' : 'target', 14) + '</span>' +
      '<span class="t-t">' + esc(title) + '</span><span class="t-s">' + esc(sub) + '</span>';
    return href
      ? '<a class="task' + (done ? ' done' : '') + '" href="' + href + '">' + inner + '</a>'
      : '<div class="task' + (done ? ' done' : '') + '">' + inner + '</div>';
  }
  function heatmap() {
    var s = U.state();
    var cells = [], max = 1;
    for (var i = 111; i >= 0; i--) {
      var d = U.daysAgo(i);
      var n = (s.activity[d] || 0) + (s.checkin.indexOf(d) >= 0 ? 1 : 0);
      if (n > max) max = n;
      cells.push({ d: d, n: n });
    }
    return '<div class="hm">' + cells.map(function (c) {
      var lv = c.n === 0 ? 0 : Math.min(4, Math.ceil(c.n / max * 4));
      return '<i class="hm-c l' + lv + '" title="' + c.d + ' · ' + c.n + ' 次"></i>';
    }).join('') + '</div>' +
      '<div class="hm-legend"><span>少</span><i class="hm-c l0"></i><i class="hm-c l1"></i><i class="hm-c l2"></i><i class="hm-c l3"></i><i class="hm-c l4"></i><span>多</span></div>';
  }

  /* ============================ 复习卡片池 ============================ */
  function allCards() {
    var out = [];
    Object.keys(window.CONTENT).forEach(function (w) {
      (window.CONTENT[w].lessons || []).forEach(function (l) {
        (l.blocks || []).forEach(function (b) {
          if (b.t === 'quiz') {
            b.questions.forEach(function (q, qi) {
              out.push({
                id: b.key + '::' + qi,
                kind: '选择题', front: q.q,

        return '<div class="ach' + (on ? ' on' : '') + '"><div class="ach-m">' + U.icon(a.icon, 24) + '</div>' +
          '<b>' + esc(a.name) + '</b><span>' + esc(a.desc) + '</span>' +
          (!on && a.prog ? '<div class="ach-p">' + a.prog() + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  };

  /* ============================ 术语表 ============================ */
  V.glossary = function (el) {
    var q = '';
    el.innerHTML = '<div class="sec-head"><h2>术语表</h2><p>课上出现的黑话，随时回查。</p></div>' +
      '<div class="search-box">' + U.icon('search', 16) + '<input id="gq" placeholder="搜术语或解释…"></div>' +
      '<div id="glist" class="glist"></div>';
    var input = document.getElementById('gq');
    function draw() {
      var kw = String(input.value || '').toLowerCase();
      var list = (window.GLOSSARY || []).filter(function (g) {
        return !kw || (g.term + g.desc).toLowerCase().indexOf(kw) >= 0;
      });
      document.getElementById('glist').innerHTML = list.length
        ? list.map(function (g) {
          return '<details class="gl-item"><summary><b>' + esc(g.term) + '</b></summary><div>' + esc(g.desc) + '</div></details>';
        }).join('')
        : '<div class="empty-mini">' + U.icon('search', 22) + '<span>没有匹配的术语</span></div>';
    }
    input.addEventListener('input', draw);
    draw();
  };

  /* ============================ 资源 ============================ */
  V.resources = function (el) {
    el.innerHTML = '<div class="sec-head"><h2>外部资源</h2><p>精选的开源仓库与题库，都还在维护。</p></div>' +
      (window.RESOURCES || []).map(function (g) {
        return '<section class="card"><div class="card-h"><h3>' + esc(g.cat) + '</h3></div><div class="res-list">' +
          g.items.map(function (it) {
            return '<a class="res" href="' + U.esc(it.url) + '" target="_blank" rel="noopener">' +
              '<span class="res-n">' + esc(it.name) + '</span>' +
              '<span class="res-d">' + esc(it.desc) + '</span>' +
              '<span class="res-s">★ ' + esc(it.stars) + '</span></a>';
          }).join('') + '</div></section>';
      }).join('');
  };

  /* ============================ 设置 ============================ */
  V.settings = function (el) {
    var s = U.state();
    el.innerHTML = '<div class="sec-head"><h2>设置</h2><p>数据都存在你自己的浏览器里，不上传。</p></div>' +
      '<div class="grid g2">' +
      '<section class="card"><div class="card-h"><h3>外观</h3></div>' +
      '<div class="seg" id="themeSeg">' +
      ['light:浅色', 'dark:深色', 'auto:跟随系统'].map(function (x) {
        var p = x.split(':');
        return '<button class="seg-b' + (s.settings.theme === p[0] ? ' on' : '') + '" data-theme-set="' + p[0] + '">' + p[1] + '</button>';
      }).join('') + '</div>' +
      '<p class="card-p muted">深夜写代码建议切深色，代码高亮对比度更高。</p></section>' +
      '<section class="card"><div class="card-h"><h3>数据</h3></div>' +
      '<div class="btn-row"><button class="btn ghost" id="expBtn">' + U.icon('down', 15) + '导出进度</button>' +
      '<button class="btn ghost" id="impBtn">' + U.icon('up', 15) + '导入进度</button>' +
      '<input type="file" id="impFile" accept="application/json" hidden></div>' +
      '<p class="card-p muted">换电脑或清缓存前记得导出。</p></section>' +
      '<section class="card"><div class="card-h"><h3>危险操作</h3></div>' +
      '<button class="btn danger full" id="resetBtn">' + U.icon('trash', 15) + '清空所有学习进度</button>' +
      '</section>' +
      '</div>';
  };

  window.Views = V;
})();

</script>
<script data-src="assets/js/app.js">
/* ================================================================
   app.js · 外壳 / 路由 / 事件 / 命令面板
   ================================================================ */
(function () {
  'use strict';

  /* 图标别名 */
  var ALIAS = { terminal: 'term', calendar: 'cal', list: 'layers' };
  var _icon = U.icon;
  U.icon = function (n, s, f) { return _icon(ALIAS[n] || n, s, f); };

  /* ---------------- 主题 ---------------- */
  function applyTheme(mode) {
    var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var btn = document.getElementById('themeBtn');
    if (btn) btn.innerHTML = U.icon(dark ? 'moon' : 'sun', 17);
  }
  function setTheme(m) {
    U.state().settings.theme = m;
    U.store.save();
    applyTheme(m);
  }

  /* ---------------- 侧栏 ---------------- */
  var NAV = [
    { r: '#/dashboard', i: 'dash', t: '学习仪表盘' },
    { r: '#/curriculum', i: 'book', t: '课程大纲' },
    { r: '#/playground', i: 'term', t: '代码练习场' },
    { r: '#/review', i: 'cards', t: '复习本' },
    { r: '#/mistakes', i: 'bulb', t: '错题本' },
    { r: '#/achievements', i: 'award', t: '成就' },
    { r: '#/glossary', i: 'tags', t: '术语表' },
    { r: '#/resources', i: 'link', t: '外部资源' },
    { r: '#/settings', i: 'layers', t: '设置' }
  ];

  function renderShell() {
    var s = U.state();
    var due = Views.dueReviewCards().length;
    document.getElementById('navMain').innerHTML = NAV.map(function (n) {
      var badge = (n.r === '#/review' && due) ? '<span class="nav-badge">' + due + '</span>' : '';
      return '<a class="nav-i" href="' + n.r + '"><span class="nav-ico">' + U.icon(n.i, 17) + '</span><span>' + n.t + '</span>' + badge + '</a>';
    }).join('');

    var nxt = Views.nextLesson();
    document.getElementById('quickNav').innerHTML = nxt
      ? '<div class="quick-h">继续上次</div><a class="quick" href="#/lesson/' + nxt.week + '/' + nxt.lesson.id + '">' +
        '<span class="quick-t">第 ' + nxt.week + ' 周 · 课时 ' + (nxt.index + 1) + '</span>' +
        '<b>' + U.esc(nxt.lesson.title) + '</b>' +
        '<span class="quick-go">' + U.icon('play', 13) + '继续学</span></a>'
      : '';

    var done = U.doneCount(), total = U.allLessonCount(), lv = U.level();
    var p = total ? Math.round(done / total * 100) : 0;
    document.getElementById('sideProgress').innerHTML =
      '<div class="sp-top"><span>总进度</span><b>' + p + '%</b></div>' +
      '<div class="bar"><i style="width:' + p + '%"></i></div>' +
      '<div class="sp-foot">' + (done === 0 ? '从第 1 课开始 · 约 50 分钟' : 'Lv.' + lv.lv + ' · ' + done + ' / ' + total + ' 课时') + '</div>';
  }

  /* ---------------- 路由 ---------------- */
  function parts() {
    var h = (location.hash || '#/dashboard').replace(/^#\/?/, '');
    return h.split('/').filter(function (x) { return x !== ''; });
  }
  var TITLES = {
    dashboard: '学习仪表盘', curriculum: '课程大纲', playground: '代码练习场',
    review: '复习本', mistakes: '错题本', achievements: '成就',
    glossary: '术语表', resources: '外部资源', settings: '设置'
  };
  function route() {
    var p = parts();
    var view = p[0] || 'dashboard';
    var el = document.getElementById('view');
    el.classList.remove('is-new');   // 路由切换先清掉新生首屏标记，避免隐藏其他页面内容
    window.scrollTo(0, 0);
    document.body.scrollTop = 0;
    closeDrawer();
    el.innerHTML = '';
    try {
      switch (view) {
        case 'dashboard': Views.dashboard(el); break;
        case 'curriculum': Views.curriculum(el); break;
        case 'week': Views.week(el, +p[1]); break;
        case 'lesson': Views.lesson(el, +p[1], p[2]); break;
        case 'playground': Views.playground(el); wirePlayground(); break;
        case 'review': Views.review(el, p[1]); break;
        case 'mistakes': Views.mistakes(el); break;
        case 'achievements': Views.achievements(el); break;
        case 'glossary': Views.glossary(el); break;
        case 'resources': Views.resources(el); break;
        case 'settings': Views.settings(el); break;
        default: location.hash = '#/dashboard'; return;
      }
    } catch (err) {
      el.innerHTML = '<section class="card"><h3>这个页面渲染出错了</h3><pre class="pre-err">' + U.esc(String(err && err.stack || err)) + '</pre></section>';
      console.error(err);
    }
    document.getElementById('pageTitle').textContent = TITLES[view] || document.getElementById('pageTitle').textContent || '学习仪表盘';
    renderShell();
    markNav(view);
  }
  function markNav(view) {
    var map = { week: '#/curriculum', lesson: '#/curriculum' };
    var target = '#/' + (parts().join('/') || 'dashboard');
    U.$$('#navMain .nav-i').forEach(function (a) {
      var href = a.getAttribute('href');
      a.classList.toggle('on', href === target || (view === 'week' || view === 'lesson' ? href === '#/curriculum' : target.indexOf(href) === 0));
    });
  }
  function closeDrawer() {
    var sb = document.getElementById('sidebar'), sc = document.getElementById('scrim');
    if (sb) sb.classList.remove('open');
    if (sc) sc.classList.remove('on');
  }

  /* ---------------- 练习场 ---------------- */
  function wirePlayground() {
    var ta = document.getElementById('pgCode');
    if (!ta) return;
    var tin = document.getElementById('pgIn');
    var s = U.state();
    var save = U.debounce(function () {
      s.drafts.main = ta.value;
      if (tin) s.drafts['main:stdin'] = tin.value;
      U.store.save();
    }, 400);
    ta.addEventListener('input', save);
    if (tin) tin.addEventListener('input', save);
    ta.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runPg(); return; }
      if (e.key === 'Tab') {
        e.preventDefault();
        var st = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0, st) + '    ' + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = st + 4;
        save();
      }
    });
    U.$$('.pg-tpl .tpl').forEach(function (b) {
      b.onclick = function () {
        var t = window.TEMPLATES[+b.getAttribute('data-tpl')];
        if (!t) return;
        ta.value = t.code; s.drafts.main = t.code; U.store.save();
        U.toast('已载入模板：' + t.name, 'ok');
      };
    });
    document.getElementById('pgRun').onclick = runPg;
    document.getElementById('pgClear').onclick = function () {
      document.getElementById('pgOut').innerHTML = '<div class="pg-empty">输出区已清空</div>';
    };
    document.getElementById('pgCopy').onclick = function () { U.copy(ta.value); U.toast('代码已复制', 'ok'); };
    document.getElementById('pgFmt').onclick = function () { ta.value = reindent(ta.value); save(); U.toast('缩进整理了一遍', 'ok'); };
  }
  function reindent(code) {
    var out = [], depth = 0;
    code.split('\n').forEach(function (raw) {
      var t = U.norm(raw);
      if (!t) { out.push(''); return; }
      var openCount = (t.match(/[{[(]/g) || []).length - (t.match(/[}\])]/g) || []).length;
      if (/^[}\])]/.test(t)) depth = Math.max(0, depth - 1);
      out.push(new Array(depth + 1).join('    ') + t);
      if (openCount > 0) depth += openCount;
      else if (openCount < 0) depth = Math.max(0, depth + openCount);
    });
    return out.join('\n');
  }
  function runPg() {
    var ta = document.getElementById('pgCode'), out = document.getElementById('pgOut'), tin = document.getElementById('pgIn');
    if (!ta || !out) return;
    out.innerHTML = '<div class="rs pending"><span class="spin"></span>正在把代码交给 g++ 13.2 编译…</div>';
    U.runCode(ta.value, tin ? tin.value : '').then(function (r) {
      if (r.offline) {
        var iss = U.staticCheck(ta.value);
        out.innerHTML = '<div class="rs warn"><div class="rs-h">' + U.icon('alert', 14) + ' 云端编译器暂不可用（' + U.esc(r.message || '网络受限') + '）</div>' +
          '<div class="rs-sub">已切换到本地静态自检：</div><ul class="rs-list">' +
          iss.map(function (i) { return '<li class="' + i.lv + '">' + U.esc(i.msg) + '</li>'; }).join('') + '</ul></div>';
        return;
      }
      var st = U.state(); st.settings.ran = true; U.store.save();
      if (!r.ok) {
        out.innerHTML = '<div class="rs bad"><div class="rs-h">' + U.icon('x', 14) + ' 编译失败 · g++ 13.2 / gnu++17</div>' +
          '<pre class="rs-pre">' + U.esc(r.compile || r.err || '未知错误') + '</pre>' +
          '<div class="rs-tip">' + U.icon('bulb', 13) + ' 从第一条 error 看起，后面很多是连锁报错。</div></div>';
        return;
      }
      var warn = /warning:/.test(r.compile) ? '<details class="rs-warn"><summary>有编译告警，点开看看</summary><pre class="rs-pre">' + U.esc(r.compile) + '</pre></details>' : '';
      out.innerHTML = '<div class="rs ok"><div class="rs-h">' + U.icon('check', 14) + ' 运行成功' + (r.signal ? ' · signal ' + U.esc(r.signal) : '') + '</div>' +
        '<pre class="rs-pre out">' + U.esc(r.out || '(程序没有输出)') + '</pre>' + warn + '</div>';
      U.recordActivity(1);
    });
  }

  /* ---------------- 弹窗 ---------------- */
  function openModal(html) {
    closeModal();
    var wrap = U.el('div', 'modal-wrap on');
    wrap.innerHTML = '<div class="modal"><button class="mo-x" aria-label="关闭">' + U.icon('x', 16) + '</button><div class="mo-body">' + html + '</div></div>';
    document.body.appendChild(wrap);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) closeModal(); });
    wrap.querySelector('.mo-x').onclick = closeModal;
    return wrap;
  }
  function closeModal() { U.$$('.modal-wrap').forEach(function (m) { m.remove(); }); }

  /* ---------------- 命令面板 ---------------- */
  function palette() {
    var items = [];
    NAV.forEach(function (n) { items.push({ t: n.t, h: n.r, k: n.t.toLowerCase() }); });
    Object.keys(window.CONTENT).forEach(function (w) {
      (window.CONTENT[w].lessons || []).forEach(function (l, i) {
        items.push({ t: '第 ' + w + ' 周 · 课时 ' + (i + 1) + ' · ' + l.title, h: '#/lesson/' + w + '/' + l.id, k: (l.title + ' ' + (l.tag || '') + ' 第' + w + '周' + (l.summary || '')).toLowerCase() });
      });
    });
    (window.GLOSSARY || []).forEach(function (g) { items.push({ t: '术语 · ' + g.term, h: '#/glossary', k: (g.term + g.desc).toLowerCase() }); });

    var wrap = U.el('div', 'modal-wrap on');
    wrap.innerHTML = '<div class="pal"><div class="pal-in">' + U.icon('search', 16) + '<input id="palQ" placeholder="搜课时、术语或页面…" autocomplete="off"></div><div class="pal-list" id="palList"></div></div>';
    document.body.appendChild(wrap);
    var q = wrap.querySelector('#palQ'), list = wrap.querySelector('#palList'), sel = 0, shown = items.slice(0, 40);
    function draw() {
      var kw = String(q.value || '').toLowerCase().trim();
      shown = (kw ? items.filter(function (x) { return x.k.indexOf(kw) >= 0; }) : items).slice(0, 40);
      list.innerHTML = shown.length
        ? shown.map(function (x, i) { return '<a class="pal-i' + (i === sel ? ' sel' : '') + '" href="' + x.h + '">' + U.esc(x.t) + '</a>'; }).join('')
        : '<div class="pal-empty">没找到，换个词试试</div>';
    }
    q.addEventListener('input', function () { sel = 0; draw(); });
    q.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, shown.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter') { if (shown[sel]) { location.hash = shown[sel].h; closeModal(); } e.preventDefault(); }
      else if (e.key === 'Escape') closeModal();
    });
    wrap.addEventListener('click', function (e) { if (e.target === wrap) closeModal(); });
    draw(); q.focus();
  }

  /* ---------------- 动作 ---------------- */
  function doCheckin() {
    var s = U.state(), t = U.today();
    if (s.checkin.indexOf(t) >= 0) { U.toast('今天已经打过卡了', 'warn'); return; }
    s.checkin.push(t);
    U.addXp(5, '打卡');
    U.recordActivity(1);
    U.store.save();
    U.toast('打卡成功，连续 ' + U.streak() + ' 天', 'ok');
    route();
  }
  function toggleWeekend(btn) {
    var id = btn.getAttribute('data-id'), type = btn.getAttribute('data-wk'), i = btn.getAttribute('data-i');
    var s = U.state();
    s.weekend[id] = s.weekend[id] || {};
    var key = type === 'project' ? 'project' : type + i;
    var now = !s.weekend[id][key];
    s.weekend[id][key] = now;
    U.store.save();
    if (type === 'project') {
      btn.className = 'btn ' + (now ? 'ghost' : 'primary') + ' full';
      btn.innerHTML = U.icon('check', 15) + (now ? '项目已完成，点这里取消' : '我做完这个项目了');
      if (now) { U.addXp(30, '周末实战'); celebrate(); }
    } else {
      btn.classList.toggle('done', now);
      if (now) U.addXp(3, '清单项');
    }
    U.recordActivity(1);
  }
  function toggleLesson(btn) {
    var p = parts();
    var wid = +p[1], lid = p[2];
    var c = window.CONTENT[wid];
    if (!c) return;
    var l = c.lessons.filter(function (x) { return x.id === lid; })[0];
    var s = U.state(), i = s.completed.indexOf(lid);
    if (i >= 0) {
      s.completed.splice(i, 1);
      btn.className = 'btn primary lg';
      btn.innerHTML = U.icon('check', 15) + '标记本课时完成';
      U.toast('已取消完成标记', 'warn');
    } else {
      s.completed.push(lid);
      btn.className = 'btn ghost lg';
      btn.innerHTML = U.icon('check', 15) + '已完成本课时';
      U.addXp(20, '完成课时');
      U.toast('完成《' + l.title + '》，+20 XP', 'ok');
      celebrate();
    }
    U.store.save();
    U.recordActivity(1);
    renderShell();
  }
  function celebrate() {
    if (document.documentElement.getAttribute('data-reduced') === '1') return;
    var wrap = U.el('div', 'confetti');
    var cols = ['#1D6F5C', '#C2713B', '#C9A227', '#2E7D5B'];
    for (var i = 0; i < 26; i++) {
      var d = U.el('i');
      d.style.left = (Math.random() * 100).toFixed(2) + '%';
      d.style.background = cols[i % cols.length];
      d.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
      d.style.animationDuration = (1.1 + Math.random() * 0.9).toFixed(2) + 's';
      wrap.appendChild(d);
    }
    document.body.appendChild(wrap);
    setTimeout(function () { wrap.remove(); }, 2200);
  }
  function exportData() {
    var blob = new Blob([JSON.stringify(U.state(), null, 2)], { type: 'application/json' });
    var a = U.el('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cpp-workbench-' + U.today() + '.json';
    a.click();
    U.toast('进度已导出', 'ok');
  }
  function importData(file) {
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var obj = JSON.parse(fr.result);
        var d = U.state();
        Object.keys(obj).forEach(function (k) { d[k] = obj[k]; });
        U.store.save(); U.toast('导入成功', 'ok'); route();
      } catch (e) { U.toast('这不是有效的进度文件', 'bad'); }
    };
    fr.readAsText(file);
  }

  /* ---------------- 事件 ---------------- */
  function onClick(e) {
    var t = e.target;

    if (t.closest('.nav-i')) { setTimeout(closeDrawer, 60); return; }
    if (t.closest('#menuBtn')) { document.getElementById('sidebar').classList.add('open'); document.getElementById('scrim').classList.add('on'); return; }
    if (t.closest('#closeSide') || t.closest('#scrim')) { closeDrawer(); return; }
    if (t.closest('#themeBtn')) {
      setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      return;
    }
    if (t.closest('#palBtn') || t.closest('#palHint')) { palette(); return; }
    if (t.closest('#checkinBtn')) { doCheckin(); return; }
    if (t.closest('[data-wk]')) { toggleWeekend(t.closest('[data-wk]')); return; }
    if (t.closest('#finishLesson')) { toggleLesson(t.closest('#finishLesson')); return; }
    if (t.closest('#expBtn')) { exportData(); return; }
    if (t.closest('#impBtn')) { document.getElementById('impFile').click(); return; }
    if (t.closest('#resetBtn')) {
      if (confirm('确定清空所有学习进度？打卡、XP、笔记、成就进度都会没有。')) { U.store.reset(); U.toast('已清空', 'warn'); route(); }
      return;
    }
    var th = t.closest('[data-theme-set]');
    if (th) {
      setTheme(th.getAttribute('data-theme-set'));
      U.$$('#themeSeg .seg-b').forEach(function (x) { x.classList.toggle('on', x === th); });
      return;
    }
    var toc = t.closest('.toc-i');
    if (toc) {
      e.preventDefault();
      var anchor = document.getElementById(toc.getAttribute('href').slice(1));
      if (anchor) anchor.scrollIntoView();
      return;
    }
    // 内容块的交互交给 Blocks
    Blocks.onClick(e);
  }
  function onKey(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); palette(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      var btn = document.getElementById('pgRun') || document.querySelector('.cb-btn.primary[data-act="run-code"]');
      if (btn) { e.preventDefault(); btn.click(); }
    }
    if (e.key === 'Escape') closeModal();
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    window.flushRegistry();

/* ================= 第 2 周 · 课时 1 · 给数据挑个盒子：变量与类型 ================= */
registerLesson(2, 0, {
  id:"2-1",
  title:"给数据挑个盒子",
  tag:"课时 1 · 变量与类型",
  meta:["约 55 分钟","7 次编译","6 个原理","6 个互动"],
  summary:"变量是内存里的抽屉：先挑类型再造盒；int 约 21 亿，加 1 会翻成负数。",
  keypoints:["声明造盒，初始化才放东西","未初始化的值是垃圾","带小数就挑 double","int 溢出会翻成负数"],
  blocks:[

    {t:"prose",html:String.raw`<p>第 1 周你的程序是“自己说给自己听”：数据写死在 <code>cout</code> 里，想把身高从 172 改成 175，就得改源码、重新编译。这一周我们要让程序<b>记住</b>数据。</p><p>记住靠什么？靠<b>变量</b>。今天这节课的口号只有一句：<b>给数据挑个盒子</b>——先想清楚这个数是什么脾气，再决定用哪种盒子装它。挑错了，屏幕上会出现你完全看不懂的东西：该是 22.14 的地方印着 22，该是正数的地方印着负数。</p>`},

    {t:"code",file:"datacard.cpp",code:String.raw`#include <iostream>
using namespace std;
int main() {
    int heightCm = 172;        // 身高：整数厘米
    double weightKg = 65.5;    // 体重：可能带小数
    char level = 'A';          // 等级：一个字母
    bool pass = true;          // 是否及格：是真还是假

    cout << "身高 " << heightCm << " cm" << endl;
    cout << "体重 " << weightKg << " kg" << endl;
    cout << "等级 " << level << endl;
    cout << "及格 " << pass << endl;
    return 0;
}
// 屏幕：
// 身高 172 cm
// 体重 65.5 kg
// 等级 A
// 及格 1`},

    {t:"box",kind:"key",title:"变量就是内存里的抽屉",text:String.raw`内存是一面墙的抽屉。int heightCm = 172; 这句话一次干了三件事：在墙上腾出一个抽屉（分配内存）、给它贴标签 heightCm（名字）、规定它只能装整数（类型），然后把 172 放进去（值）。以后你喊 heightCm，计算机就去找那个抽屉。名字是标签，类型是抽屉的规格，值是里面的东西——这三样缺一个，抽屉就用不起来。`},

    {t:"prose",html:String.raw`<p>新手最容易混的是三个动作：<b>声明</b>、<b>赋值</b>、<b>初始化</b>。它们长得像，干的事完全不同。</p><ul style="margin-left:20px"><li><b>声明</b>：<code>int heightCm;</code> —— 造一个抽屉，用完不清理</li><li><b>赋值</b>：<code>heightCm = 172;</code> —— 往已经造好的抽屉里放东西（可以放很多次，后放的覆盖先放的）</li><li><b>初始化</b>：<code>int heightCm = 172;</code> —— 造抽屉的<b>同一行</b>就把东西放进去</li></ul><p>换句话说：初始化是“第一次赋值”，而且必须跟声明写在一起。变量之所以叫“变”量，就是因为抽屉里的东西可以换——但<b>第一次放东西之前，你千万别去读它</b>。</p>`},

    {t:"code",file:"three_ways.cpp",code:String.raw`#include <iostream>
using namespace std;
int main() {
    int heightCm;             // ① 只声明：抽屉造好了，里面没放过东西
    int weightKg = 65;        // ② 初始化：造抽屉的同一行就把东西放进去

    {t:"box",kind:"warn",title:"未初始化的抽屉里，是上一手房客留下的垃圾",text:String.raw`int heightCm; 只让编译器腾出一个抽屉，它<b>不会顺手帮你擦干净</b>——里面留着上一个用这块内存的程序写下的 0 和 1。你读它，读到的就是那堆垃圾：在我这台 g++ 上你多半看到 0（栈刚好是干净的），加上 -O2 或者换成 MSVC 的 Debug 模式，可能是 -858993460（十六进制 0xCCCCCCCC，VC 故意填的“未初始化”标记），也可能每次运行都不一样。C++ 标准管这叫<b>未定义行为</b>，意思是任何结果都“合法”。最阴险的是它经常看着像对的：本机打印 0，交到 OJ 上变成 32767。所以从今天起养成肌肉记忆：声明的同时就初始化，累加器一律写 int sum = 0;。`},

    {t:"predict",title:"小预测：先声明后赋值，盒子照样能用",prompt:"下面这段程序，屏幕上依次是哪四行？注意最后一行。",

    {t:"prose",html:String.raw`<p>接下来是今天的主活：<b>四种盒子怎么挑</b>。C++ 有几十种类型，但你这一学期 95% 的时间只用到四个，我管它们叫<b>四原色</b>：</p><ol style="margin-left:20px"><li><code>int</code>：整数。身高厘米数、人数、题数、计数——不带小数点的都归它</li><li><code>double</code>：带小数的数。体重 65.5、平均分 86.33、比率、BMI——只要有可能出现小数点，就是它</li><li><code>char</code>：单个字符。等级 'A'、血型 'O'、性别标记——注意是<b>单引号</b>，一次只装一个</li><li><code>bool</code>：只有两个值，true / false。是否及格、是否缺考、是否异常值</li></ol><p>挑盒子的口诀就一句：<b>看这个数据本身带不带小数、是不是一个数。</b>数据是“172 厘米”→ int；是“65.5 公斤”→ double；是“A 级”→ char；是“及没及格”→ bool。</p>`},

    {t:"code",file:"four_types.cpp",code:String.raw`#include <iostream>

    bool pass = true;            // 是 / 否

// 屏幕：

    {t:"box",kind:"tip",title:"什么时候挑 double：只要可能带小数",text:String.raw`判断口诀：<b>这个数有可能带小数，就挑 double。</b>身高 172 厘米是整数，int 够用；体重 65.5 必须 double；平均分、及格率、BMI、百分比，一律 double。反过来还有一条更狠的：两个整数相除，小数会被直接砍掉（课时 2 会专门讲），所以哪怕原始数据是整数，只要后面要做除法，参与除法的地方也得先变成 double。挑错盒子屏幕上会看到：该是 22.1403 的地方印着 22，或者干脆是 0——程序不报错，只是悄悄给你一个错的答案。`},

    {t:"predict",title:"小预测：sizeof 看盒子占几个字节",prompt:"sizeof 是运算符，能问出“这个盒子占几个字节”。先自己推六行输出，尤其是最后一行。",
      code:String.raw`#include <iostream>
using namespace std;
int main() {
    int heightCm = 172;
    double weightKg = 65.5;
    char level = 'A';
    bool pass = true;

    cout << "int:    " << sizeof(int) << endl;
    cout << "double: " << sizeof(double) << endl;
    cout << "char:   " << sizeof(char) << endl;
    cout << "bool:   " << sizeof(bool) << endl;
    cout << "变量:   " << sizeof(heightCm) << endl;
    cout << "int+1:  " << sizeof(int) + 1 << endl;
    return 0;
}`,
      output:String.raw`int:    4
double: 8
char:   1
bool:   1
变量:   4
int+1:  5`,
      why:String.raw`主流 64 位 g++ 上：int 4 字节、double 8 字节、char 1 字节、bool 1 字节。sizeof(变量) 和 sizeof(类型) 结果一样，因为问的是<b>盒子规格</b>，不是里面装了多少——装 172 和装 1，都是 4 字节。最后一行最坑：sizeof 先算出 4，再加 1 得 5，绝不是“int 占 5 字节”。另外 sizeof 的结果跟机器和编译器有关（标准只保证 char 恰好是 1、int 至少 2），换台机器看到不一样的数字，不代表你算错了。若你以为它能测出“值占多大”，最后一行的 5 会推翻这个想法。`},

    {t:"prose",html:String.raw`<p>现在讲本课最有冲击力的一件事：<b>盒子是有底的。</b></p><p><code>int</code> 这个抽屉常见是 4 字节 = 32 个 0/1 位，能表示的最大正整数是 <b>2147483647</b>，约 <b>21 亿</b>。再往里加 1，会发生什么？</p><p>想象老式汽车的机械里程表：表盘走到 999999，再跑一公里，齿轮咔哒一声全翻回 000000。int 也是一串齿轮，只不过它翻过去不是回到 0，而是直接掉到最负的那个数。</p>`},

    {t:"predict",title:"★ 小预测：21 亿加 1 等于几（本课最狠的一题）",prompt:"这是本课最重要的一次预测。别运行，先把四行结果写在纸上，尤其是第 2 行和第 4 行。",
      code:String.raw`#include <iostream>
#include <climits>
using namespace std;
int main() {
    int top = INT_MAX;
    cout << "上限 " << top << endl;
    cout << "上限+1 " << top + 1 << endl;
    cout << "下限 " << INT_MIN << endl;

    int a = 2000000000;
    int b = 2000000000;
    cout << "两笔相加 " << a + b << endl;
    return 0;
}`,
      output:String.raw`上限 2147483647
上限+1 -2147483648
下限 -2147483648
两笔相加 -294967296`,
      why:String.raw`2147483647 + 1 = <b>-2147483648</b>，正是里程表翻圈：正数那半圈走到头，再走一格就跨到负数那半圈的起点。20 亿 + 20 亿 = 40 亿，超出的部分绕回来，落到 -294967296（4294967296 减 4000000000 再取负）。要说明的是：C++ 标准把有符号整数溢出列为<b>未定义行为</b>，理论上什么都可能发生；实际 g++ / Clang / MSVC 在 x86 上都按“绕回”处理，所以你会稳定看到这个负数——但别拿它当逻辑依赖。想装更大的数，换 long long（上限约 9.2e18）。如果你以为“超了会自动变 long long”或者“编译器会拦我”，屏幕会教育你：它一声不吭，直接给你一个负数。`},

    {t:"box",kind:"key",title:"盒子装不下就翻圈，而且一声不吭",text:String.raw`溢出不抛异常、不崩溃、g++ 默认连警告都不给。加法器只管按位相加，最高位的进位直接丢掉，剩下的位按“有符号数”解释，就成了负数。所以 int 只能装到约 21 亿：中国人口 14 亿没问题，全球人口 80 亿装不下；用 int 存毫秒，24.8 天就翻圈；视频播放量、转发量、文件大小（字节）都很容易超。数据科学里碰到“计数、累加、时间戳”，先问一句：会不会过 21 亿？会，就上 long long。理解错了，你会在屏幕上看到一个负数人数、负数文件大小，然后怀疑自己数据错了——其实是盒子小了。`},

    {t:"code",file:"overflow.cpp",code:String.raw`#include <iostream>

    {t:"prose",html:String.raw`<p>盒子挑完，最后给它贴标签——<b>命名</b>。规则只有三条半：</p><ol style="margin-left:20px"><li>只能用<b>字母、数字、下划线</b>，其它符号一律不行（减号会被当成减号运算符）</li><li><b>不能以数字开头</b>：<code>int 2height;</code> 直接编译失败</li><li><b>不能叫关键字</b>：<code>int</code> <code>double</code> <code>char</code> <code>bool</code> <code>return</code> 这些字已经被语言征用了</li><li>区分大小写：<code>height</code> 和 <code>Height</code> 是<b>两个不同的抽屉</b></li></ol><p><b>匈牙利命名法是个反例</b>，老教材很爱写：<code>int iHeight;</code>、<code>double dWeight;</code>、<code>bool bPass;</code>，把类型当前缀。问题是哪天你把 <code>iHeight</code> 改成 <code>long long</code>，名字就成了<b>谎话</b>——所有调用处还叫 iHeight，读代码的人再也不敢信它。现代写法是让名字说“这是什么数据”：<code>height_cm</code>、<code>weight_kg</code>、<code>is_pass</code>。类型变了，名字照样成立。</p>`},

        {l:"int Height; 和 int height;",r:"能编译，是两个不同的抽屉（区分大小写）"}

      why:String.raw`前两条是硬规矩，违反了 g++ 直接报错，程序根本跑不起来；后三条都能编译，差别在<b>半年后你（或队友）还敢不敢信这个代码</b>。匈牙利式前缀把类型写进名字，等于让名字承担了编译器该干的活；改成 height_cm 之后，哪怕以后换成 long long，名字依然诚实。大小写敏感那条最实用：屏幕上出现身高 0，先查是不是定义了一个 Height，却在下面读 height。`},

    {t:"code",file:"const.cpp",code:String.raw`#include <iostream>
using namespace std;
int main() {
    const double PI = 3.14159;      // 常量：声明时必须初始化
    const int PASS_LINE = 60;       // 及格线

    double r = 2.0;
    cout << "圆面积 " << PI * r * r << endl;
    cout << "及格线 " << PASS_LINE << endl;

    // PASS_LINE = 70;   // 打开这行，g++ 原话：
    // error: assignment of read-only variable 'PASS_LINE'
    return 0;
}
// 屏幕：
// 圆面积 12.5664
// 及格线 60`},

    {t:"box",kind:"key",title:"const 给盒子贴封条",text:String.raw`直接写死 60 叫<b>魔法数字</b>：三个月后你看到 if (score >= 60)，根本想不起 60 是及格线还是题数。写成 const int PASS_LINE = 60; 既给了名字，又上了锁——所有用到它的地方都指向同一个值，改分数线只改这一行。两条规矩：const 变量<b>必须在声明时初始化</b>（盒子造好就该封上），之后<b>不许再赋值</b>。硬要改，g++ 原话是 error: assignment of read-only variable 'PASS_LINE'，编译都过不去，屏幕上什么也不会出现。想通了这一点，你就会明白常量和字面量的区别：一个会告诉你“它是谁”，一个只告诉你“它是多少”。`},

    {t:"prose",html:String.raw`<p><b>本课时收尾。</b>你只需要记住五件事：变量是内存里的抽屉，名字是标签、类型是规格、值是内容；<b>声明造盒、初始化才放东西</b>，没初始化的抽屉里是上一手房客的垃圾；四原色 int / double / char / bool 按“带不带小数、是不是数”来挑，<code>sizeof</code> 能量出盒子占几个字节；<b>int 只装到约 21 亿，加 1 会翻成 -2147483648</b>，而且全程不报错；常量用 <code>const</code> 起名字、上锁，别在代码里撒魔法数字。</p><p>下一课时（课时 2 · 类型转换）我们要收拾本课时留下的两个悬念：<b>为什么 <code>bool</code> 打印成了 1 而不是 true</b>，以及<b>为什么两个整数相除小数会不翼而飞</b>。说白了就是一件事——数据从一种盒子倒进另一种盒子时，会掉什么、会变什么。带上今天这四只盒子，我们下一课时见。</p>`}
  ]
});

/* ================= l-w2-2.js ================= */
registerLesson(2, 1, {
  id:"2-2",
  title:"类型会变，结果也会变",
  tag:"课时 2 · 类型转换",
  meta:["约 50 分钟","8 次编译","5 个原理"],
  summary:"看清转换发生在哪一步，让平均数、字符和真假不再悄悄变样。",
  keypoints:["先运算，再装进变量","整数除法先截断","优先用 static_cast","字符和真假也是数"],
  blocks:[
    {t:"prose",html:String.raw`<p>先看一场数据分析事故：五次实验里有三次成功，0/1 标签的平均值应该是 0.6。变量明明叫 <code>double</code>，屏幕却只交出一个 0。小数不是在“装盒”时丢的，而是在更早的运算台上就被砍掉了。</p>`},

    {t:"bug",title:"事故现场：double 为什么救不回小数",prompt:"先运行，再指出哪一行让小数提前消失，然后只改这一行，让屏幕从 0 变成 0.6。",symptom:"屏幕输出：0（期望 0.6）",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int sum = 3;
    int n = 5;
    double avg = sum / n;
    cout << avg << endl;
    return 0;
}`,actual:String.raw`0`,expected:String.raw`0.6`,hint:"盯住等号右边：除法发生时，左右两边分别是什么类型？",fix:String.raw`double avg = static_cast<double>(sum) / n;`,explain:"sum / n 先按整数除法算成 0，之后只是把 0 装进 double 盒子，变成的仍是 0。误以为左边的 double 会指挥右边，屏幕就会一直显示 0。",answers:[7]},

    {t:"box",kind:"key",title:"先算右边，再装左边",text:String.raw`赋值像装快递：右边先把成品做好，左边的盒子最后才接货。double avg 只能决定成品怎么存，不能穿越回去命令 sum / n 保留小数。看到屏幕上的 0，就说明小数在进盒前已经丢了。`},

    {t:"predict",title:"先别运行：三行会各输出什么",prompt:"逐行写下结果，再编译核对。",code:String.raw`#include <iostream>
using namespace std;

int main() {
    cout << 3 + 4.5 << endl;
    cout << 1 / 2 << endl;
    cout << 1 / 2.0 << endl;
    return 0;
}`,output:String.raw`7.5
0
0.5`,explain:"3 遇到 4.5，会先变成 3.0，再按 double 相加；1 和 2 都是 int，没有升级的理由，所以 1 / 2 还是 0；2.0 把第三行拉到小数轨道。若以为所有除法都自动带小数，第二行的 0 就是屏幕给你的反证。"},

    {t:"prose",html:String.raw`<p><b>混合运算先“统一装备”。</b>一个 <code>int</code> 和一个 <code>double</code> 一起算，C++ 会把整数临时换成能装小数的 <code>double</code>，再开工。像两个人进同一座泳池，穿雨靴的先换成泳装；但 <code>1 / 2</code> 两边都是整数，谁也不会主动换。</p><p>所以要看的是<b>运算发生那一刻</b>有哪些类型，不是最后准备把结果放进什么变量。理解反了，<code>double x = 1 / 2;</code> 的屏幕仍然是 0，而不是 0.5。</p>`},

    {t:"code",file:"assignment.cpp",code:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int a = 3.9;
    int negative = -3.9;
    double b = 3;

    cout << a << endl;
    cout << negative << endl;
    cout << fixed << setprecision(1) << b << endl;
    return 0;
}`},

    {t:"box",kind:"warn",title:"赋值转换：盒口小了就截断",text:String.raw`上面的屏幕依次显示 3、-3、3.0。double 装进 int 时，小数部分直接截掉，是朝 0 砍，不是四舍五入，所以 -3.9 变 -3；int 装进 double 不丢整数值，只是改成小数存法。若把截断当取整，屏幕上的 3 和 -3 会同时打脸。`},

    {t:"fill",title:"把平均分拉回小数轨道",prompt:"只填横线处。填完后整段程序应输出 86.33。",code:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int sum = 259;
    int n = 3;
    double avg = ___ / n;
    cout << fixed << setprecision(2) << avg << endl;
    return 0;
}`,answers:[String.raw`static_cast<double>(sum)`],output:String.raw`86.33`,explain:"先把 sum 显式转成 double，再除以 n。若写成 static_cast<double>(sum / n)，整数除法已经先得到 86，屏幕只会显示 86.00。"},

    {t:"prose",html:String.raw`<p>你也会见到 C 风格写法 <code>(double)sum / n</code>，它在这里同样得到 86.33。C++ 更推荐 <code>static_cast&lt;double&gt;(sum) / n</code>：字长一点，但像在代码上贴了“这里故意转换”的标签，编译器也能做更明确的检查。</p><p>两种写法都要放在除法<b>之前</b>。先算 <code>sum / n</code> 再转，屏幕显示 86.00，小数已经追不回来了。</p>`},

    {t:"box",kind:"tip",title:"显式转换不是给变量改户口",text:String.raw`static_cast<double>(sum) 只生成一份临时的 259.0，原来的 sum 仍是 int。它像复印一张“可带小数”的临时通行证，不会偷偷改掉原盒子。若随后输出 sum，屏幕仍显示 259。`},

    {t:"predict",title:"字符脱掉外套后，里面是编号",prompt:"别把字符 0 和整数 0 淋成一锅。先预测四行输出。",code:String.raw`#include <iostream>
using namespace std;

int main() {
    char c = 65;
    cout << c << endl;
    cout << static_cast<int>('0') << endl;
    cout << '7' - '0' << endl;
    cout << '0' + 0 << endl;
    return 0;
}`,output:String.raw`A
48
7
48`,explain:"char 盒子按字符显示，所以编号 65 显示 A；'0' 的 ASCII 编号是 48，不是数值 0；数字字符连续排列，因此 '7' - '0' 才得到整数 7。若直接把 '7' 当 7，屏幕上的 55 或 48 会暴露混淆。"},

    {t:"prose",html:String.raw`<p><b>字符和整数之间没有墙，只有显示方式不同。</b><code>char c = 65;</code> 把编号 65 装进字符盒，<code>cout</code> 按字符解释它，于是屏幕是 A；把 <code>'A'</code> 转成 <code>int</code>，屏幕就是 65。</p><p>处理数字字符时记住这座桥：字符转数字用 <code>c - '0'</code>，数字转字符用 <code>digit + '0'</code>。少过一次桥，想要 7 却可能在屏幕看到 55，或者看到字符 7 而不是可计算的整数 7。</p>`},

    {t:"trace",title:"沿着四次装盒，追踪真假变化",prompt:"先填每个变量最终存的值，再核对屏幕。",code:String.raw`#include <iostream>
using namespace std;

int main() {
    bool a = 0;
    bool b = -3;
    int x = true;
    int y = false;

    cout << boolalpha << a << " " << b << endl;
    cout << x << " " << y << endl;
    return 0;
}`,steps:[
      {line:String.raw`bool a = 0;`,value:"false"},
      {line:String.raw`bool b = -3;`,value:"true"},
      {line:String.raw`int x = true;`,value:"1"},
      {line:String.raw`int y = false;`,value:"0"}
    ],output:String.raw`false true
1 0`,explain:"整数转 bool：0 是 false，任何非 0 都是 true，负数也不例外；bool 转整数：true 是 1，false 是 0。若以为只有 1 才是真，第一行屏幕上的 true 会推翻这个猜测。"},

    {t:"box",kind:"key",title:"bool 只问“是不是零”",text:String.raw`把整数塞进 bool，C++ 不关心它是 2、99 还是 -3，只问是不是 0。非 0 全压成 true，转回整数时统一变 1。误把 -1 当 false，程序不会报错，只会在屏幕上显示 true——这类错最隐蔽。`},

    {t:"code",file:"class_report.cpp",code:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int scoreSum = 259;
    int heightSum = 518;
    int studentCount = 3;
    double weightKg = 65.0;
    double heightM = 1.75;

    double scoreAvg = static_cast<double>(scoreSum) / studentCount;
    double heightAvg = static_cast<double>(heightSum) / studentCount;
    double bmi = weightKg / (heightM * heightM);

    cout << fixed << setprecision(2);
    cout << "平均分：" << scoreAvg << endl;
    cout << "平均身高：" << heightAvg << " cm" << endl;
    cout << "BMI：" << bmi << endl;
    return 0;
}`},

    {t:"prose",html:String.raw`<p>这份报告会显示平均分 86.33、平均身高 172.67 cm、BMI 21.22。三个结果都要小数，但风险点不同：总分和总身高是 <code>int</code>，除法前必须转换；体重和身高本来就是 <code>double</code>，自然走小数运算。</p><p>如果漏掉前两个转换，屏幕不是都变 0，而是更会骗人的 86.00 和 172.00——结果“看着像对”，尾巴却被悄悄剪掉。这正是数据题最常见的隐形丢分。</p>`},

    {t:"bug",title:"BMI 事故：厘米换米时先被砍了",prompt:"运行后会看到离谱的 65.00。找出第一个发生整数除法的位置。",code:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int weightKg = 65;
    int heightCm = 175;
    double bmi = weightKg / ((heightCm / 100) * (heightCm / 100));
    cout << fixed << setprecision(2) << bmi << endl;
    return 0;
}`,actual:String.raw`65.00`,expected:String.raw`21.22`,hint:"175 / 100 在当前类型下不是 1.75。",fix:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int weightKg = 65;
    int heightCm = 175;
    double heightM = heightCm / 100.0;
    double bmi = weightKg / (heightM * heightM);
    cout << fixed << setprecision(2) << bmi << endl;
    return 0;
}`,explain:"heightCm / 100 先按整数除法得到 1，分母于是成了 1，屏幕才冒出 65.00。把 100 改成 100.0，让厘米换米从第一步就走小数轨道，结果才是 21.22。",answers:[8]},

    {t:"box",kind:"tip",title:"做数据计算前，过三道闸",text:String.raw`第一道看运算：参与者是什么类型；第二道看赋值：大盒装小盒，还是小盒硬塞大数；第三道看显示：char 会显示字符，bool 加 boolalpha 会显示 true/false。屏幕出现 0、整数尾巴 .00、奇怪字母或意外的 true，就沿这三道闸倒查。`},

    {t:"quiz",questions:[
      {q:"下面程序片段执行 cout << avg，屏幕显示什么？double avg = 3 / 5;",opts:[
        {t:"0",correct:true},
        {t:"0.6",wrong:true},
        {t:"0.60",wrong:true},
        {t:"编译失败",wrong:true}],
        why:"3 / 5 先做整数除法得到 0，再装进 double，默认输出仍是 0。",
        wrongWhy:"左边的 double 不会反过来改变右边已经发生的整数除法。"},
      {q:"哪一行能让 259 除以 3 得到带小数的结果？",opts:[
        {t:"double avg = 259 / 3;",wrong:true},
        {t:"double avg = static_cast<double>(259) / 3;",correct:true},
        {t:"double avg = static_cast<double>(259 / 3);",wrong:true},
        {t:"int avg = 259 / 3.0;",wrong:true}],
        why:"先把一个操作数转成 double，除法才会按小数计算。",
        wrongWhy:"A 和 C 都是先做整数除法；D 虽按小数算，装进 int 时又截断。"},
      {q:"执行 bool ok = -2; cout << boolalpha << ok << \" \" << ('5' - '0'); 会输出什么？",opts:[
        {t:"false 5",wrong:true},
        {t:"true 53",wrong:true},
        {t:"true 5",correct:true},
        {t:"-2 5",wrong:true}],
        why:"-2 是非 0，所以转成 true；数字字符相减得到整数 5。",
        wrongWhy:"bool 只区分 0 与非 0；'5' 的编号减去 '0' 的编号才是 5。"}
    ]},

    {t:"exercise",items:[
      {level:"easy",title:"做一张类型转换体检单",desc:"写程序依次输出 5 / 2、5 / 2.0、int(2.9)、int(-2.9)，运行后用一句话解释每个屏幕结果。"},
      {level:"mid",title:"班级平均数据报告",desc:"写死 4 名学生的总分 347、总身高 681 cm，输出平均分和平均身高，均保留两位小数；漏转换时先观察错误屏幕，再修正。"},
      {level:"mid",title:"修好 BMI 与数字字符",desc:"用 int 保存体重 72 kg、身高 180 cm，正确输出 BMI；再把字符 '8' 转成整数 8 并加到 BMI 上，检查每一步的屏幕值。"}
    ]}
  ]
});
