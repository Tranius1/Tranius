#app{display:flex;min-height:100vh}
#sidebar{width:264px;background:var(--sidebar-bg);color:var(--sidebar-text);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:50;transition:transform .25s ease}

.block{margin-bottom:22px}

.code-dots i:nth-child(1){background:#ff5f57}
.code-dots i:nth-child(2){background:#febc2e}
.code-dots i:nth-child(3){background:#28c840}
.code-filename{font-family:var(--mono);font-size:12px;color:#8b949e}
.code-copy{color:#8b949e;font-size:12px;padding:3px 9px;border-radius:5px}
.code-copy:hover{background:#21262d;color:#fff}
.code-block pre{padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.7;color:var(--code-ink)}
.code-block code{font-family:var(--mono)}
.tok-kw{color:#ff7b72}
.tok-str{color:#a5d6ff}
.tok-num{color:#79c0ff}

.tok-fn{color:#d2a8ff}
.tok-inc{color:#ffa657}

/* 概念快测 */
.quiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
.quiz-q{font-size:15px;font-weight:600;margin-bottom:13px;display:flex;gap:10px}
.quiz-q .q-num{font-family:var(--mono);background:var(--teal);color:#fff;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.quiz-opt{display:flex;align-items:flex-start;gap:11px;padding:11px 14px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:8px;cursor:pointer;transition:all .15s;font-size:14px}
.quiz-opt:hover{border-color:var(--teal);background:var(--teal-soft)}

.quiz-opt.selected{border-color:var(--teal);background:var(--teal-soft)}
.quiz-opt.selected .radio{border-color:var(--teal)}
.quiz-opt.selected .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--teal)}
.quiz-opt.correct{border-color:var(--green);background:var(--green-soft)}

.quiz-opt.correct .radio::after{background:var(--green)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-soft)}

.quiz-opt.wrong .radio::after{background:var(--red)}

.quiz-opt.correct.locked:hover{background:var(--green-soft)}

.quiz-opt.selected.locked:hover{background:var(--teal-soft)}
.quiz-feedback{border-radius:9px;padding:12px 14px;font-size:13.5px;margin-top:10px;display:none}
.quiz-feedback.show{display:flex;gap:10px}
.quiz-feedback.right{background:var(--green-soft);color:#15803d}
.quiz-feedback.bad{background:var(--red-soft);color:#b91c1c}
.quiz-misconception{font-size:12.5px;color:var(--ink-2);margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}

/* 编程练习 */

.exercise-check.done{color:var(--ink-2)}

.console-wrap{background:var(--code-bg);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.console{flex:1;padding:16px;font-family:var(--mono);font-size:13px;color:var(--code-ink);overflow-y:auto;min-height:380px;white-space:pre-wrap}

.pg-note{background:var(--amber-soft);color:#b45309;border-radius:9px;padding:11px 14px;font-size:13px;margin-bottom:14px}

.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ach-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;position:relative}
.ach-card.locked{opacity:.5}
.ach-medal{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.ach-medal svg{width:28px;height:28px}
.ach-medal.unlocked{background:var(--amber-soft);color:#d97706}
.ach-medal.lock{background:var(--bg);color:var(--ink-3)}
.ach-name{font-size:14.5px;font-weight:700}
.ach-desc{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.ach-progress{font-size:12px;color:var(--teal-dark);margin-top:8px;font-weight:600}

/* 时间线 */
.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item::before{content:'';position:absolute;left:-25px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--teal)}
.tl-item.done::before{background:var(--green);border-color:var(--green)}
.tl-date{font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}
.tl-text{font-size:14px;margin-top:2px}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1c2330;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;box-shadow:var(--shadow-lg);z-index:100;transition:opacity .3s ease,visibility .3s ease;display:flex;align-items:center;gap:9px;opacity:0;visibility:hidden;pointer-events:none}
#toast.show{opacity:1;visibility:visible;pointer-events:auto}
#toast svg{width:18px;height:18px;color:var(--teal)}

/* 遮罩 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.overlay.show{display:block}

/* 空状态 */
.empty{text-align:center;padding:50px 20px;color:var(--ink-3)}
.empty svg{width:56px;height:56px;margin-bottom:14px;opacity:.5}
.empty p{font-size:14px}

  .grid-4{grid-template-columns:repeat(2,1fr)}
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .ach-grid{grid-template-columns:repeat(2,1fr)}
  .playground{grid-template-columns:1fr}
}
@media (max-width:768px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  #main{margin-left:0}
  .menu-toggle{display:flex}
  #topbar{padding:12px 16px}
  #view{padding:18px 16px}

  .top-stats .streak-chip{display:none}

  --deep: #0A1024;
  --navy: #111A3A;

  /* 主色：星蓝 */
  --pine: #6EA8FF;
  --pine-d: #4A6DFF;
  --pine-l: #8FBCFF;
  --pine-bg: rgba(110, 168, 255, .12);
  --pine-line: rgba(110, 168, 255, .28);

  /* 强调：极光青 */
  --ochre: #35E0D0;
  --ochre-d: #2BC4B6;
  --ochre-bg: rgba(53, 224, 208, .10);
  --ochre-line: rgba(53, 224, 208, .30);

  /* 点缀：星云紫 */
  --nebula: #B98CFF;
  --nebula-bg: rgba(185, 140, 255, .10);
  --nebula-line: rgba(185, 140, 255, .30);

  /* 中性：深空面 */
  --paper: #070B16;
  --surface: #0D1327;
  --surface-2: #111A33;
  --glass: rgba(255, 255, 255, .055);
  --ink: #E8EEFF;
  --ink-2: #B9C4E4;
  --muted: #8E9BC4;
  --muted-2: #7C8AB8;
  --line: rgba(255, 255, 255, .10);
  --line-2: rgba(255, 255, 255, .17);

  /* 语义 */
  --ok: #3FD9A8;
  --ok-bg: rgba(63, 217, 168, .12);
  --ok-line: rgba(63, 217, 168, .32);
  --warn: #F2C97D;
  --warn-bg: rgba(242, 201, 125, .12);
  --warn-line: rgba(242, 201, 125, .32);
  --bad: #FF8A80;
  --bad-bg: rgba(255, 138, 128, .12);
  --bad-line: rgba(255, 138, 128, .32);
  --info: #6EA8FF;
  --info-bg: rgba(110, 168, 255, .12);
  --info-line: rgba(110, 168, 255, .30);

  /* 代码块（深空底，星蓝细边） */
  --code-bg: #070B16;
  --code-bg-2: #0B1022;
  --code-line: rgba(110, 168, 255, .22);
  --code-ink: #D6E2FF;
  --code-dim: #7A88B8;
  --code-kw: #B98CFF;
  --code-str: #35E0D0;
  --code-num: #F7C8A0;
  --code-com: #5C6A93;
  --code-inc: #8FD0FF;

  /* 尺寸 */
  --r-s: 8px;
  --r-m: 12px;
  --r-l: 14px;
  --radius: 14px;
  --side-w: 268px;
  --maxw: 1180px;

  /* 字体 */
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", ui-monospace, Menlo, Consolas,
          "Liberation Mono", "Courier New", monospace;

  --sh-1: 0 1px 2px rgba(0, 0, 0, .30);
  --sh-2: 0 4px 16px rgba(0, 0, 0, .38);
  --sh-3: 0 12px 40px rgba(0, 0, 0, .50), 0 0 0 1px rgba(110, 168, 255, .06);
  --glow: 0 0 24px rgba(110, 168, 255, .35);
  --ease: 160ms cubic-bezier(.4, 0, .2, 1);
}

/* 「深海模式」：同一套星辰大海，星更暗、光晕更收敛 */
html[data-theme="dark"] {
  --paper: #04060E;
  --surface: #090F1E;
  --surface-2: #0C1326;
  --glass: rgba(255, 255, 255, .038);
  --ink: #DDE6FB;
  --ink-2: #A9B6DC;
  --muted: #8492BD;
  --muted-2: #6C7AA6;
  --line: rgba(255, 255, 255, .08);
  --line-2: rgba(255, 255, 255, .14);

  --code-bg: #050810;
  --code-bg-2: #080D1B;
}

/* ============================ Reset ============================ */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.72;
  color: var(--ink);
  color-scheme: dark;
  background-color: var(--void);
  background-image:
    radial-gradient(1200px 700px at 15% -10%, rgba(110, 168, 255, .22), transparent 60%),
    radial-gradient(900px 600px at 85% 10%, rgba(185, 140, 255, .18), transparent 60%),
    radial-gradient(1000px 800px at 50% 110%, rgba(53, 224, 208, .14), transparent 60%),
    linear-gradient(160deg, #05070F 0%, #0A1024 45%, #0B1230 100%);
  background-attachment: fixed;
  background-repeat: no-repeat;
  background-size: cover;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "tnum" 1;
}
h1, h2, h3, h4 { margin: 0; font-weight: 650; line-height: 1.32; letter-spacing: -.011em; color: var(--ink); }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
ul, ol { margin: 0; padding: 0; list-style: none; }
code, pre, kbd { font-family: var(--mono); }
table { border-collapse: collapse; width: 100%; }
img, svg { display: block; }
::selection { background: var(--pine-line); color: var(--ink); }

:focus-visible { outline: 2px solid var(--pine); outline-offset: 2px; border-radius: 4px; }

/* 滚动条 */
* { scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 6px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

.ico { flex: none; vertical-align: -.16em; }
.dim { color: var(--muted-2); }
.muted { color: var(--muted); }

/* ============================ 外壳布局 ============================ */
#app { display: flex; min-height: 100vh; }

#sidebar {
  width: var(--side-w);
  flex: none;
  position: sticky;
  top: 0;
  align-self: flex-start;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--line);
  z-index: 40;
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 16px 14px;
  border-bottom: 1px solid var(--line);
}
.brand-mark {
  width: 34px; height: 34px; flex: none;
  display: grid; place-items: center;
  background: var(--pine);
  color: #fff;
  border-radius: 9px;
  font-family: var(--mono);
  font-size: 12.5px;
  font-weight: 700;
  letter-spacing: -.02em;
  box-shadow: var(--sh-1);
}
.brand-txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand-txt b { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; }
.brand-txt span { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
.side-x {
  display: none;
  width: 30px; height: 30px; flex: none;
  align-items: center; justify-content: center;
  border-radius: 7px; color: var(--muted);
}
.side-x:hover { background: var(--surface-2); color: var(--ink); }

/* 侧边栏 · 继续上次 */
.quick-wrap:empty { display: none; }
.quick-h {
  padding: 14px 16px 8px;
  font-size: 11px; font-weight: 650;
  letter-spacing: .09em; text-transform: uppercase;
  color: var(--muted-2);
}
.quick {
  display: block; margin: 0 10px 10px;
  padding: 11px 12px;
  background: var(--pine-bg);
  border: 1px solid var(--pine-line);
  border-radius: var(--r-m);
  transition: background var(--ease), border-color var(--ease);
}
.quick:hover { background: var(--surface-2); border-color: var(--pine); }
.quick-t { display: block; font-size: 11px; color: var(--pine); font-weight: 600; letter-spacing: .02em; }
.quick b { display: block; margin: 3px 0 6px; font-size: 13.5px; line-height: 1.45; font-weight: 600; }
.quick-go { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); }
.quick:hover .quick-go { color: var(--pine); }

/* 侧边栏 · 主导航 */
.nav { flex: 1; overflow-y: auto; padding: 6px 10px 10px; }
.nav-i {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--ink-2);
  transition: background var(--ease), color var(--ease);
}
.nav-i:hover { background: var(--surface-2); color: var(--ink); }
.nav-i.on { background: var(--pine-bg); color: var(--pine); font-weight: 600; }
.nav-i.on::before {
  content: ""; position: absolute; left: 0; top: 50%;
  width: 3px; height: 17px; margin-top: -8.5px;
  background: var(--pine); border-radius: 0 3px 3px 0;
}
.nav-ico { display: inline-flex; color: var(--muted-2); }
.nav-i.on .nav-ico, .nav-i:hover .nav-ico { color: currentColor; }
.nav-badge {
  margin-left: auto;
  min-width: 19px; height: 19px; padding: 0 5px;
  display: inline-grid; place-items: center;
  background: var(--ochre); color: #fff;
  border-radius: 10px;
  font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums;
}

/* 侧边栏 · 底部 */
.side-foot { flex: none; padding: 10px; border-top: 1px solid var(--line); background: var(--surface); }
.side-prog { padding: 2px 4px 10px; }
.sp-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 11.5px; color: var(--muted); }
.sp-top b { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.sp-foot { margin-top: 6px; font-size: 11px; color: var(--muted-2); }
.bar { height: 6px; margin-top: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pine); border-radius: 99px; transition: width .5s var(--ease); }

.side-search {
  display: flex; align-items: center; gap: 8px;
  width: 100%; padding: 9px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 13px; color: var(--muted);
  transition: border-color var(--ease), color var(--ease);
}
.side-search:hover { border-color: var(--line-2); color: var(--ink-2); }
.side-search span { flex: 1; text-align: left; }
.side-search kbd {
  padding: 1px 6px;
  background: var(--surface); border: 1px solid var(--line-2);
  border-bottom-width: 2px; border-radius: 5px;
  font-size: 10.5px; color: var(--muted);
}

#scrim { display: none; }

/* ============================ 主区 ============================ */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

#topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  height: 56px; padding: 0 22px;
  background: color-mix(in srgb, var(--paper) 86%, transparent);
  backdrop-filter: saturate(140%) blur(8px);
  -webkit-backdrop-filter: saturate(140%) blur(8px);
  border-bottom: 1px solid var(--line);
}
#menuBtn { display: none; }
.page-title { flex: 1; font-size: 15.5px; font-weight: 650; letter-spacing: -.01em; min-width: 0; }
.tb-right { display: flex; align-items: center; gap: 6px; flex: none; }
.tb-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 8px; color: var(--muted);
  transition: background var(--ease), color var(--ease);
}
.tb-btn:hover { background: var(--surface); color: var(--ink); border-color: var(--line); }

#view { flex: 1; padding: 24px 22px 40px; }
#view > * { max-width: var(--maxw); margin-left: auto; margin-right: auto; }

.site-foot {
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 18px 22px 26px;
  display: flex; flex-wrap: wrap; gap: 4px 20px;
  border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted-2);
}

/* ============================ 通用组件 ============================ */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 8px 15px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-size: 13.5px; font-weight: 600;
  cursor: pointer;
  transition: background var(--ease), border-color var(--ease), color var(--ease), transform var(--ease);
  white-space: nowrap;
}
.btn:hover { border-color: var(--muted-2); background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--pine); border-color: var(--pine); color: #fff; box-shadow: var(--sh-1); }
.btn.primary:hover { background: var(--pine-d); border-color: var(--pine-d); }
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface); border-color: var(--muted-2); color: var(--ink); }
.btn.danger { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.btn.danger:hover { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.lg { padding: 11px 20px; font-size: 14.5px; border-radius: 9px; }
.btn.full { width: 100%; }
.btn[disabled], .btn.disabled { opacity: .5; pointer-events: none; }

.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  padding: 16px 18px;
  box-shadow: var(--sh-1);
}
.card + .card { margin-top: 16px; }
.grid > .card { margin-top: 0; }
.card-h {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px; padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.card-h h3 { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 650; }
.card-h h3 .ico { color: var(--pine); }
.card-x { margin-left: auto; font-size: 11.5px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
.card-link { margin-left: auto; font-size: 12.5px; color: var(--pine); font-weight: 600; }
.card-link:hover { text-decoration: underline; }
.card-p { font-size: 13.5px; color: var(--ink-2); margin-bottom: 10px; }

.sec-head { margin-bottom: 16px; }
.sec-head h2 { font-size: 21px; letter-spacing: -.015em; }
.sec-head p { margin-top: 4px; font-size: 13.5px; color: var(--muted); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 99px;
  font-size: 11.5px; font-weight: 600; color: var(--muted);
  white-space: nowrap;
}
.chip.ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.chip.go { background: var(--pine-bg); border-color: var(--pine-line); color: var(--pine); }
.chip.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.chip.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }

.empty-card {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 8px; padding: 40px 24px;
}
.empty-card > .ico { color: var(--muted-2); }
.empty-card h3 { font-size: 16px; }
.empty-card p { font-size: 13.5px; color: var(--muted); max-width: 420px; }
.empty-card .btn { margin-top: 6px; }
.empty-mini {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 22px 12px;
  background: var(--surface-2);
  border: 1px dashed var(--line-2);
  border-radius: var(--r-m);
  color: var(--muted); font-size: 12.5px;
}
.empty-mini > .ico { color: var(--muted-2); }
.mini-line { margin-top: 10px; font-size: 12px; color: var(--muted-2); text-align: center; }
.mini-line b { color: var(--ink-2); font-variant-numeric: tabular-nums; }

.back {
  display: inline-flex; align-items: center; gap: 3px;
  margin-bottom: 12px;
  font-size: 12.5px; color: var(--muted); font-weight: 600;
}
.back .ico { transform: rotate(180deg); }
.back:hover { color: var(--pine); }

.prose { font-size: 15px; line-height: 1.86; color: var(--ink-2); }
.prose > * + * { margin-top: .82em; }
.prose p { margin: 0; }
.prose h4 { font-size: 15.5px; margin-top: 1.4em; }
.prose b, .prose strong { color: var(--ink); font-weight: 650; }
.prose code {
  padding: 1.5px 5px;
  background: var(--pine-bg);
  border: 1px solid var(--pine-line);
  border-radius: 4px;
  font-size: .88em; color: var(--pine-d);
}
html[data-theme="dark"] .prose code { color: var(--pine); }
.prose ul, .prose ol { padding-left: 1.25em; list-style: disc; }
.prose ol { list-style: decimal; }
.prose li + li { margin-top: .35em; }
.prose li::marker { color: var(--muted-2); }
.prose a { color: var(--pine); text-decoration: underline; text-underline-offset: 2px; }
.prose blockquote {
  margin: 0; padding: 2px 0 2px 13px;
  border-left: 3px solid var(--pine-line);
  color: var(--muted);
}

/* ============================ 仪表盘 ============================ */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(272px, .95fr);
  gap: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  overflow: hidden;
  box-shadow: var(--sh-2);
}
.hero-main { padding: 28px 30px; position: relative; }
.hero-main::before {
  content: "";
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--pine);
}
.hero-kicker {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  background: var(--pine-bg);
  border: 1px solid var(--pine-line);
  border-radius: 99px;
  font-size: 11.5px; font-weight: 650; color: var(--pine);
  letter-spacing: .01em;
}
.hero-title {
  margin: 14px 0 0;
  font-size: 33px; line-height: 1.2; letter-spacing: -.028em; font-weight: 680;
}
.hero-sub {
  margin-top: 12px; max-width: 44ch;
  font-size: 15px; color: var(--ink-2); line-height: 1.7;
}
.hero-sub b { color: var(--ink); font-weight: 650; background: linear-gradient(transparent 62%, var(--ochre-bg) 0); }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.hero-meta {
  display: flex; flex-wrap: wrap; gap: 8px 22px;
  margin-top: 18px; padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 12.5px; color: var(--muted);
}
.hero-meta b { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }

.hero-side {
  padding: 24px 22px;
  background: var(--surface-2);
  border-left: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 16px;
}
.lvl { }
.lvl-top { display: flex; justify-content: space-between; align-items: baseline; }
.lvl-n { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.lvl-xp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl-bar {
  height: 8px; margin-top: 8px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 99px; overflow: hidden;
}
.lvl-bar > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--pine) 0%, var(--pine-l) 100%);
  border-radius: 99px; transition: width .55s var(--ease);
}
.lvl-foot { margin-top: 6px; font-size: 11.5px; color: var(--muted-2); }

.hero-stats {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-m); overflow: hidden;
}
.hero-stats > div { padding: 11px 12px; background: var(--surface); text-align: center; }
.hero-stats b { display: block; font-size: 21px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.hero-stats span { display: block; margin-top: 1px; font-size: 11.5px; color: var(--muted); }

/* 今日任务 */
.tasks { display: flex; flex-direction: column; gap: 6px; }
.task {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  transition: border-color var(--ease), background var(--ease);
}
.task:hover { border-color: var(--line-2); background: var(--surface); }
.task .tick {
  width: 21px; height: 21px; flex: none;
  display: grid; place-items: center;
  border: 1.5px solid var(--line-2); border-radius: 50%;
  color: transparent;
}
.task .t-t { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 550; }
.task .t-s { flex: none; font-size: 11.5px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
.task.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.task.done .t-t { color: var(--muted); text-decoration: line-through; }

/* 学习建议 */
.tips { display: flex; flex-direction: column; gap: 10px; }
.tip-row { padding-left: 12px; border-left: 2px solid var(--ochre-line); }
.tip-row b { display: block; font-size: 13.5px; font-weight: 650; }
.tip-row span { display: block; margin-top: 2px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }

/* 打卡时间线 */
.timeline { display: flex; flex-direction: column; gap: 2px; max-height: 190px; overflow-y: auto; }
.tl { display: flex; align-items: center; gap: 9px; padding: 5px 2px; font-size: 12.5px; }
.tl-dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--ochre); }
.tl-d { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tl-x { color: var(--muted-2); }

/* 热力图 */
.hm {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(7, 12px);
  grid-auto-columns: 12px;
  gap: 3px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.hm-c { border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.hm-c.l0 { background: var(--surface-2); }
.hm-c.l1 { background: #CBDFD5; border-color: #CBDFD5; }
.hm-c.l2 { background: #8FC0AC; border-color: #8FC0AC; }
.hm-c.l3 { background: #4E9A7E; border-color: #4E9A7E; }
.hm-c.l4 { background: var(--pine-d); border-color: var(--pine-d); }
html[data-theme="dark"] .hm-c.l1 { background: #23483C; border-color: #23483C; }
html[data-theme="dark"] .hm-c.l2 { background: #2C6B54; border-color: #2C6B54; }
html[data-theme="dark"] .hm-c.l3 { background: #3B8F70; border-color: #3B8F70; }
html[data-theme="dark"] .hm-c.l4 { background: #6BBFA2; border-color: #6BBFA2; }
.hm-legend { display: flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 11px; color: var(--muted-2); }
.hm-legend i { width: 11px; height: 11px; border-radius: 3px; display: block; }

/* 各周进度条 */
.wbar-list { display: flex; flex-direction: column; gap: 1px; }
.wbar {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) 96px 52px;
  align-items: center; gap: 10px;
  padding: 7px 8px;
  border-radius: var(--r-s);
  transition: background var(--ease);
}
.wbar:hover { background: var(--surface-2); }
.wbar-n { font-family: var(--mono); font-size: 11.5px; color: var(--muted-2); font-weight: 600; }
.wbar-t { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wbar-bar { height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.wbar-bar > i { display: block; height: 100%; background: var(--pine-l); border-radius: 99px; }
.wbar-p { font-size: 11.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* ============================ 课程大纲 ============================ */
.week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 14px; }
.wcard {
  display: flex; flex-direction: column;
  padding: 15px 16px 13px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-l);
  box-shadow: var(--sh-1);
  transition: transform var(--ease), box-shadow var(--ease), border-color var(--ease);
}
.wcard:hover { transform: translateY(-2px); box-shadow: var(--sh-2); border-color: var(--pine-line); }
.wcard-top { display: flex; align-items: center; justify-content: space-between; }
.wcard-n { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--pine); letter-spacing: .04em; }
.wcard-done, .wcard-lock {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 99px;
  font-size: 11px; font-weight: 600;
}
.wcard-done { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-line); }
.wcard h3 { margin-top: 9px; font-size: 15.5px; line-height: 1.4; letter-spacing: -.012em; }
.wcard-short { margin-top: 5px; font-size: 12.5px; color: var(--muted); line-height: 1.55; }
.wcard-scene {
  margin-top: 8px; padding: 7px 9px;
  background: var(--surface-2);
  border-left: 2px solid var(--ochre-line);
  border-radius: 0 5px 5px 0;
  font-size: 11.5px; color: var(--ink-2); line-height: 1.55;
}
.wcard-bar { height: 5px; margin-top: 11px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.wcard-bar > i { display: block; height: 100%; background: var(--pine); }
.wcard-foot {
  display: flex; justify-content: space-between;
  margin-top: 9px; padding-top: 9px;
  border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--muted-2); font-variant-numeric: tabular-nums;
}
.wcard.locked { opacity: .62; }
.wcard.locked:hover { transform: none; }
.wcard.full { border-color: var(--ok-line); }

/* ============================ 周视图 ============================ */
.lrow-list { display: flex; flex-direction: column; gap: 8px; }
.lrow {
  display: grid; grid-template-columns: 30px minmax(0, 1fr) auto;
  align-items: center; gap: 12px;
  padding: 12px 13px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  transition: background var(--ease), border-color var(--ease);
}
.lrow:hover { background: var(--surface); border-color: var(--pine-line); }
.lrow-n {
  width: 30px; height: 30px; flex: none;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 8px;
  font-family: var(--mono); font-size: 12.5px; font-weight: 700; color: var(--muted);
}
.lrow-b { min-width: 0; display: block; }
.lrow-b > b { display: block; font-size: 14.5px; font-weight: 620; line-height: 1.45; }
.lrow-b > span { display: block; font-size: 11.5px; color: var(--muted-2); }
.lrow-s { margin-top: 3px !important; color: var(--muted) !important; font-size: 12.5px !important; line-height: 1.55 !important; }
.lrow-m { display: flex; align-items: center; gap: 6px; flex: none; }
.lrow.done .lrow-n { background: var(--ok); border-color: var(--ok); color: #fff; }
.lrow.done .lrow-b > b { color: var(--muted); }

/* 周末实战卡 */
.wk-card { }
.wk-title { font-size: 16px; margin-top: 2px; }
.wk-desc { margin-top: 5px; font-size: 13.5px; color: var(--muted); line-height: 1.65; }
.wk-sub {
  margin: 16px 0 8px;
  font-size: 11.5px; font-weight: 650;
  letter-spacing: .07em; text-transform: uppercase; color: var(--muted-2);
}
.checks { display: flex; flex-direction: column; gap: 5px; }
.checks.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.chk {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 8px 11px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  font-size: 13px; color: var(--ink-2); text-align: left; line-height: 1.6;
  transition: background var(--ease), border-color var(--ease);
}
.chk:hover { border-color: var(--line-2); background: var(--surface); }
.chk .tick {
  width: 18px; height: 18px; flex: none; margin-top: 2px;
  display: grid; place-items: center;
  border: 1.5px solid var(--line-2); border-radius: 5px;
  color: transparent; background: var(--surface);
}
.chk b { font-family: var(--mono); font-size: 12.5px; color: var(--pine); font-weight: 700; }
.chk i { color: var(--muted-2); font-size: 12px; font-style: normal; }
.chk.done { background: var(--ok-bg); border-color: var(--ok-line); color: var(--muted); }
.chk.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.chk.done b { color: var(--ok); }
.wk-card > .btn.full { margin-top: 16px; }

/* ============================ 课时视图 ============================ */
.lesson-hero { margin-bottom: 18px; }
.hero-tag {
  display: inline-block; padding: 3px 9px;
  background: var(--pine-bg); border: 1px solid var(--pine-line);
  border-radius: 99px;
  font-size: 11.5px; font-weight: 650; color: var(--pine);
}
.lesson-hero h1 { margin-top: 11px; font-size: 28px; letter-spacing: -.024em; line-height: 1.28; max-width: 24ch; }
.lesson-hero > p { margin-top: 8px; font-size: 14px; color: var(--muted); }
.hero-chips { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 13px; }
.hero-chips span {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 99px;
  font-size: 11.5px; color: var(--muted);
}

.keyline {
  margin-bottom: 18px; padding: 13px 16px;
  background: var(--ochre-bg);
  border: 1px solid var(--ochre-line);
  border-radius: var(--r-m);
}
.keyline-h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; color: var(--ochre-d); }
html[data-theme="dark"] .keyline-h { color: var(--ochre); }
.keyline ul { margin-top: 7px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 18px; }
.keyline li { position: relative; padding-left: 14px; font-size: 13.5px; color: var(--ink-2); line-height: 1.6; }
.keyline li::before { content: ""; position: absolute; left: 2px; top: .68em; width: 5px; height: 5px; border-radius: 50%; background: var(--ochre); }

.lesson-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 258px; gap: 22px; align-items: start; }
.lesson-body { min-width: 0; }
.lesson-aside { position: relative; }
.aside-stick { position: sticky; top: 74px; display: flex; flex-direction: column; gap: 14px; }
.card.side { padding: 14px; }
.card.side .card-h h3 { font-size: 13px; }

.toc { display: flex; flex-direction: column; gap: 1px; max-height: 320px; overflow-y: auto; }
.toc-i {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 7px; border-radius: 6px;
  font-size: 12.5px; color: var(--muted);
  transition: background var(--ease), color var(--ease);
}
.toc-i span {
  width: 18px; height: 18px; flex: none;
  display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 4px;
  font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--muted-2);
}
.toc-i:hover { background: var(--surface-2); color: var(--ink); }
.toc-i.t-code span { background: var(--code-bg); border-color: var(--code-line); color: var(--c-num); }
.toc-i.t-quiz span, .toc-i.t-fill span, .toc-i.t-predict span,
.toc-i.t-order span, .toc-i.t-trace span, .toc-i.t-match span,
.toc-i.t-bug span, .toc-i.t-exercise span { background: var(--pine-bg); border-color: var(--pine-line); color: var(--pine); }

.prog-mini { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted-2); }
.prog-mini .lvl-bar { margin-top: 5px; }

.notes {
  width: 100%; min-height: 108px; resize: vertical;
  padding: 9px 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  font-size: 13px; line-height: 1.65;
}
.notes:focus { outline: none; border-color: var(--pine); background: var(--surface); }
.note-foot { margin-top: 6px; font-size: 11px; color: var(--muted-2); }

.blk-anchor { height: 0; scroll-margin-top: 72px; }

.lesson-nav {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-top: 26px; padding-top: 18px;
  border-top: 1px solid var(--line);
}
.lesson-nav .btn.ghost .ico { transform: rotate(180deg); }
.lesson-nav > a:first-child .ico { transform: rotate(180deg); }
.lesson-nav > a:last-child .ico { transform: none; }

.lesson-sum {
  margin-top: 16px; padding: 14px 16px;
  background: var(--pine-bg);
  border: 1px solid var(--pine-line);
  border-radius: var(--r-m);
}
.lesson-sum p { margin-top: 5px; font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }
/* ============================ 语法高亮 ============================ */
.t-kw   { color: var(--code-kw); font-style: normal; }
.t-str  { color: var(--code-str); font-style: normal; }
.t-num  { color: var(--code-num); font-style: normal; }
.t-com  { color: var(--code-com); font-style: italic; }
.t-inc  { color: var(--code-inc); font-style: normal; }
.t-pre  { color: var(--code-str); font-style: normal; }
.t-lit  { color: var(--code-kw); font-style: normal; }
.t-typ  { color: var(--code-inc); font-style: normal; }
.t-op   { color: var(--code-dim); font-style: normal; }
.t-     { color: var(--code-ink); font-style: normal; }

/* ============================ 代码块 ============================ */
.cb {
  margin: 20px 0;
  border: 1px solid var(--line-2);
  border-radius: var(--r-m);
  background: var(--code-bg);
  overflow: hidden;
  box-shadow: var(--sh-2);
}
.cb-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--code-bg-2);
  border-bottom: 1px solid var(--code-line);
}
.cb-file {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: 600 12px/1 var(--mono);
  color: var(--code-dim);
  letter-spacing: .2px;
}
.cb-file svg { stroke: var(--code-dim); }
.cb-tools { display: flex; gap: 6px; margin-left: auto; }
.cb-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border: 1px solid var(--code-line);
  border-radius: var(--r-s);
  background: transparent;
  color: var(--code-dim);
  font: 500 12px/1 var(--font);
  cursor: pointer;
  transition: var(--ease);
}
.cb-btn:hover {
  color: var(--code-ink);
  border-color: var(--code-kw);
  background: rgba(127, 184, 160, .08);
}
.cb-btn svg { stroke: currentColor; }
.cb-run {
  color: var(--code-kw);
  border-color: rgba(127, 184, 160, .34);
  background: rgba(127, 184, 160, .10);
}
.cb-run:hover { background: rgba(127, 184, 160, .18); }

.cb-code {
  margin: 0;
  padding: 14px 16px;
  background: var(--code-bg);
  color: var(--code-ink);
  font: 400 13.5px/1.75 var(--mono);
  overflow-x: auto;
  tab-size: 4;
  -webkit-overflow-scrolling: touch;
}
.cb-code code { display: block; white-space: pre; }
.cb-flat, .cb--flat { border-radius: 0; box-shadow: none; border-top: none; }

.cb-stdin {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--code-bg-2);
  border-bottom: 1px solid var(--code-line);
}
.cb-stdin label {
  font: 600 11px/1 var(--mono);
  color: var(--code-dim);
  text-transform: uppercase;
  letter-spacing: .6px;
  white-space: nowrap;
}
.cb-stdin .cb-in {
  flex: 1;
  min-width: 0;
  padding: 5px 9px;
  border: 1px solid var(--code-line);
  border-radius: var(--r-s);
  background: var(--code-bg);
  color: var(--code-ink);
  font: 400 12.5px/1.4 var(--mono);
  outline: none;
}
.cb-stdin .cb-in:focus { border-color: var(--code-kw); }
.cb-stdin .cb-in::placeholder { color: var(--code-com); }

.cb-note {
  margin: 0;
  padding: 9px 14px;
  background: var(--surface-2);
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.6;
}

/* 运行结果 */
.cb-result {
  border-top: 1px solid var(--code-line);
  background: var(--code-bg-2);
  padding: 12px 14px;
}
.out {
  margin: 0 0 8px;
  font: 400 12.5px/1.7 var(--mono);
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--code-ink);
}
.out:last-child { margin-bottom: 0; }
.out-ok   { color: var(--code-kw); }
.out-err  { color: #E59287; }
.out-warn { color: var(--code-str); }
.out-info { color: var(--code-inc); }
.pre-err {
  padding: 8px 11px;
  border-left: 3px solid #E59287;
  background: rgba(229, 146, 135, .10);
  color: #EFC3BD;
  font: 400 12.5px/1.65 var(--mono);
  white-space: pre-wrap;
  border-radius: 0 var(--r-s) var(--r-s) 0;
}

/* 行号 */
.ln-row { display: flex; gap: 12px; }
.ln-n {
  flex: 0 0 auto;
  width: 26px;
  text-align: right;
  color: var(--code-com);
  user-select: none;
  opacity: .72;
}
.ln-t { flex: 1; white-space: pre; }

/* ============================ 通用：要求/提示条 ============================ */
.callout {
  display: flex;
  gap: 10px;
  margin: 16px 0;
  padding: 12px 14px;
  border: 1px solid var(--info-line);
  border-left: 3px solid var(--info);
  border-radius: var(--r-s);
  background: var(--info-bg);
  font-size: 13.5px;
  line-height: 1.7;
  color: var(--ink-2);
}
.callout svg { flex: 0 0 auto; stroke: var(--info); margin-top: 2px; }

.kbd-tip {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--line-2);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--surface-2);
  font: 600 11px/1.6 var(--mono);
  color: var(--muted);
}

.hint {
  margin: 10px 0 0;
  padding: 9px 12px;
  border-left: 3px solid var(--ochre-line);
  background: var(--ochre-bg);
  border-radius: 0 var(--r-s) var(--r-s) 0;
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink-2);
}

/* ============================ 互动块外壳 ============================ */
.blk {
  position: relative;
  margin: 26px 0;
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface);
  overflow: hidden;
  transition: border-color var(--ease), box-shadow var(--ease);
}
.blk.inter { border-color: var(--pine-line); box-shadow: var(--sh-1); }
.blk.inter:hover { box-shadow: var(--sh-2); }
.blk.done { border-color: var(--ok-line); }
.blk.done::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--ok);
}

.blk-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.blk-ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 28px;
  border-radius: 7px;
  flex: 0 0 auto;
}
.blk-ico svg { stroke: var(--pine); }
.blk-label {
  font: 700 14px/1.35 var(--font);
  color: var(--ink);
  letter-spacing: .2px;
}
.blk-tag {
  margin-left: auto;
  padding: 2px 8px;
  border-radius: 20px;
  font: 600 11px/1.6 var(--font);
  letter-spacing: .3px;
}

.tone-blue   .blk-ico { background: var(--info-bg); }
.tone-blue   .blk-ico svg { stroke: var(--info); }
.tone-green  .blk-ico { background: var(--ok-bg); }
.tone-green  .blk-ico svg { stroke: var(--ok); }
.tone-amber  .blk-ico { background: var(--ochre-bg); }
.tone-amber  .blk-ico svg { stroke: var(--ochre); }
.tone-red    .blk-ico { background: var(--bad-bg); }
.tone-red    .blk-ico svg { stroke: var(--bad); }
.tone-purple .blk-ico { background: var(--pine-bg); }
.tone-purple .blk-ico svg { stroke: var(--pine); }
.tone-plain  .blk-ico { background: var(--surface-2); border: 1px solid var(--line); }

.blk-p {
  padding: 14px 16px 0;
  color: var(--ink-2);
  font-size: 14px;
  line-height: 1.75;
}
.blk-body { padding: 14px 16px; }
.blk-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 11px 14px;
  border-top: 1px solid var(--line);
  background: var(--surface-2);
  flex-wrap: wrap;
}
.blk-state { margin-left: auto; font: 600 12px/1.4 var(--font); }
.blk-hint { padding: 0 16px 14px; }

/* ============================ 按钮 ============================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-s);
  background: var(--surface);
  color: var(--ink-2);
  font: 600 13px/1.35 var(--font);
  cursor: pointer;
  transition: var(--ease);
}
.btn:hover { border-color: var(--pine-line); color: var(--pine); background: var(--pine-bg); }
.btn svg { stroke: currentColor; }
.btn-solid {
  background: var(--pine);
  border-color: var(--pine);
  color: #fff;
}
.btn-solid:hover {
  background: var(--pine-d);
  border-color: var(--pine-d);
  color: #fff;
}
.btn-solid:disabled { opacity: .55; cursor: not-allowed; }
.btn-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn-check:hover { background: var(--pine-d); border-color: var(--pine-d); color: #fff; }
.ghost {
  background: transparent;
  border-color: transparent;
  color: var(--muted);
}
.ghost:hover { background: var(--surface-2); border-color: var(--line); color: var(--ink); }

/* ============================ 概念快测 quiz ============================ */
.quiz-list { padding: 4px 16px 16px; }
.q-card {
  padding: 16px 0;
  border-bottom: 1px dashed var(--line);
}
.q-card:last-child { border-bottom: none; }
.q-q {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 14.5px;
  line-height: 1.72;
  color: var(--ink);
  font-weight: 500;
}
.q-n {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border: 1px solid var(--pine-line);
  border-radius: 5px;
  background: var(--pine-bg);
  color: var(--pine);
  font: 700 12px/1 var(--mono);
  margin-top: 1px;
}
.q-opts { display: flex; flex-direction: column; gap: 7px; }
.q-opt {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  background: var(--surface);
  text-align: left;
  font: 400 13.5px/1.65 var(--font);
  color: var(--ink-2);
  cursor: pointer;
  transition: var(--ease);
}
.q-opt:hover { border-color: var(--pine-line); background: var(--pine-bg); }
.q-mark {
  flex: 0 0 auto;
  width: 15px; height: 15px;
  margin-top: 3px;
  border: 1.5px solid var(--line-2);
  border-radius: 50%;
  transition: var(--ease);
}
.q-opt.chosen { border-color: var(--info); background: var(--info-bg); }
.q-opt.chosen .q-mark { border-color: var(--info); box-shadow: inset 0 0 0 3px var(--info-bg); }
.q-opt.right {
  border-color: var(--ok-line);
  background: var(--ok-bg);
  color: var(--ink);
  cursor: default;
}
.q-opt.right .q-mark {
  border-color: var(--ok);
  background: var(--ok);
  box-shadow: inset 0 0 0 2px var(--ok-bg);
}
.q-opt.wrong {
  border-color: var(--bad-line);
  background: var(--bad-bg);
  cursor: default;
}
.q-opt.wrong .q-mark {
  border-color: var(--bad);
  background: var(--bad);
  box-shadow: inset 0 0 0 2px var(--bad-bg);
}
.q-opt.locked { pointer-events: none; }

.q-fb {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: var(--r-s);
  font-size: 13px;
  line-height: 1.7;
  color: var(--ink-2);
  border-left: 3px solid var(--line-2);
  background: var(--surface-2);
}
.q-fb.ok  { border-left-color: var(--ok);   background: var(--ok-bg); }
.q-fb.bad { border-left-color: var(--bad);  background: var(--bad-bg); }
.q-fb svg { flex: 0 0 auto; margin-top: 2px; }
.q-fb.ok  svg { stroke: var(--ok); }
.q-fb.bad svg { stroke: var(--bad); }

/* ============================ 代码填空 fill ============================ */
.fill-code {
  margin: 0;
  padding: 14px 16px;
  background: var(--code-bg);
  color: var(--code-ink);
  font: 400 13.5px/1.9 var(--mono);
  overflow-x: auto;
}
.fill-code .gap-in {
  display: inline-block;
  min-width: 44px;
  padding: 1px 7px;
  margin: 0 2px;
  border: 1px dashed var(--code-kw);
  border-radius: 4px;
  background: rgba(127, 184, 160, .10);
  color: var(--code-kw);
  font: 400 13px/1.5 var(--mono);
  text-align: center;
  outline: none;
  transition: var(--ease);
}
.fill-code .gap-in:focus {
  border-style: solid;
  border-color: var(--code-str);
  background: rgba(217, 167, 106, .14);
  color: var(--code-str);
}
.fill-code .gap-in.ok {
  border-style: solid;
  border-color: var(--code-kw);
  background: rgba(127, 184, 160, .22);
  color: var(--code-kw);
}
.fill-code .gap-in.bad {
  border-style: solid;
  border-color: #E59287;
  background: rgba(229, 146, 135, .14);
  color: #EFC3BD;
  text-decoration: line-through;
}
.gap, .gap-in { vertical-align: baseline; }

/* ============================ 输出预测 predict ============================ */
.pred-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 16px;
}
.pred-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.pred-n {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 5px;
  background: var(--ochre-bg);
  border: 1px solid var(--ochre-line);
  color: var(--ochre-d);
  font: 700 11px/1 var(--mono);
}
.pred-in {
  flex: 1;
  min-width: 0;
  padding: 7px 11px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-s);
  background: var(--surface);
  color: var(--ink);
  font: 400 13px/1.5 var(--mono);
  outline: none;
  transition: var(--ease);
}
.pred-in:focus { border-color: var(--pine); }
.pred-in.ok  { border-color: var(--ok-line);  background: var(--ok-bg); }
.pred-in.bad { border-color: var(--bad-line); background: var(--bad-bg); }

/* ============================ 顺序重排 order ============================ */
.ord-list {
  list-style: none;
  margin: 0;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.ord-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  background: var(--surface);
  cursor: pointer;
  transition: var(--ease);
  user-select: none;
}
.ord-item:hover { border-color: var(--ochre-line); background: var(--ochre-bg); }
.ord-item code {
  flex: 1;
  font: 400 13px/1.6 var(--mono);
  color: var(--ink-2);
  white-space: pre-wrap;
  word-break: break-word;
}
.ord-seq {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border: 1px solid var(--line-2);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--muted);
  font: 700 11px/1 var(--mono);
  transition: var(--ease);
}
.ord-item.picked { border-color: var(--ochre); background: var(--ochre-bg); }
.ord-item.picked .ord-seq {
  background: var(--ochre);
  border-color: var(--ochre);
  color: #fff;
}
.ord-item.ok   { border-color: var(--ok-line);  background: var(--ok-bg); }
.ord-item.ok .ord-seq   { background: var(--ok);  border-color: var(--ok);  color: #fff; }
.ord-item.bad  { border-color: var(--bad-line); background: var(--bad-bg); }
.ord-item.bad .ord-seq  { background: var(--bad); border-color: var(--bad); color: #fff; }
.ord-item.chosen { box-shadow: 0 0 0 2px rgba(192, 128, 58, .18); }

/* ============================ 变量追踪 trace ============================ */
.tr-table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: 13px;
}
.tr-table th {
  padding: 9px 12px;
  border-bottom: 1.5px solid var(--line-2);
  background: var(--surface-2);
  color: var(--ink);
  font: 700 12px/1.4 var(--font);
  text-align: left;
  letter-spacing: .3px;
}
.tr-table td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
  vertical-align: middle;
}
.tr-table tr:last-child td { border-bottom: none; }
.tr-table code {
  font: 400 12.5px/1.5 var(--mono);
  color: var(--ink);
}
.tr-in {
  width: 100%;
  min-width: 74px;
  padding: 5px 9px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-s);
  background: var(--surface);
  color: var(--ink);
  font: 400 12.5px/1.4 var(--mono);
  text-align: center;
  outline: none;
  transition: var(--ease);
}
.tr-in:focus { border-color: var(--pine); }
.tr-in.ok  { border-color: var(--ok-line);  background: var(--ok-bg); }
.tr-in.bad { border-color: var(--bad-line); background: var(--bad-bg); }
.truth {
  display: inline-block;
  padding: 3px 9px;
  border-radius: var(--r-s);
  background: var(--ok-bg);
  border: 1px solid var(--ok-line);
  color: var(--ok);
  font: 600 12.5px/1.4 var(--mono);
}
.tr-steps {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 16px;
}
.tr-step {
  display: flex;
  align-items: center;
  gap: 10px;
}
.tr-arrow { flex: 0 0 auto; color: var(--muted-2); }
.tr-arrow svg { stroke: currentColor; }
.tr-row-tag {
  flex: 0 0 auto;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--pine-bg);
  border: 1px solid var(--pine-line);
  color: var(--pine);
  font: 600 11px/1.5 var(--mono);
}
.tr-note {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

/* ============================ 配对 match ============================ */
.mt-wrap {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  padding: 14px 16px;
  align-items: start;
}
.mt-col { display: flex; flex-direction: column; gap: 8px; }
.mt-mid {
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 6px;
  color: var(--muted-2);
}
.mt-mid svg { stroke: currentColor; }
.mt-item {
  padding: 10px 13px;
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  background: var(--surface);
  text-align: left;
  font: 400 13.5px/1.6 var(--font);
  color: var(--ink-2);
  cursor: pointer;
  transition: var(--ease);
}
.mt-item:hover { border-color: var(--info); background: var(--info-bg); }
.mt-item.sel {
  border-color: var(--info);
  background: var(--info-bg);
  box-shadow: 0 0 0 2px rgba(44, 110, 143, .16);
}
.mt-item.matched {
  border-color: var(--ok-line);
  background: var(--ok-bg);
  color: var(--ink);
}
.mt-item.wrong {
  border-color: var(--bad-line);
  background: var(--bad-bg);
}
@media (max-width: 640px) {
  .mt-wrap { grid-template-columns: 1fr; }
  .mt-mid { display: none; }
}

/* ============================ 找 bug ============================ */
.bug-code {
  margin: 0;
  background: var(--code-bg);
  border-radius: 0 0 var(--r-m) var(--r-m);
  padding: 6px 0;
}
.bug-line {
  display: flex;
  gap: 12px;
  padding: 3px 16px;
  cursor: pointer;
  transition: background var(--ease);
  border-left: 3px solid transparent;
}
.bug-line:hover { background: rgba(127, 184, 160, .07); }
.bug-line.picked {
  background: rgba(192, 128, 58, .12);
  border-left-color: var(--ochre);
}
.bug-line.right {
  background: rgba(127, 184, 160, .16);
  border-left-color: var(--code-kw);
}
.bug-line.wrong {
  background: rgba(229, 146, 135, .14);
  border-left-color: #E59287;
}
.bug-n {
  flex: 0 0 auto;
  width: 22px;
  text-align: right;
  color: var(--code-com);
  font: 400 12.5px/1.75 var(--mono);
  user-select: none;
}
.bug-line code {
  flex: 1;
  font: 400 13.5px/1.75 var(--mono);
  color: var(--code-ink);
  white-space: pre-wrap;
  word-break: break-word;
}
.bug-tip {
  padding: 9px 16px;
  border-bottom: 1px solid var(--code-line);
  background: var(--code-bg-2);
  color: var(--code-dim);
  font: 400 12px/1.6 var(--mono);
}

/* ============================ 动手题 exercise ============================ */
.ex-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px;
}
.ex-card {
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface-2);
  padding: 13px 14px;
  transition: var(--ease);
}
.ex-card:hover { border-color: var(--line-2); box-shadow: var(--sh-1); }
.ex-top {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 7px;
}
.ex-badge {
  padding: 2px 8px;
  border-radius: 4px;
  font: 700 11px/1.6 var(--font);
  letter-spacing: .3px;
}
.ex-badge.easy { background: var(--ok-bg);    border: 1px solid var(--ok-line);    color: var(--ok); }
.ex-badge.mid  { background: var(--ochre-bg); border: 1px solid var(--ochre-line); color: var(--ochre-d); }
.ex-desc {
  font-size: 13.5px;
  line-height: 1.72;
  color: var(--ink-2);
  margin-bottom: 10px;
}
.ex-check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-s);
  background: var(--surface);
  color: var(--muted);
  font: 600 12px/1.4 var(--font);
  cursor: pointer;
  transition: var(--ease);
}
.ex-check:hover { border-color: var(--ok-line); color: var(--ok); background: var(--ok-bg); }
.ex-check svg { stroke: currentColor; }
.ex-check.on {
  background: var(--ok);
  border-color: var(--ok);
  color: #fff;
}
.ex-check.on svg { stroke: #fff; }

/* ============================ 训练场 playground ============================ */
.pg {
  display: grid;
  grid-template-columns: 236px 1fr;
  min-height: calc(100vh - 240px);
  border: 1px solid var(--line-2);
  border-radius: var(--r-l);
  background: var(--surface);
  overflow: hidden;
  box-shadow: var(--sh-2);
}
.pg-side {
  border-right: 1px solid var(--line);
  background: var(--surface-2);
  padding: 14px;
  overflow-y: auto;
}
.pg-title {
  font: 700 11px/1.4 var(--font);
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted-2);
  margin: 0 0 10px;
}
.pal { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.pal-in {
  width: 100%;
  padding: 6px 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-s);
  background: var(--surface);
  color: var(--ink);
  font: 400 12.5px/1.4 var(--font);
  outline: none;
}
.pal-in:focus { border-color: var(--pine); }
.pal-list { display: flex; flex-direction: column; gap: 4px; }
.pal-i {
  padding: 6px 10px;
  border-radius: var(--r-s);
  font: 400 12.5px/1.5 var(--font);
  color: var(--ink-2);
  cursor: pointer;
  transition: var(--ease);
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
}
.pal-i:hover { background: var(--pine-bg); color: var(--pine); }
.pal-i.on { background: var(--pine-bg); border-color: var(--pine-line); color: var(--pine); font-weight: 600; }
.pal-empty { padding: 8px 2px; color: var(--muted-2); font-size: 12.5px; }

.pg-tpl {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px dashed var(--line-2);
}
.tpl {
  display: block;
  width: 100%;
  margin-bottom: 5px;
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  background: var(--surface);
  color: var(--ink-2);
  font: 500 12.5px/1.4 var(--font);
  cursor: pointer;
  text-align: left;
  transition: var(--ease);
}
.tpl:hover { border-color: var(--pine-line); background: var(--pine-bg); color: var(--pine); }

.pg-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface-2);
  flex-wrap: wrap;
}
.pg-tools { margin-left: auto; display: flex; gap: 6px; }
.pg-ed {
  display: block;
  width: 100%;
  min-height: 380px;
  padding: 16px 18px;
  border: none;
  outline: none;
  resize: vertical;
  background: var(--code-bg);
  color: var(--code-ink);
  font: 400 13.5px/1.8 var(--mono);
  tab-size: 4;
  white-space: pre;
  overflow: auto;
}
.pg-in {
  padding: 10px 14px;
  border-top: 1px solid var(--code-line);
  background: var(--code-bg-2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.pg-out {
  padding: 14px 18px;
  background: var(--code-bg);
  border-top: 1px solid var(--code-line);
  min-height: 72px;
  max-height: 320px;
  overflow: auto;
}
.pg-note {
  padding: 10px 14px;
  background: var(--surface-2);
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.65;
}
.pg-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 180px;
  color: var(--muted-2);
  font-size: 13px;
  text-align: center;
}
@media (max-width: 900px) {
  .pg { grid-template-columns: 1fr; }
  .pg-side { border-right: none; border-bottom: 1px solid var(--line); }
}

/* ============================ 复习 review ============================ */
.rv-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 16px;
}
.rv-back {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: var(--r-s);
  background: var(--surface);
  color: var(--muted);
  font: 600 12px/1.4 var(--font);
  cursor: pointer;
  transition: var(--ease);
}
.rv-back:hover { border-color: var(--pine-line); color: var(--pine); }
.rv-back svg { stroke: currentColor; }
.rv-kind {
  padding: 3px 10px;
  border-radius: 20px;
  background: var(--pine-bg);
  border: 1px solid var(--pine-line);
  color: var(--pine);
  font: 700 11px/1.6 var(--font);
}
.rv-front {
  padding: 26px 20px;
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface-2);
  margin-bottom: 16px;
}
.rv-i { font: 600 11px/1 var(--mono); color: var(--muted-2); letter-spacing: .5px; }
.rv-q { font-size: 17px; line-height: 1.72; color: var(--ink); font-weight: 500; margin-top: 8px; }
.rv-code { margin-top: 14px; }
.rv-ans {
  margin-top: 14px;
  padding: 14px 16px;
  border-left: 3px solid var(--info);
  border-radius: 0 var(--r-s) var(--r-s) 0;
  background: var(--info-bg);
  font-size: 14px;
  line-height: 1.75;
  color: var(--ink-2);
  text-align: left;
}
.rv-why {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--info-line);
  font-size: 13px;
  line-height: 1.72;
  color: var(--ink-2);
}
.rv-card { text-align: center; }
.rv-acts {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.rv-acts.rate { margin-top: 14px; }
.rv-all {
  margin-top: 10px;
  font: 400 12px/1.5 var(--font);
  color: var(--muted-2);
}

/* ============================ 错题本 mistakes ============================ */
.mist-list { display: flex; flex-direction: column; gap: 10px; }
.mist {
  border: 1px solid var(--bad-line);
  border-left: 3px solid var(--bad);
  border-radius: 0 var(--r-m) var(--r-m) 0;
  background: var(--bad-bg);
  padding: 13px 15px;
}
.mist-t { font: 600 14px/1.55 var(--font); color: var(--ink); margin-bottom: 8px; }
.mist-f { margin-top: 8px; font-size: 12.5px; line-height: 1.7; color: var(--muted); }
.mist-f b { color: var(--ink-2); font-weight: 600; }
.mist-w {
  margin-top: 8px;
  padding: 8px 11px;
  border-radius: var(--r-s);
  background: var(--surface);
  border: 1px solid var(--bad-line);
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--ink-2);
}

/* ============================ 学习可视化 viz ============================ */
.vz {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}
.vz-list { display: flex; flex-direction: column; gap: 10px; }
.rs {
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-m);
  background: var(--surface-2);
}
.rs-h {
  display: flex;
  align-items: baseline;
  justify-content: space-between;

<script data-src="assets/js/data/registry.js">
/* ================================================================
   registry.js · 数据注册表
   在业务数据文件之前加载：负责建立 CONTENT / WEEKS，
   并向各 l-w*.js 课时文件暴露 registerLesson / registerWeekend。
   ================================================================ */
(function () {
  'use strict';

  var L = window.__LEGACY_DATA__ || {};

  /* ---------- 16 周大纲 ---------- */
  var WEEKS = L.WEEKS || [];

  /* ---------- 课程内容容器 ---------- */
  var CONTENT = L.CONTENT || {};

  /* ---------- 其它静态数据 ---------- */
  var GLOSSARY = L.GLOSSARY || [];
  var TEMPLATES = L.TEMPLATES || [];
  var RESOURCES = L.RESOURCES || [];

  /* ---------- 课时注册：允许外部文件按「周 / 序号」覆盖某一课时 ---------- */
  var pending = { lessons: {}, weekends: {} };

  function ensureWeek(w) {
    if (!CONTENT[w]) CONTENT[w] = { lessons: [], weekend: null };
    if (!CONTENT[w].lessons) CONTENT[w].lessons = [];
    return CONTENT[w];
  }

  function registerLesson(w, idx, lesson) {
    if (!lesson || !lesson.id) { console.warn('[registry] 课时缺少 id，已跳过', w, idx); return; }
    pending.lessons[w] = pending.lessons[w] || {};
    pending.lessons[w][idx] = lesson;
  }

  function registerWeekend(w, obj) {
    pending.weekends[w] = obj;
  }

  /* ---------- 合并：外部注册的课时覆盖同周同位置的旧课时 ---------- */
  function flushRegistry() {
    Object.keys(pending.lessons).forEach(function (w) {
      var wk = ensureWeek(w);
      var map = pending.lessons[w];
      Object.keys(map).forEach(function (idx) {
        wk.lessons[+idx] = map[idx];
      });
      // 清掉空洞
      wk.lessons = wk.lessons.filter(function (x) { return !!x; });
    });
    Object.keys(pending.weekends).forEach(function (w) {
      ensureWeek(w).weekend = pending.weekends[w];
    });
    WEEKS.forEach(function (w) {
      var c = CONTENT[w.id];
      if (c) w.lessons = c.lessons.length;
    });
  }

  /* ---------- 追加交互块：给已有课时补互动，不覆盖整课时 ---------- */
  var appends = {};
  function appendBlocks(lessonId, blocks) {
    if (!Array.isArray(blocks)) return;
    appends[lessonId] = (appends[lessonId] || []).concat(blocks);
  }
  function flushAppends() {
    Object.keys(appends).forEach(function (lid) {
      var target = null;
      Object.keys(CONTENT).forEach(function (w) {
        (CONTENT[w].lessons || []).forEach(function (l) { if (l && l.id === lid) target = l; });
      });
      if (!target) { console.warn('[registry] appendBlocks 找不到课时', lid); return; }
      target.blocks = target.blocks || [];
      var qi = -1;
      for (var i = 0; i < target.blocks.length; i++) {
        if (target.blocks[i] && target.blocks[i].t === 'quiz') { qi = i; break; }
      }
      if (qi >= 0) {
        var args = [qi, 0].concat(appends[lid]);
        Array.prototype.splice.apply(target.blocks, args);
      } else {
        target.blocks = target.blocks.concat(appends[lid]);
      }
    });
  }

  window.WEEKS = WEEKS;
  window.CONTENT = CONTENT;
  window.GLOSSARY = GLOSSARY;
  window.TEMPLATES = TEMPLATES;
  window.RESOURCES = RESOURCES;
  window.registerLesson = registerLesson;
  window.registerWeekend = registerWeekend;
  window.appendBlocks = appendBlocks;
  window.flushRegistry = flushRegistry;
  window.flushAppends = flushAppends;
  window.ensureWeek = ensureWeek;
})();

</script>
