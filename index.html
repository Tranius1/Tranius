/* ================= 第 3 周 · 课时 1 · 伸管子接水：cin 与 1/2 为什么等于 0 ================= */
registerLesson(3, 0, {
  id:"3-1",
  title:"伸一根管子出去接水",
  tag:"课时 1 · 输入 → 计算 → 输出",
  meta:["约 50 分钟","6 次编译","5 个原理","5 个互动"],
  summary:"cin 是伸出去接水的管子，空白符只是分隔符；接收变量是 double 也救不回被砍掉的小数。",
  keypoints:["cin 是接水，尖角即流向","空白符只是分隔符","回车会留给 getline","先除后转，小数救不回"],
  blocks:[
    {t:"prose",html:String.raw`<p>前两周你的程序都是“自己说给自己听”：数据写死在代码里，想把 90 改成 95，就得改源码、重新编译。今天开始让它<b>听你说</b>——你在键盘上敲几个数，程序接住、算完、吐回屏幕。</p><p>这条链路叫 <b>输入 → 计算 → 输出</b>，你以后做的每一次数据分析都跑在这条链上。而这座桥的第一块砖只有一句比方：<b>cin 是一根伸到程序外面去接水的管子</b>。</p><p>顺手把本周口号挂在这儿：<b>1/2 为什么等于 0</b>。它会在你算平均分的时候，冷不丁咬你一口。</p>`},

    {t:"code",file:"read.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int cn;
    cin >> cn;                 // 管子伸出去，接一杯水倒进 cn
    cout << "语文: " << cn << endl;
    return 0;
}
// 输入：90 然后回车
// 屏幕：语文: 90`},

    {t:"prose",html:String.raw`<p>编译运行之后，<b>屏幕上什么都不出，光标在那儿一闪一闪</b>。这不是死机，是程序把管子伸出去、在等你倒水。敲 <code>90</code> 回车，屏幕立刻补上 <code>语文: 90</code>。</p><p><b>理解错了屏幕上会看到什么：</b>你以为“程序一运行就该出东西”，于是干等半天，最后怀疑编译器坏了、终端坏了，甚至把窗口关了重来。真实答案是——<code>cin</code> 那一行会<b>卡在那里</b>，直到杯子里<b>真的接住了数据</b>，程序才往下走一行。</p>`},

    {t:"box",kind:"key",title:"cin 是接水的管子，>> 的尖角就是水流方向",text:String.raw`cin 是键盘那头的水龙头，变量是你手里的杯子。cin >> cn 念作“从 cin 接一杯水，倒进 cn”。两个大于号的尖角朝右，指的就是水流方向：从 cin 流向变量。写反成 cn >> cin，等于把杯子里的水往水龙头里倒，g++ 会甩一句：error: no match for 'operator>>' (operand types are 'int' and 'std::istream')——编译都过不去，屏幕上什么都不会有。同理，把 >> 写成 <<（cin << cn）也不行，报错是 error: no match for 'operator<<' (operand types are 'std::istream' and 'int')。`},

    {t:"code",file:"read3.cpp · 一次接三杯",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int cn, math, en;
    cin >> cn >> math >> en;    // 一根管子接三杯，从左到右依次倒
    cout << cn << " " << math << " " << en << endl;
    return 0;
}
// 输入：90 85 78 然后回车
// 屏幕：90 85 78`},

    {t:"prose",html:String.raw`<p>一次 <code>cin</code> 后面挂几个 <code>&gt;&gt;</code>，就能连着接几杯。三个杯子要三杯水：<b>给少了，程序停在原地接着等</b>（不是卡死，光标还闪）；<b>给多了，多出来的那杯不会蒸发</b>，它留在缓冲区里，等着下一次 <code>cin</code> 来取。</p><p><b>理解错了屏幕上会看到什么：</b>你在下面又写了一段 <code>cin &gt;&gt; x;</code>，运行时发现它“不用你输”就跑过去了——因为它吃的是上一次剩下的半杯。这时候别急着改代码，先数一数你总共倒了几杯水。</p>`},

    {t:"predict",title:"小预测：三种输入姿势，屏幕会不一样吗",prompt:"下面这段程序，用 A/B/C 三种姿势输入（一行空格隔开、一行 Tab 隔开、分三行每行一个），先分别写出两行输出，再编译验证。",
      code:String.raw`#include <iostream>
using namespace std;

int main() {
    int cn, math, en;
    // 输入姿势任选其一：
    // A：90 85 78      一行，空格隔开
    // B：90 85 78      一行，Tab 隔开
    // C：90 回车 85 回车 78 回车   三行，每行一个
    cin >> cn >> math >> en;
    cout << cn + math + en << endl;
    cout << (cn + math + en) / 3 << endl;
    return 0;
}`,input:String.raw`90 85 78`,output:String.raw`253
84`,explain:String.raw`三种姿势的屏幕<b>一模一样</b>：253 和 84。空格、Tab、回车在 cin 眼里统统是“这一杯倒完了”的分隔符，不是数据本身，所以“一行三个数”和“三行各一个数”完全等价。若你以为“一行只能读一个数”，在姿势 C 下就会以为后面两个数丢了——其实它们一直排在缓冲区里排着队。第二行更要紧：253 / 3 是整数除法，84.3333 被一刀砍成 <b>84</b>，这就是本课口号 1/2 = 0 的同款事故，下半场专门收拾它。`},

    {t:"box",kind:"key",title:"空白符是分隔符，永远不是数据",text:String.raw`空格、Tab、回车统称空白符。cin >> 把它们当“杯子之间的隔断”：先跳过所有空白，再读能解析成目标类型的那一段，遇到下一个空白就停手，空白本身留在缓冲区里。所以你多敲十个空格、敲个 Tab、还是敲回车换行，结果一模一样。<b>理解错了屏幕上会看到什么：</b>你会花半小时去“对齐”输入格式，或者反过来担心多敲一个空格就读错——其实 cin 根本不在乎排版，它只在乎“下一个不是空白的东西在哪”。`},

    {t:"box",kind:"tip",title:">> 留下回车，getline 见到回车就收工",text:String.raw`一句话记死：cin >> 是“挑食”的读法，跳过空白、读完就停在空白前；getline 是“通吃”的读法，从队首一路吃到回车，把回车之前的所有字符（包括空格）都收进来。它俩混着用，中间必须有人把那个回车处理掉。数据科学里最常见的场景就是“先读一个 n，再读 n 行带空格的文本”——不做这一步，你的第一行永远是空串，后面的行还会集体错位一行。`},

    {t:"prose",html:String.raw`<p>输入讲完了，轮到算。回到开头那句口号：<b>1/2 为什么等于 0</b>。</p><p>因为 <code>/</code> 这个运算符，会先看<b>两边是什么类型</b>。两边都是整数，结果就只能是整数，小数部分<b>直接砍掉</b>（截断，不是四舍五入）。所以 1/2 = 0，7/2 = 3，6/8 = 0。</p><p>下面这道题是本课的分水岭，请务必自己先推一遍。</p>`},

0.00`,explain:String.raw`a 和 d 都是 0.00，b 和 c 都是 0.75，差别只在<b>转换发生在除法之前还是之后</b>。a 这行：hit / total 两边都是 int，先算出整数 0，再装进 double 杯子，进去的时候水已经没了，杯子再大也接不到。d 这行：括号里 hit / total 早已算出 0，static_cast 只是把 0 打扮成 0.0，小数永远追不回来。b 和 c 把转换赶在除法<b>之前</b>，于是 6.0 / 8 按小数算，得 0.75。若你以为“接收变量是 double 就安全”，屏幕上这两个 0.00 就是最直接的打脸：程序不报错、不警告，只给你一个安静的错答案。`},

    {t:"box",kind:"key",title:"杯子再大，也接不回泼在地上的水",text:String.raw`赋值是分两步走的：等号右边<b>先把成品做出来</b>，左边的盒子<b>最后才接货</b>。double avg 只能决定成品怎么存，不能穿越回去命令 hit / total 保留小数。所以“接收变量是 double”救不了整数除法——小数在进盒子之前就被砍了。理解错了，你会在屏幕上看到两种骗人的结果：数据小的时候是干净的 0（比如 6/8），数据大的时候是更阴险的 84.33 → 84.00 这种“看着像对、尾巴没了”的数。这正是数据题最经典的隐形丢分。`},

    {t:"code",file:"cast.cpp · 四种写法，两种下场",code:String.raw`#include <iostream>
#include <iomanip>

int main() {
    int hit = 6, total = 8;

    double r1 = (double)hit / total;              // C 风格：能救
    double r2 = static_cast<double>(hit) / total;  // C++ 推荐：能救
    double r3 = hit * 1.0 / total;                // 先乘 1.0：同样能救
    double r4 = static_cast<double>(hit / total); // 先砍后转：救不回来

  summary: "同一组数 6、8、100，换个运算顺序就从 0 变成 75；优先级决定谁先算，结合性决定同级谁先算，而 a++ + ++a 根本没有标准答案。",
  keypoints: [
    "括号 > 乘除取余 > 加减",
    "同级从左往右结合",
    "cout 的 << 优先级比 + 低",
    "6/8*100 与 6*100/8 差在顺序",

  ],
  blocks: [

    /* ---------- 一、同一个式子，两个答案 ---------- */
    {t:"prose",html:String.raw`<p>上一课时你学会了让程序接水、算平均分。今天先看一个会让你怀疑编译器的现象：<b>数字没变、运算符没变，只是把乘和除换了位置，结果从 0 变成了 75。</b></p>`},

    {t:"code",file:"rate.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    cout << 6 / 8 * 100 << endl;   // 0
    cout << 6 * 100 / 8 << endl;   // 75
    return 0;
}
// 屏幕：
// 0
// 75`},

    {t:"prose",html:String.raw`<p>两个式子的数字完全一样，只是运算顺序不同。第一行先算 <code>6 / 8</code>，两个整数相除得 0，再乘 100 还是 0；第二行先算 <code>6 * 100</code> 得 600，再除以 8 得 75。</p><p>谁先算，不是编译器心情，是一张写死的表。</p>`},

    {t:"box",kind:"key",title:"优先级是一张固定的表，不是数学直觉",text:String.raw`从高到低：括号 → 乘 * 除 / 取余 % → 加 + 减 - → 比较 < > <= >= → 相等 == != → 逻辑与 && → 逻辑或 || → 赋值 =。同一级的运算符，从左往右算（这叫左结合）。所以 6 / 8 * 100 里 / 和 * 同级，先算左边那个 /，0 就这么来的。<b>拿不准就加括号</b>——括号不要钱，猜错顺序要命。`},

    {t:"predict",title:"小预测：四行表达式，屏幕上分别是什么",prompt:"先自己按优先级表推一遍，写四个数，再编译验证。注意第二行和第四行。",
      code:String.raw`#include <iostream>
using namespace std;

int main() {
    cout << 1 + 2 * 3 << endl;
    cout << (1 + 2) * 3 << endl;
    cout << 10 - 4 - 3 << endl;
    cout << 100 / 10 / 2 << endl;
    return 0;
}`,
      output:String.raw`7
9
3
5`,
      why:String.raw`第一行先乘后加：1 + 6 = 7。第二行括号最硬：3 * 3 = 9。第三行同级的减法从左往右：(10 - 4) - 3 = 3，不是 10 - (4 - 3) = 9。第四行同理：(100 / 10) / 2 = 5，不是 100 / (10 / 2) = 20。<b>同级运算"从左往右"这条，就是第三、四行的全部答案。</b>若你把减法和除法当成"先算后面那半"，屏幕上的 9 和 20 会稳稳地骗过你。`},

    {t:"trace",title:"推一推：10 - 4 - 3 到底先算哪一步",prompt:"跟着三步走一遍，先自己填，再看屏幕。",
      code:String.raw`#include <iostream>
using namespace std;

int main() {

    {t:"prose",html:String.raw`<p>优先级表里还有一个你没注意的成员：<code>&lt;&lt;</code>。你天天写 <code>cout &lt;&lt; x</code>，把它当"输出符号"，可它在 C++ 里是一个<b>真正的运算符</b>，优先级比加减小，比比较运算符大。</p><p>这就带来两种完全不同的写法，屏幕上的结果差得很远。</p>`},

  blocks:[
    {t:"prose",html:String.raw`<p>前三周你已经把程序练成了三样本领：<b>能读</b>（cin 接数据）、<b>能算</b>（表达式、类型转换、整数除法）、<b>能排版</b>（fixed + setprecision 把报表摆整齐）。可这三样本领有一个共同前提——<b>数据是干净的、路只有一条</b>：读进来就往下算，算完就往下印。</p><p>现实里的成绩单不是这样。老师发来的一行数据里混着 <code>-1</code>（缺考）、<code>120</code>（录错）、<code>999</code>（占位符）。上周的程序不看内容，照样把它们加起来、除下去，屏幕交出一个漂亮的平均分——漂亮，但是假的。</p><p>今天给程序装上第一套判断力：读到 <code>999</code> 时它能<b>不往下算</b>，读到 59 分时能<b>换一条路走</b>。这就是 <code>if</code> / <code>else</code>，程序第一次学会分岔。</p>`},

    {t:"code",file:"first_if.cpp",code:String.raw`#include <iostream>

    int score = 59;

    }

    return 0;
}
// 屏幕：检查完毕`},

    {t:"prose",html:String.raw`<p>编译运行，屏幕上只有一行 <code>检查完毕</code>。花括号里那句 <code>cout &lt;&lt; "及格"</code> 呢？<b>它一次也没执行</b>。</p><p><b>理解错了屏幕上会看到什么：</b>你以为条件不满足时程序会打印一个空行、会提示"不满足"、或者那一块会报错。真实屏幕是——没有空行、没有报错、什么痕迹都没有，那一整块像被橡皮擦掉了，程序直接从右花括号后面第一行继续走。判断这件事，程序只做不吭声。</p>`},

    {t:"box",kind:"key",title:"if 是一个检票口，花括号里是凭票入场的那段路",text:String.raw`<code>if (条件)</code> 后面那对花括号，是一个"要凭票进入"的代码块。条件是 <b>true</b>：整块执行一遍，然后从右花括号后面继续往下走；条件是 <b>false</b>：整块直接跳过，同样从右花括号后面继续。两条路的终点相同，中间走没走只有屏幕知道。注意条件后面<b>没有分号</b>，分号的位置决定了 if 到底管住了哪一句——后面专门收拾这个坑。`},

    {t:"code",file:"compare.cpp",code:String.raw`#include <iostream>

    int a = 90, b = 85;

// 屏幕：
// 1
// 0
// true false`},

    {t:"box",kind:"key",title:"比较的结果是一个 bool 值，屏幕默认把它印成 1 和 0",text:String.raw`<code>a &gt; b</code>、<code>a == b</code>、<code>a &lt;= b</code> 这些比较运算，算出来的东西不是数字，而是 <b>bool</b>：true 或 false。cout 默认把 true 印成 <b>1</b>、false 印成 <b>0</b>；加上 <code>boolalpha</code> 之后才印 true / false。所以上面屏幕是 1、0、true false。<b>括号不能省</b>：写成 <code>cout &lt;&lt; a &gt; b</code> 时，编译器会先把 <code>cout &lt;&lt; a</code> 算完，再拿屏幕对象去和 b 比大小，编译直接失败——想打印一个比较，就把它整个放进括号里。`},

    {t:"prose",html:String.raw`<p>比较里最要命的一对兄弟是 <code>&gt;</code> 和 <code>&gt;=</code>。它们只差一个等号，但在成绩单上差的是"及格线那一个人算不算及格"。</p><p>下面这段程序喂进 <code>60</code> 分，请你先别运行，把三条条件逐个念一遍："60 大于 60 吗？""60 大于等于 60 吗？""60 等于 60 吗？"</p>`},

    {t:"prose",html:String.raw`<p>边界还不是最阴的。真正让每个初学者都栽一次的，是键盘上少按一个 <code>=</code>：想写 <code>==</code>，写成了 <code>=</code>。</p><p>因为 <code>=</code> 在 C++ 里不是"等号"，是<b>装货</b>：把右边的值装进左边的盒子。而整个式子还会留下一个"装完的值"，这个值恰好被 if 拿去当条件用了。</p>`},

    {t:"box",kind:"warn",title:"踩坑：= 是装货，== 才是比较",text:String.raw`<code>if (score = 0)</code> 的执行顺序是：先把 0 装进 score（原来的 85 当场没了），整个式子留下 0，if 拿 0 当条件——false，整块跳过。屏幕于是出现最诡异的一幕：<b>既没打印"零分"，又悄悄把 score 改成了 0</b>。g++ 给的原文告警是 <code>warning: suggest parentheses around assignment used as truth value [-Wparentheses]</code>，很多人把它当"多余的括号提示"划过去，其实是救命提示。如果右边换成字符串，类型对不上，编译器会直接拒绝：<code>error: invalid conversion from 'const char*' to 'int' [-fpermissive]</code>。从今天起，if 的括号里出现单个 <code>=</code>，一律当成事故。`},

    {t:"prose",html:String.raw`<p>看屏幕：95 分同时过了两个检票口，所以"及格"和"优秀"两行都打印了。两个独立的 <code>if</code> 之间没有"二选一"关系，它们各问各的。</p><p>可如果题目要求"一个人只能有一个等级"呢？60 分的人屏幕只该出"及格"，不能又出"及格"又出"优秀"——两个 if 做不到，需要把判断<b>串成一条链</b>。这正是下一课时要解决的事。</p>`},

    {t:"prose",html:String.raw`<p><b>本课时收尾。</b>三句话带走：① <code>if (条件) { ... }</code> 是检票口，条件为真才进屋，为假整块跳过、屏幕不留痕；② 比较运算的结果是 <b>bool</b>，屏幕默认印 1/0，加 boolalpha 才印 true/false，边界上 <code>&gt;</code> 和 <code>&gt;=</code> 差一条人命；③ <code>=</code> 是装货，<code>==</code> 才是等号，if 的条件后面多一个分号，等于把门焊死、让花括号里的内容无条件执行。补齐 <code>else</code> 之后，"两条路必走一条"。</p><p>下一课时我们解决今天结尾留下的悬念：两个独立的 <code>if</code> 让 95 分同时打印了"及格"和"优秀"，可一个学生只能有一个等级。怎么把判断串成一条<b>从上往下问、命中即停</b>的 <code>else if</code> 链；为什么链的顺序一旦排错，95 分会被判成"及格"；还有 <code>0 &lt;= x &amp;&amp; x &lt;= 100</code> 这种区间写法和嵌套 if 的缩进陷阱。下一课时「一道题三个出口」，见。</p>`}

/* ================= 第 4 周 · 课时 2 · 一道题三个出口 ================= */
registerLesson(4, 1, {
  id:"4-2",
  title:"一道题三个出口",
  tag:"课时 2 · else if 链与区间",
  meta:["约 48 分钟","6 次编译","6 个原理","7 个互动"],
  summary:"else if 链从上往下问、命中即停，一道题只出一个出口；顺序排错或边界漏掉，屏幕上的等级就会张冠李戴。",
  keypoints:["else if 链命中即停，只出一个出口","链要从最严往最宽排","区间写成 0 <= x 且 x <= 100","else 只认最近的 if，缩进不参与判断"],
  blocks:[
    {t:"prose",html:String.raw`<p>上一课时收尾时留了个画面：95 分的人同时过了"及格"和"优秀"两个独立的检票口，屏幕打印了两行。可老师要的等级表是<b>一人一格</b>——一个学生只能有一个等级，一道题只能给一个出口。</p><p>办法是把几个判断<b>串成一条链</b>：从上往下依次问，一旦某一关通过，打完那一格就<b>立刻出门</b>，后面的条件看都不看。这就是 <code>else if</code> 链。今天要搞清三件事：链的顺序为什么能决定屏幕上的等级；区间为什么必须写成两个比较；嵌套 if 的缩进为什么骗人。</p>`},

    {t:"code",file:"three_exits.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score = 95;
    if (score >= 90) {
        cout << "优秀" << endl;
    } else if (score >= 60) {
        cout << "及格" << endl;
    } else {
        cout << "不及格" << endl;
    }
    return 0;
}
// 屏幕：优秀`},

    {t:"prose",html:String.raw`<p>屏幕只有一行"优秀"。85 分的人进来，第一关 <code>85 &gt;= 90</code> 是假，轮到第二关 <code>85 &gt;= 60</code> 是真，打印"及格"就出门；40 分的人两关都假，才落到 <code>else</code>。<b>一条链只有一个出口</b>，屏幕上永远只有一行等级。</p><p><b>理解错了屏幕上会看到什么：</b>你以为 <code>else if</code> 是"并列判断，谁真谁打印"；真实行为是"第一个真的赢，后面全部作废"。所以 95 分只打印"优秀"，不会连"及格"一起打印——这正是它和上一课时两个独立 if 的区别。</p>`},

    {t:"box",kind:"key",title:"else if 链是自上而下的检票口，命中即停",text:String.raw`把链想成楼梯：先站到第一个台阶问"条件成立吗"，成立就进门、打完卡、直接出楼；不成立才往下挪一级。<code>else if</code> 的条件有一个隐藏前提：<b>它上面所有条件都是假的</b>。所以链的顺序就是优先级，排在前面的条件会先"抢走"本该属于后面的分数。`},

    {t:"code",file:"wrong_order.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score = 95;
    if (score >= 60) {
        cout << "及格" << endl;
    } else if (score >= 90) {
        cout << "优秀" << endl;
    } else {
        cout << "不及格" << endl;
    }
    return 0;
}
// 屏幕：及格        ← 95 分被判成了及格`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：95 分被印成「及格」",text:String.raw`链的顺序反了：第一条 <code>score &gt;= 60</code> 把 60 分以上<b>全部抢走</b>，95 分在第一关就命中出门，根本没机会见到后面的"优秀"。屏幕不是报错，而是清清楚楚印着"及格"——一个看起来完全正常、实际全错的等级。<b>写链的铁律：从最严的条件往最宽的条件排</b>（先 ≥90，再 ≥60，最后 else），让窄的区间先被接住。`},

    {t:"predict",title:"小预测：60 分的人在链里落到哪一格",prompt:"先逐行念条件，写出屏幕那一行，再编译验证。注意这条链用了 > 而不是 >=。",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score = 60;
    if (score > 90) {
        cout << "优秀" << endl;
    } else if (score > 60) {
        cout << "良好" << endl;
    } else if (score >= 60) {
        cout << "及格" << endl;
    } else {
        cout << "不及格" << endl;
    }
    return 0;
}`,output:String.raw`及格`,why:String.raw`第一关 <code>60 &gt; 90</code> 假；第二关 <code>60 &gt; 60</code> 假（差一个等号，60 被挡在外面）；第三关 <code>60 &gt;= 60</code> 真，打印"及格"并出门。这条链一共用了三个边界写法，60 分刚好卡在第二关和第三关之间——屏幕上的"及格"说明它落在了第三格。若第二关写成 <code>&gt;= 60</code>，同一个 60 分会落到"良好"，屏幕就换了一行。`},

    {t:"prose",html:String.raw`<p>链的顺序解决了，下一个问题是"条件本身怎么写"。成绩的合法区间是 0 到 100，数学里你写 <code>0 ≤ score ≤ 100</code>；在 C++ 里照抄会出事（下一课时专门拆这个坑）。正确的写法是把区间拆成两个比较，中间用 <code>&amp;&amp;</code> 连起来：<code>0 &lt;= score &amp;&amp; score &lt;= 100</code>，念作"score 不小于 0 <b>并且</b> score 不大于 100"。</p>`},

    {t:"code",file:"range_check.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score;
    cin >> score;
    if (0 <= score && score <= 100) {
        cout << "数据合法" << endl;
    } else {
        cout << "数据越界" << endl;
    }
    return 0;
}
// 输入：101 回车
// 屏幕：数据越界`},

    {t:"box",kind:"key",title:"区间判断写成两个比较，用 && 连起来",text:String.raw`<code>&amp;&amp;</code> 读作"并且"：左右两边都是 true，整个条件才为 true，否则为 false。区间 <code>0 &lt;= score &amp;&amp; score &lt;= 100</code> 就是"下界不漏、上界不超"两句话一起说。两个比较都要把变量写全：写成 <code>0 &lt;= score &amp;&amp; &lt;= 100</code> 编译器会报错，因为 <code>&lt;=</code> 左右各需要一个操作数。屏幕上的表现是：101 被"数据越界"拦下，100 和 0 都被放行。`},

    {t:"fill",title:"补全：把合法区间写出来",prompt:"只填两条横线，让输入 96 时屏幕打印「数据合法」。两个空都要把变量写全。",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score;
    cin >> score;                              // 输入：96
    if (____ && ____) {                        // 合法：0 到 100 之间
        cout << "数据合法" << endl;
    } else {
        cout << "数据越界" << endl;
    }
    return 0;
}`,answers:[String.raw`0 <= score`,String.raw`score <= 100`],hint:"数学里的 0 ≤ score ≤ 100 不能连写；拆成两个完整比较，中间用 && 连起来。",output:String.raw`数据合法`,explain:String.raw`答案是 <code>0 &lt;= score</code> 和 <code>score &lt;= 100</code>。两个空都不能省掉变量名：<code>0 &lt;= score</code> 说明下界，<code>score &lt;= 100</code> 说明上界，<code>&amp;&amp;</code> 说明两个必须同时满足。若写成 <code>0 &lt;= score &amp;&amp; &lt;= 100</code>，编译器报 <code>error: expected primary-expression before '&lt;=' token</code>；若把 <code>&amp;&amp;</code> 写成 <code>||</code>，102 分也会被放进来——屏幕上是"数据合法"，报表里就多了一条假数据。`},

    {t:"prose",html:String.raw`<p>区间能顺手用了，回到链上。链里的每一格还可以<b>再套一层 if</b>，这就是嵌套。嵌套本身没问题，问题是它的写法很会骗人：</p><p>先看下面这段，score 是 70。你读代码时按缩进会以为 <code>else</code> 属于最外层那个 <code>if (score &gt;= 60)</code>，所以屏幕应该是……先别下结论，运行。</p>`},

    {t:"code",file:"dangling_else.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score = 70;
    if (score >= 60)
        if (score >= 90) cout << "优秀" << endl;
    else
        cout << "不及格" << endl;
    return 0;
}
// 屏幕：不及格`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：70 分被判成「不及格」",text:String.raw`缩进只是给人看的，<b>编译器不看空格</b>。C++ 规定 <code>else</code> 只认<b>离它最近、还没配对的 if</b>——这里最近的 if 是 <code>if (score &gt;= 90)</code>，所以 else 挂在了内层。70 分：外层 <code>&gt;= 60</code> 真，进内层；内层 <code>&gt;= 90</code> 假，落到内层的 else，打印"不及格"。屏幕就这么把 70 分判成了不及格。修法不是调整缩进，而是<b>给每一层都加花括号</b>，把"谁配对谁"写死。`},

    {t:"trace",title:"推一推：85 分沿着链走到第几关",prompt:"先填每一步，再运行核对屏幕。注意第三关的 else 什么时候才会被轮到。",code:String.raw`#include <iostream>

    {t:"order",title:"排一排：把四格判断链从最严排到最宽",prompt:"按「最严的条件先问」的顺序点选四行，排成一条完整的 else if 链。",items:[

    {t:"prose",html:String.raw`<p>链写多了，你会发现一个更稳的套路：<b>先清洗数据，再分段</b>。先确认成绩落在 0 到 100，再在这个前提下分四档——脏数据在第一关就被拦下，后面的分段不用再担心 -1 和 101。</p><p>下面这段先用 <code>||</code> 把上下界各拦一次（<code>||</code> 读作“或者”，左右有一边成立就拦下；它和 <code>&amp;&amp;</code> 是下一周第 2 课时的主角，今天先借用一下）。数轴上画一遍：<code>0 ~ 59</code> 不及格，<code>60 ~ 89</code> 及格，<code>90 ~ 100</code> 优秀，<code>&lt;0</code> 和 <code>&gt;100</code> 越界。每一段恰好有一个出口，段与段首尾相接、不重叠、不留缝，这就是一条"没有漏网"的链。</p>`},

    {t:"code",file:"full_chain.cpp",code:String.raw`#include <iostream>

  blocks:[
    {t:"prose",html:String.raw`<p>上一课时你已经有了一条"没有漏网"的三档链，但那还只是处理<b>一个干净整数</b>的理想情况。真实成绩单摊到你面前时是这样的：一行里混着 <code>-1</code>（缺考）、<code>101</code>（录错）、<code>60.0000001</code>（小数算出来的鬼数）。你的链会把它们各自送到哪一格？屏幕不会提醒你。</p><p>这一课时干一件事：<b>清洗</b>。让程序在分段之前先把脏数据拦下来，把"看起来像分数、其实不是分数"的东西挡在统计之外。今天你会把前两课时的判断、比较、链，第一次拼成一段真正有用的数据处理代码。</p>`},

    {t:"code",file:"clean_v1.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score;
    cin >> score;

        cout << "合法 " << score << endl;
    } else {
        cout << "越界，丢弃 " << score << endl;

// 输入：101 回车
// 屏幕：越界，丢弃 101`},

    {t:"prose",html:String.raw`<p>屏幕这一行就是"清洗"最原始的样子：<code>101</code> 连进统计的资格都没有，直接被拦在门口。注意条件 <code>0 &lt;= score &amp;&amp; score &lt;= 100</code> 是<b>两句话并成的一句</b>——"不小于 0"并且"不大于 100"，缺一句都拦不住。</p><p><b>理解错了屏幕上会看到什么：</b>你以为 <code>&amp;&amp;</code> 写成 <code>||</code> 也差不多。真写成 <code>||</code> 时，屏幕对 <code>101</code> 会打印"合法 101"——因为"大于等于 0 或者小于等于 100"这个条件，几乎任何数都能满足。清洗器的第一道门直接形同虚设。</p>`},

    {t:"box",kind:"key",title:"组合条件：&& 是「并且」，两个都真才算真",text:String.raw`成绩合法的完整意思是两件事同时成立：<b>不低于 0</b>、<b>不高于 100</b>。<code>&amp;&amp;</code> 把这两件事并成一个条件，两边都为 true 才放行；只要有一边为 false，整个条件就为 false，屏幕立刻走 else。<code>0 &lt;= score &amp;&amp; score &lt;= 100</code> 就是"下界不漏、上界不超"的标准写法，两个比较都要把变量写全。`},

    {t:"prose",html:String.raw`<p>整数成绩还好办，浮点才是真阴。老师用表格算出 <code>0.1 + 0.2</code>，你打眼一看是 0.3，程序打印出来也确实是 <code>0.3</code>——可你让它比一比，它会告诉你：<b>不相等</b>。</p>`},

    {t:"code",file:"float_equal.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    double a = 0.1 + 0.2;
    cout << a << endl;              // 屏幕：0.3          ← 看起来就是 0.3
    cout << (a == 0.3) << endl;     // 屏幕：0            ← 但它不等于 0.3
    return 0;
}
// 屏幕：
// 0.3
// 0`},

    {t:"prose",html:String.raw`<p>为什么打印是 0.3、比较却不相等？因为 <code>0.1</code>、<code>0.2</code>、<code>0.3</code> 写成分数都有无限循环的二进制小数，double 只能存个近似值，两个近似值加起来跟 0.3 的近似值不是同一条二进制串。而 <code>cout</code> 默认只显示 6 位有效数字，把差异藏起来了。<b>屏幕在骗你，<code>==</code> 说的是真话。</b></p><p>所以在成绩判断里，<code>if (score == 60.0)</code> 这种写法几乎永远等不到它想要的那一天——学生考了个数学上的 60 分，二进制里差了一丁点，屏幕就把他送进 else。</p>`},

    {t:"box",kind:"key",title:"浮点比较：别问「等不等」，问「差多少」",text:String.raw`浮点数几乎不能直接用 <code>==</code> 判断。标准做法是看两者之差的绝对值够不够小：<code>fabs(a - b) &lt; 1e-9</code>，用 <code>&lt;cmath&gt;</code> 里的 <code>fabs</code>，<code>1e-9</code> 就是 0.000000001，叫容差。差值比容差还小，就认为它们相等；否则不等。屏幕表现是：0.1+0.2 用这种写法会打印"相等"，用 <code>==</code> 会打印"不相等"。`},

    {t:"code",file:"float_tolerance.cpp",code:String.raw`#include <iostream>

using namespace std;

int main() {

        cout << "在容差内相等" << endl;
    } else {
        cout << "差距太大" << endl;
    }
    return 0;
}
// 屏幕：在容差内相等`},

0.3`,hint:String.raw`第二行打印出来就是 0.3，问题不在值，在比法：== 比的是完整的二进制串。`,fix:String.raw`#include <iostream>

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：打印出来是 0.3，== 却说它不等于 0.3",text:String.raw`如果你以为"屏幕打印 0.3 就是 0.3"，浮点会当场骗你：<code>cout</code> 默认只给 6 位有效数字，把 0.30000000000000004 显示成 0.3；而 <code>==</code> 比的是完整的二进制值。成绩清洗里最危险的就是这种“看起来对”：<code>if (score == 60.0)</code> 会把 60.0000001 和 59.9999999 都判成“不等于 60”，屏幕上的数字一切正常，名单却错了两个人。`},

    {t:"prose",html:String.raw`<p>条件会写了，比法也换了，现在缺一张<b>测试表</b>。清洗器最怕的不是写错代码，是"跑一遍 88 分看着挺好就交作业"。真正要试的是边界：<code>0</code>、<code>59</code>、<code>60</code>、<code>100</code>、<code>101</code>，再加一个负数 <code>-1</code>。</p><p>为什么是这几个？因为每个判断的边界都在这附近：0 和 100 是合法区间的两头，59/60 是及格线的两侧，101 是第一个越界值。下面这段程序一个输入就能跑出五个答案——换着喂。</p>`},

  blocks:[
    {t:"prose",html:String.raw`<p>上一课时你把一条成绩洗得干干净净：合法、越界分得清，浮点也不再拿 <code>==</code> 硬碰。现在老师把整张分数段报表推到你面前——要切成<b>优秀、良好、及格、不及格</b>四段，每段人数都要对。</p><p>分段这件事，C++ 给你摆了两张桌子：一张是上周已经练熟的 <code>else if</code> 链，按区间大小一档一档问；另一张叫 <code>switch</code>，它不比较大小，而是拿一个整数号码直接"跳"到对应格。今天把两张桌子并排摆，看清各自的长相、各自的坑，最后决定什么题该坐哪张。</p>`},

    {t:"code",file:"elseif_segments.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score = 85;
    if (score >= 90) {
        cout << "优秀" << endl;
    } else if (score >= 80) {
        cout << "良好" << endl;
    } else if (score >= 60) {
        cout << "及格" << endl;
    } else {
        cout << "不及格" << endl;
    }
    return 0;
}
// 屏幕：良好`},

    {t:"prose",html:String.raw`<p>屏幕一行"良好"。这条链你已经会读了：从上往下问，85 分第一关 <code>&gt;= 90</code> 假、第二关 <code>&gt;= 80</code> 真，打印后出门，后面两格看都不看。<b>它的每一格都是一个"不等式"</b>——这正是 <code>else if</code> 的看家本领：区间、大小、组合条件。</p><p>现在换 <code>switch</code> 上场。先别看语法细节，只看屏幕：同样是 85 分，它也应该只打印"良好"。</p>`},

    {t:"code",file:"switch_segments.cpp",code:String.raw`#include <iostream>

    {t:"box",kind:"key",title:"switch 是按号码找抽屉：先算一个整数，再跳到匹配的 case",text:String.raw`<code>switch (表达式)</code> 只做一件事：把括号里算成一个<b>整数</b>，然后去找同号码的 <code>case</code> 标签，从那一行开始往下执行。上面 <code>score / 10</code> 是整数除法，85 变成 8，于是跳到 <code>case 8</code>。注意 <code>case 10:</code> 后面什么也没写，直接接着 <code>case 9:</code>——这是允许的，表示"10 分和 9 开头的分数共用同一个动作"（100 分和 90~99 都算优秀）。`},

    {t:"prose",html:String.raw`<p>两张桌子都能出"良好"，那 <code>switch</code> 还有什么坑？最大的坑藏在 <code>break</code> 里。<code>switch</code> 找到入口后<b>不会自动停</b>，它会顺着往下一直执行，直到撞见 <code>break</code> 或 <code>switch</code> 的右花括号。这叫"贯穿"（fall through）。</p><p>把上面四个 <code>break</code> 拆掉，看屏幕会发生什么。</p>`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：屏幕上不是分段结果，是编译错误",text:String.raw`你以为 <code>switch (score)</code> 能按 85.5 跳转，实际屏幕上是红通通的一行 <code>error: switch quantity not an integer</code>，程序根本没跑起来。为什么？<code>case 85</code> 这种"精确等于某个号码"的跳转，表里只能放整数编号；小数没有"编号"可言。想按小数分段，只有一条路：回到 <code>else if</code> 链，用 <code>&gt;=</code> 和 <code>&lt;</code> 比大小。`},

    {t:"prose",html:String.raw`<p><b>本课时收尾。</b>三句话：① <code>else if</code> 链按区间大小从上往下问，命中即停，适合"比大小、比区间、比组合条件"；② <code>switch</code> 先算出一个整数或字符，再跳到匹配的 <code>case</code>，只认号码，不认小数和字符串；③ <code>case</code> 的动作后面必须 <code>break</code>，漏了就会贯穿，屏幕会唰唰多出好几行——<b>一个分数只出一行，就是这条要求的屏幕标准</b>。</p><p>不过你可能已经发现，这两课时里有个东西一直在偷偷出现：<code>0 &lt;= score &amp;&amp; score &lt;= 100</code> 里的 <code>&amp;&amp;</code>。它到底怎么算的？为什么写 <code>&amp;&amp;</code> 时右边有时根本不执行？为什么 <code>0 &lt;= score&lt;= 100</code> 这种数学连写在 C++ 里会变成恒真的条件？下一课时「与或非：把条件写成一句人话」，我们把条件本身拆开看清楚。</p>`}

registerLesson(5, 1, {

  title:"与或非：把条件写成一句人话",
  tag:"课时 2 · && / || / ! 与短路",

  summary:"&& 是并且、|| 是或者、! 是取反；它们有优先级、会短路，而数学里的 a<b<c 在 C++ 里会变成恒真的假条件。",
  keypoints:["&& 并且、|| 或者、! 取反","短路求值：右边可能根本不算","优先级 ! 高于 && 高于 ||","a < b < c 恒真，要拆成两个比较"],
  blocks:[
    {t:"prose",html:String.raw`<p>上一课时收尾时你注意到了：<code>0 &lt;= score &amp;&amp; score &lt;= 100</code> 里的 <code>&amp;&amp;</code> 已经偷偷用了好几天，但它到底怎么算、什么时候右边根本不执行，你还没正面看过。今天把它拆开。</p><p>三个逻辑运算符：<code>&amp;&amp;</code> 读"并且"，<code>||</code> 读"或者"，<code>!</code> 读"非"。它们干的事是把几个判断<b>拼成一句人话</b>："成绩合法<b>并且</b>没有缺考""不及格<b>或者</b>缺勤太多""<b>不是</b>优秀"。学完这一课时，你要能把任何一句中文条件翻译成一行 C++，并且看懂屏幕为什么只执行了其中一半。</p>`},

    {t:"code",file:"short_circuit.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int b = 0;
    if (b != 0 && 10 / b > 2) {
        cout << "通过了" << endl;
    } else {
        cout << "安全地退到 else" << endl;
    }
    return 0;
}
// 屏幕：安全地退到 else`},

    {t:"prose",html:String.raw`<p>注意 <code>10 / b</code> 里的 b 是 0——除以 0 在 C++ 里是运行时错误，程序会当场崩掉，屏幕上通常是一行 <code>Floating point exception (core dumped)</code>。可这段程序<b>没崩</b>，屏幕安安静静打印"安全地退到 else"。</p><p>因为 <code>&amp;&amp;</code> 有一个铁脾气：<b>左边已经假了，右边看都不看</b>。这叫短路求值。左边 <code>b != 0</code> 是假，<code>10 / b</code> 根本没机会执行，除以 0 就被跳过——短路今天救了你一命。</p>`},

    {t:"box",kind:"key",title:"短路求值：&& 左边假就停，|| 左边真就停",text:String.raw`<code>a &amp;&amp; b</code>：先算 a，a 为 false 时整个式子已经注定为 false，<b>b 不执行</b>，直接返回 false。<code>a || b</code>：先算 a，a 为 true 时整个式子已经注定为 true，<b>b 不执行</b>，直接返回 true。只有"必须看右边才能下结论"时，右边才会执行。屏幕上的表现：<code>b != 0 &amp;&amp; 10 / b &gt; 2</code> 不崩，就是右边那句除法压根没发生。`},

    {t:"code",file:"short_circuit_proof.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int n = 0;
    bool a = (n == 0) || (++n > 0);     // 左边真，右边不算
    bool b = (n != 0) && (++n > 0);     // 左边假，右边不算
    cout << a << " " << b << " " << n << endl;
    return 0;
}
// 屏幕：1 0 0`},

    {t:"box",kind:"tip",title:"短路也是「副作用会不会发生」的分界线",text:String.raw`第 4 行左边 <code>n == 0</code> 为真，<code>||</code> 短路，右边的 <code>++n</code> 没执行，n 还是 0；第 5 行左边 <code>n != 0</code> 为假，<code>&amp;&amp;</code> 短路，右边的 <code>++n</code> 也没执行，n 还是 0。屏幕 <b>1 0 0</b> 就是证据：两个 ++ 都白写着。推论：<b>不要指望短路右边的自增、赋值、输入会按你的想象发生</b>——分数统计里把 <code>count++</code> 塞进逻辑表达式，屏幕数字会莫名其妙少一个。`},

    {t:"prose",html:String.raw`<p>三个运算符一起出现时，谁先算？C++ 的优先级从高到低是：<code>!</code> &gt; <code>&amp;&amp;</code> &gt; <code>||</code>。记住一句就够：<b>非最凶，并且次之，或者最松</b>。拿不准的时候加括号，括号永远不吃亏。</p>`},

    {t:"code",file:"precedence.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    cout << boolalpha;
    cout << (true || false && false) << endl;     // && 先结合
    cout << ((true || false) && false) << endl;   // 括号改顺序
    cout << (!true || false) << endl;             // ! 优先级最高
    return 0;
}
// 屏幕：
// true
// false
// false`},

    {t:"prose",html:String.raw`<p>第一行 <code>true || false &amp;&amp; false</code>：先算 <code>false &amp;&amp; false</code> 得 false，再算 <code>true || false</code> 得 true。第二行加了括号，先算 <code>true || false</code> 得 true，再 <code>true &amp;&amp; false</code> 得 false。<b>同样的字，括号一挪，屏幕从 true 变 false</b>——这就是为什么要先问优先级。</p><p>然后是最坑的一条：数学里你写 <code>0 ≤ x ≤ 100</code>，C++ 里照抄 <code>0 &lt;= x &lt;= 100</code>，会得到一个<b>永远为真</b>的条件。</p>`},

    {t:"code",file:"chain_compare.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int x = 200;
    if (0 <= x <= 100) cout << "合法" << endl;
    else cout << "越界" << endl;
    return 0;
}
// 编译告警：warning: comparisons like ‘X<=Y<=Z’ do not have their mathematical meaning [-Wparentheses]
// 屏幕：合法        ← 200 分居然也被判"合法"`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：200 分被判成「合法」",text:String.raw`你以为 <code>0 &lt;= x &lt;= 100</code> 是"x 在 0 到 100 之间"，可 C++ 把比较运算符从左往右结合：先算 <code>0 &lt;= x</code>，得到一个 bool，屏幕底层是 <b>1 或 0</b>；再拿这个 0/1 去和 100 比，<code>1 &lt;= 100</code> 当然真，<code>0 &lt;= 100</code> 也真——<b>无论 x 是多少，结果都是 true</b>。所以 200 分、-5 分、999 分进来屏幕全是"合法"。g++ 会给出告警 <code>warning: comparisons like ‘X&lt;=Y&lt;=Z’ do not have their mathematical meaning [-Wparentheses]</code>，看到这条告警就必须停下来改，而不是忽略它继续跑。`},

    {t:"prose",html:String.raw`<p>正确写法还是老规矩：把区间拆成两个比较，用 <code>&amp;&amp;</code> 连起来——<code>0 &lt;= x &amp;&amp; x &lt;= 100</code>，念作"x 不小于 0 并且 x 不大于 100"。两个比较都得写全 x，缺一项编译器不答应。</p>`},

    {t:"code",file:"chain_compare_fixed.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int x = 200;
    if (0 <= x && x <= 100) cout << "合法" << endl;
    else cout << "越界" << endl;
    return 0;
}
// 屏幕：越界`},

    {t:"predict",title:"小预测：短路之后，n 变成几了",prompt:"先逐行写出两行屏幕，再编译验证。重点判断每一行的右边到底有没有执行。",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int n = 0;
    bool ok = (n == 0) && (++n == 1);
    cout << ok << " " << n << endl;
    bool no = (n == 0) || (++n == 99);
    cout << no << " " << n << endl;
    return 0;
}`,output:String.raw`1 1
0 2`,why:String.raw`第一行：<code>n == 0</code> 真，<code>&amp;&amp;</code> 还要看右边，于是执行 <code>++n</code>，n 从 0 变 1，<code>1 == 1</code> 真，ok = true，打印 <b>1 1</b>。第二行：此时 n 是 1，<code>n == 0</code> 假，<code>||</code> 必须看右边，于是执行 <code>++n</code>，n 从 1 变 2，<code>2 == 99</code> 假，no = false，打印 <b>0 2</b>。若你以为右边永远会执行，第一行的 n 会猜成别的数；若以为右边永远不执行，第二行又对不上——两行一起看，才把短路的方向搞清楚。`},

    {t:"fill",title:"补全：把「越界」写成两句人话",prompt:"两种写法都要能拦下 105 分。第一个空直接对整个合法区间取反，第二个空用 &lt; 和 &gt; 拆开。",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score = 105;
    if (____) {                        // 写法 A：直接否定“合法区间”
        cout << "越界" << endl;
    }
    if (____) {                        // 写法 B：用 < 和 > 拆开
        cout << "越界" << endl;
    }
    return 0;
}`,answers:[String.raw`!(0 <= score && score <= 100)`,String.raw`score < 0 || score > 100`],hint:"写法 A 用 ! 把整个括号取反（括号要包住整个区间）；写法 B 是“小于 0 或者大于 100”，用 || 连。",output:String.raw`越界
越界`,explain:String.raw`两种写法在逻辑上完全等价，这就是<b>德摩根定律</b>：<code>!(A &amp;&amp; B)</code> 等于 <code>!A || !B</code>——"不是（又合法又没超标）"就是"要么不合法，要么超标"。屏幕两行"越界"一模一样。注意写法 A 的括号：写成 <code>!0 &lt;= score &amp;&amp; score &lt;= 100</code> 会变成 <code>(!0) &lt;= score &amp;&amp; ...</code>，完全不是你要的意思。`},

    {t:"match",title:"连一连：中文条件 ↔ 一行代码",prompt:"把左边的中文句子和右边等价的条件连起来。",pairs:[
      {l:"及格但不是良好",r:"score >= 60 && score < 90"},
      {l:"不及格或缺勤天数太多",r:"score < 60 || absentDays > 5"},
      {l:"没有到及格线",r:"!(score >= 60)"},
      {l:"没有缺考",r:"!absent"}
    ],why:String.raw`翻译口诀：中文里的"并且"对应 <code>&amp;&amp;</code>，"或者"对应 <code>||</code>，"没有 / 不"对应 <code>!</code>。连完之后屏幕上的检查办法：拿一个满足条件的样例、一个不满足的样例各跑一次，两次屏幕必须不同；如果两种样例打印同一行，说明你的条件恒真或恒假。`},

    {t:"bug",title:"找 bug：越界的 101 分为什么被当成合法",prompt:"先运行，确认 101 分被放进了“合法”；再点出写错的那个运算符，让屏幕改判“越界”。",code:String.raw`#include <iostream>

int main() {

using namespace std;

int main() {
    int score = 101;
    if (score < 0 || score > 100) {

        cout << "合法" << endl;

}`,why:String.raw`<code>score &lt; 0 &amp;&amp; score &gt; 100</code> 要一个数同时满足"小于 0"和"大于 100"，这是不可能的，所以整个条件恒假，else 永远执行，屏幕对任何分数都打印"合法"。改成 <code>||</code> 之后，101 满足右边"大于 100"，屏幕立刻变"越界"。<b>写清洗条件的自检</b>：拿 -1 和 101 各跑一次，两个都应该打印"越界"；只要有一个打印"合法"，就是运算符连错了。`},

    {t:"trace",title:"推一推：短路让 b 原地不动",prompt:"先填每一步，再运行核对屏幕。重点看 || 右边那句 (b = 9) 到底有没有执行。",code:String.raw`#include <iostream>

int main() {

}`,steps:[
      {line:"int a = 5;",value:"5"},
      {line:"int b = 0;",value:"0"},
      {line:"(a > 0)",value:"true"},

      {line:"bool r",value:"true"},
      {line:"cout << r << \" \" << b",value:"1 0"}
    ],output:String.raw`1 0`,why:String.raw`<code>||</code> 左边 <code>a &gt; 0</code> 已经是 true，整个式子注定为真，右边 <code>(b = 9) &gt; 0</code> 连算都不算，b 保持 0。屏幕 <b>1 0</b> 就是证据。假如你指望靠这种写法"顺手给 b 赋值"，b 会原地不动——短路不是 bug，是标准行为，所以别把有副作用的操作放进逻辑表达式。`},

    {t:"prose",html:String.raw`<p>现在把这一天学的东西拼回数据场景：清洗成绩单、判断区间、再分段。条件可以写成一句人话，但每一句都要能被边界值验证。</p><p><b>理解错了屏幕上会看到什么：</b>优先级写错、运算符连错、数学连写照抄，这三种错的屏幕表现极其相似——数字不报错、程序不崩，只是所有分数都走进同一格。所以每次都拿"应该合法"和"应该越界"的两条数据去撞屏幕。</p>`},

    {t:"code",file:"condition_report.cpp",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int score;
    cin >> score;                               // 输入：88
    bool valid = (0 <= score && score <= 100);
    if (!valid) {
        cout << "越界，丢弃" << endl;
    } else if (score >= 60 && score < 90) {
        cout << "及格，落在 [60, 90)" << endl;
    } else if (score >= 90) {
        cout << "优秀" << endl;
    } else {
        cout << "不及格" << endl;

    return 0;
}
// 屏幕：及格，落在 [60, 90)`},

    {t:"prose",html:String.raw`<p>这段程序把逻辑运算符用全了：<code>&amp;&amp;</code> 拼区间、<code>!</code> 取反做清洗、<code>||</code> 随时可以替换复合条件。读它的方式和读一句中文一样："如果成绩不合法，丢弃；否则如果成绩在 60 到 90 之间（不含 90），及格；否则如果 90 以上，优秀；否则不及格。"</p><p>下一课时我们拿这套"人话条件"去干一件真正的大活：统计一整个班的分数段，算<b>优秀率</b>。那里会同时埋着两个坑——计数器的初始值，以及又一次出现的整数除法（人数 / 总人数）。下一课时「优秀率与边界」，见。</p>`},

registerLesson(5, 2, {

  summary:"分段统计靠计数器，优秀率 = 优秀人数 / 合法人数 × 100；分母一错、整数除法一犯，屏幕上的百分比就全错。",

  blocks:[
    {t:"prose",html:String.raw`<p>上一课时你已经能把条件写成一句人话：合法、及格、优秀、越界，每种情况都说清楚。可老师真正要的不是"一个学生是什么等级"，而是<b>一整个班的成绩报表</b>：优秀几个人、及格几个人、不及格几个人，最后一行还要给出<b>优秀率</b>。</p><p>从"一个人"到"一个班"，只多了一样东西：<b>计数器</b>。每个学生进来，看清楚他属于哪一段，就把那一段的盒子加一。最后拿优秀人数除以合法人数、乘 100，就是优秀率。听起来简单，但这里埋着两个从第 3 周就跟到现在的坑：<b>计数器先归零</b>，以及<b>整数除法</b>。</p>`},

    {t:"code",file:"rate_v1.cpp",code:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int s1 = 95, s2 = 88, s3 = 72;      // 三个学生的成绩
    int total = 3;
    int excellent = 0;                  // 计数器：先归零

    if (s1 >= 90) excellent++;
    if (s2 >= 90) excellent++;
    if (s3 >= 90) excellent++;

    double rate = excellent / total;    // 整数除法又来了
    cout << fixed << setprecision(2) << rate * 100 << "%" << endl;
    return 0;
}
// 屏幕：0.00%          ← 期望 33.33%`},

    {t:"prose",html:String.raw`<p>三个学生里 95 分那个是优秀，优秀人数是 1，总数是 3，优秀率应该是 33.33%。可屏幕交出 <code>0.00%</code>。</p><p><b>理解错了屏幕上会看到什么：</b>你以为"没人优秀所以是 0%"，可 <code>excellent</code> 明明是 1。真正被砍掉的是整数除法：<code>excellent / total</code> 两边都是 int，先算出 <b>0</b>，再装进 double 杯子——和第一周 <code>6 / 8</code> 得 0 是同一场事故，只是这次它变成了报表上的百分比。</p>`},

    {t:"box",kind:"key",title:"计数器：一个人一个盒子，进门就 ++",text:String.raw`<code>int excellent = 0;</code> 是先摆一个空盒子，<b>归零这一步不能省</b>——不写 = 0，盒子里就是内存里的随机垃圾，屏幕上的优秀人数可能是个天文数字。<code>excellent++</code> 是"这个人属于优秀段，盒子里的数加一"。一个学生只应该让一个盒子加一：分段用 <code>else if</code> 链而不是三个独立 if，就是这个原因。`},

    {t:"code",file:"rate_fixed.cpp",code:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int s1 = 95, s2 = 88, s3 = 72;
    int total = 3;
    int excellent = 0;

    if (s1 >= 90) excellent++;
    if (s2 >= 90) excellent++;
    if (s3 >= 90) excellent++;

    double rate = excellent * 100.0 / total;    // 先乘 100.0，拉进小数轨道
    cout << fixed << setprecision(2) << rate << "%" << endl;

}
// 屏幕：33.33%`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：0.00% 不是「没人优秀」",text:String.raw`屏幕上的 <code>0.00%</code> 有两种完全不同的来路：一种是优秀人数真的是 0，另一种是整数除法把小数砍没了。分辨方法很简单——<b>把优秀人数也打印出来</b>：如果"优秀 1 人"和"优秀率 0.00%"同时出现，那就是除法事故。修法和第 3 周一模一样：先乘 <code>100.0</code>，或者 <code>static_cast&lt;double&gt;(excellent) / total * 100</code>，让除法从第一步就站在小数轨道上。`},

    {t:"prose",html:String.raw`<p>优秀率通了，接下来把"优秀/及格/不及格"三段的人数都统计出来。三个计数器一字排开，每个学生进来，用 <code>else if</code> 链判断一次，只让一个盒子加一——这条链你一定已经熟，唯一要小心的是<b>边界</b>：89 和 90 之间差的那一分，决定一个学生进"及格"还是"优秀"。</p>`},

    {t:"code",file:"one_student.cpp",code:String.raw`#include <iostream>

}
// 屏幕：及格`},

    {t:"predict",title:"小预测：三个人分别进哪个盒子",prompt:"先逐行写出屏幕那一行，再编译验证。注意 s1 是 90、s2 是 89、s3 是 60，三个都在边界上。",code:String.raw`#include <iostream>

    {t:"fill",title:"补全：让优秀率算出 33.33%",prompt:"填三处横线。空 2 填一个比较运算符，空 3 填分母变量。填完输入不需要，程序里成绩已经写死。",code:String.raw`#include <iostream>

    {t:"prose",html:String.raw`<p>现在把五个学生一次读进来，三个计数器跑五遍，最后输出报表。你会发现代码里有一段几乎一模一样的东西被抄了五遍——这正是第 6 周 <code>for</code> 循环要解决的重复劳动。今天先老老实实抄完，顺便体会一下"如果班里有 50 个人"是什么滋味。</p><p><b>理解错了屏幕上会看到什么：</b>计数器忘了归零，屏幕第一行"优秀"会是个几百万的垃圾数；分段用三个独立 <code>if</code> 而不是 <code>else if</code>，一个 95 分的人会同时让"优秀"和"及格"两个盒子加一，屏幕最后一行各段人数加起来超过总人数。</p>`},

    {t:"code",file:"class_report5.cpp",code:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int s1, s2, s3, s4, s5;
    cin >> s1 >> s2 >> s3 >> s4 >> s5;      // 输入：95 88 72 60 59
    int excellent = 0, pass = 0, fail = 0;

    if (s1 >= 90) excellent++; else if (s1 >= 60) pass++; else fail++;
    if (s2 >= 90) excellent++; else if (s2 >= 60) pass++; else fail++;
    if (s3 >= 90) excellent++; else if (s3 >= 60) pass++; else fail++;
    if (s4 >= 90) excellent++; else if (s4 >= 60) pass++; else fail++;

    {t:"box",kind:"tip",title:"优秀率交卷前查三处：分子、分母、小数",text:String.raw`<b>分子</b>：优秀人数是不是只让 <code>excellent++</code> 加过一次/人；<b>分母</b>：是不是合法人数的总和，<b>越界的成绩绝不能被算进分母</b>（否则优秀率被稀释，屏幕上的百分比偏低）；<b>小数</b>：是不是先乘 <code>100.0</code> 再除，或者用了 <code>static_cast&lt;double&gt;</code>。最后再对一遍账：优秀 + 及格 + 不及格 + 越界条数 = 输入总人数。屏幕对得上，报表才算写完。`},

    {t:"order",title:"排一排：统计程序的执行顺序",prompt:"按“先清洗、再分段、最后算率”的顺序，把七行排好。",items:[

    ],answer:[1,2,3,4,5,6,7],why:String.raw`顺序就是数据处理的生命线：<b>先清洗</b>，越界成绩在第一个分支就被拦住；<b>再分段</b>，else if 链保证每个合法成绩只进一个盒子；<b>最后算率</b>，等所有盒子都加完了，才用 <code>excellent + pass + fail</code> 当分母。<b>排序排反的屏幕表现</b>：如果先算 rate 再加人，rate 是在旧数字上算的，屏幕上优秀率跟人数对不上。`},

    {t:"prose",html:String.raw`<p>最后补上"边界用例"这门手艺。优秀率是 90 分这条线切的，及格率是 60 分这条线切的；每条线都要测<b>线上</b>和<b>线下</b>两个值：</p><p><code>89 / 90</code> 测优秀线；<code>59 / 60</code> 测及格线；<code>0 / 100</code> 测合法区间的两头；<code>-1 / 101</code> 测越界。八次输入，八行屏幕，抄成一张表——只要有一行对不上，就说明链的某个边界写错了。<b>屏幕是唯一裁判</b>：代码里写 <code>&gt;=</code> 还是 <code>&gt;</code>，肉眼看不出来，89 和 90 一跑就现原形。</p>`},

    {t:"prose",html:String.raw`<p><b>本课时收尾。</b>三句话：① 分段统计靠<b>计数器</b>：先归零，每个合法成绩只让一个盒子加一，用 <code>else if</code> 链保证不漏不重；② <b>优秀率 = 优秀人数 / 合法人数 × 100</b>，分母只算清洗后的人，越界数据不进分母，乘 <code>100.0</code> 赶在除法之前，别让整数除法再把小数砍成 0；③ <b>边界用例</b>是验收标准：89/90、59/60、0/100、-1/101 各跑一遍，屏幕对得上才算写完。</p><p>你已经发现这段代码里同一个判断被抄了五遍。如果班里有 50 个人呢？明天老师换成 500 条数据呢？<b>下一周，<code>for</code> 循环登场</b>：初始化、条件、步进三段式，让你把"读一个、判一个、记一个"这件事只写一遍，机器替你重复。计数器还会陪着你，只是从"抄五遍"变成"转一圈"。第 6 周「重复劳动交给机器」，见。</p>`},

  blocks:[

    {t:"prose",html:String.raw`<p>第 5 周你把 0–100 分切成了几段：<code>90</code> 以上优秀、<code>60</code> 到 <code>89</code> 及格、<code>60</code> 以下不及格。为了统计一个班，你把同一段 <code>else if</code> 抄了五遍，抄到第五遍时已经不敢保证没抄错——上一课时结尾那句“50 个人呢？500 条数据呢？”还悬在半空。现在导员把 47 份成绩发给你，让你一份一份判段，答案该揭晓了。</p><p>你会怎么做？复制 47 段 <code>if</code>，把里面的分数一个个改掉。改到第 30 份手一抖，屏幕上就多出一份 89 分的“优秀”。这一周的口号就是治它的：<b>重复劳动交给机器</b>。你只把“干一次”的规则写清楚，机器负责重复 47 次。</p>`},

    {t:"code",file:"manual5.cpp · 手写五遍",code:String.raw`#include <iostream>

    {t:"prose",html:String.raw`<p>五行还能忍。可要是打 500 道题、判 47 份成绩呢？复制粘贴的代码有一个致命毛病：<b>它只认识你写死的那几个数</b>。想让屏幕从“第 5 题”变成“第 500 题”，你只能再复制 495 行。</p><p>机器最擅长的恰恰是这种事。给它一个“计数器”，告诉它从几数到几，剩下的交给它。</p>`},

    {t:"code",file:"for5.cpp · 机器数五遍",code:String.raw`#include <iostream>

    {t:"box",kind:"key",title:"for 三步：从哪开始、到哪停、每步挪多少",text:String.raw`<code>for (int i = 1; i &lt;= 5; i++)</code> 的括号里用两个分号切成三格，一格回答一个问题：<b>① 初始化</b>（起跑线）：<code>int i = 1</code>，计数器从 1 开始，只在进门时做一次；<b>② 条件</b>（终点线）：<code>i &lt;= 5</code>，每轮进门先检查，成立才进循环体，不成立就退出；<b>③ 步进</b>（一步多长）：<code>i++</code>，每轮干完活回来，计数器的值自己加一。跑圈就是这个画面：站上起跑线 → 看是否还没到终点 → 跑一圈 → 往前走一步 → 再看是否到终点。`},

    {t:"prose",html:String.raw`<p>把五轮拆开看，执行顺序是：<b>初始化一次</b> → 判断 <code>1 &lt;= 5</code> 成立 → 打印“第 1 题” → <code>i++</code> 变成 2 → 判断 <code>2 &lt;= 5</code> 成立 → 打印“第 2 题” → …… → 打印“第 5 题” → <code>i++</code> 变成 6 → 判断 <code>6 &lt;= 5</code> 不成立 → 退出，走到 <code>return 0;</code>。</p><p><b>屏幕上的证据：</b>恰好五行，不多不少。多一行说明条件写宽了，少一行说明写窄了——这是下一课时要专门收拾的边界问题。</p>`},

    {t:"predict",title:"小预测：三种 for，屏幕各是什么样",prompt:"三段循环各自打印一行。先把你预测的三行写在纸上，再编译验证。注意第二段是倒着数，第三段打印的是同一句话。",
      code:String.raw`#include <iostream>
using namespace std;

int main() {
    for (int i = 1; i <= 4; i++) cout << i * 2 << " ";
    cout << endl;
    for (int i = 3; i >= 1; i--) cout << i << " ";
    cout << endl;

      output:String.raw`2 4 6 8

Hi Hi Hi`,
      why:String.raw`第一段：i 是 1 2 3 4，乘以 2 打印 2 4 6 8。第二段：初始化是 3，条件是 <code>i &gt;= 1</code>，步进是 <code>i--</code>，所以倒着数 3 2 1——<b>for 的方向由步进决定，加号朝上就正着数，减号朝下就倒着数</b>。第三段：i 只当计数器用，从 0 数到 2 一共三圈，打印三个 Hi。若你以为第三段会打印 0 1 2，就会答错：i 只出现在括号里，循环体里压根没让屏幕打印它。`},

    {t:"box",kind:"key",title:"循环变量 i 是计数器，自己会变",text:String.raw`<code>i</code> 这个名字只干一件事：数第几圈。它每一轮结束都会被 <code>i++</code> 改一次，所以循环体里<b>不要再去动它</b>。你在循环体里再写一句 <code>i++</code>，等于一圈走两步，屏幕上的数字就会跳着走。数据科学里的循环变量通常叫 <code>i</code>、<code>j</code> 或 <code>k</code>，习惯写法就是 <code>for (int i = 0; i &lt; n; i++)</code>——从 0 数到 n-1 共 n 次，这个约定第 9 周遍历数组时会天天用到。`},

    {t:"code",file:"jump.cpp · 一圈走了两步",code:String.raw`#include <iostream>
using namespace std;

int main() {
    for (int i = 1; i <= 5; i++) {
        cout << i << " ";
        i++;                 // 循环体里又加了一次
    }
    cout << endl;
    return 0;
}
// 屏幕：1 3 5`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：说好的 1 2 3 4 5 变成 1 3 5",text:String.raw`你明明写的是 <code>1 &lt;= 5</code>，屏幕却只打印 1 3 5。原因不是条件写错，而是循环体里那句多余的 <code>i++</code>：机器在每圈末尾已经替你加了一次，你又手动加了一次，于是 1 走两步到 3，3 走两步到 5，5 走两步到 7，条件不成立退出。<b>屏幕上少掉的 2 和 4 就是被你自己跳过的两圈。</b>排查这种“数字跳着走”的问题，先数循环体里有没有动循环变量，再怀疑条件。`},

    {t:"code",file:"scope.cpp · i 只活在循环里",code:String.raw`#include <iostream>
using namespace std;

int main() {
    for (int i = 1; i <= 3; i++) {
        cout << i << " ";
    }
    cout << endl;
    // cout << i << endl;   // 取消注释，g++ 原文：

    return 0;
}
// 屏幕：1 2 3`},

    {t:"prose",html:String.raw`<p>再看一段真实报错。在 <code>for</code> 括号里定义的 <code>i</code>，它的地盘只有整段循环：循环一结束，这个名字就消失了。你跑到循环外面喊 <code>i</code>，编译器根本不知道你在说谁，屏幕上不会出现任何运行结果——<b>程序在编译阶段就被拦下了</b>。</p><p>想在外面用循环数到的值，要么在循环外先声明 <code>int i = 0;</code>，要么在循环里把它算进另一个变量（比如累加器）。这周你会大量用到后一种。</p>`},

    {t:"prose",html:String.raw`<p>光会重复打印还不够。真正的活是：<b>一边循环，一边把每一圈的结果攒起来</b>。比如 1+2+…+100，你不可能手写 100 个加号。</p><p>这就需要一个“存钱罐”式的变量：进门时清空，每一圈往里扔一个数，出门时把罐子里的总数倒出来。它有个名字，叫<b>累加器</b>。</p>`},

    {t:"code",file:"sum100.cpp · 累加器",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int sum = 0;                       // 存钱罐先清零
    for (int i = 1; i <= 100; i++) {
        sum += i;                      // 每圈扔一个 i 进去
    }
    cout << "1+2+...+100 = " << sum << endl;
    return 0;
}
// 屏幕：1+2+...+100 = 5050`},

    {t:"box",kind:"key",title:"累加器是一口存钱罐，进门先清空",text:String.raw`<code>sum += i</code> 是 <code>sum = sum + i</code> 的缩写：把罐子里现有的钱加上这一圈的 i，再放回罐子。三个要点：<b>① 必须先初始化 <code>int sum = 0;</code></b>——没清零的罐子里是上一手房客留下的垃圾；<b>② 累加器初值 0，累乘器初值 1</b>——因为 0 乘任何数都是 0，乘法罐子从 1 开始；<b>③ 它写在循环外面</b>，每圈只更新、不重新定义。屏幕上的 5050 是唯一答案：如果屏幕给你 0，八成是罐子没清零或 <code>sum = i</code> 写成了覆盖。`},

    {t:"trace",title:"推一推：存钱罐每圈多了多少",prompt:"把下面这段程序跑一遍太简单，值钱的是过程。跟着每一步填出 sum 的值，再核对屏幕。",

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：累加器没清零，总分变成一团乱码",text:String.raw`把 <code>int sum = 0;</code> 写成 <code>int sum;</code>，程序照样编译通过、照样跑，但屏幕上可能跳出 <code>-858993460</code>、<code>32767</code> 之类的怪数，也可能换个编译器就变成别的数。因为局部变量不清零，里面留着上一手程序用过的位，C++ 标准不管这件事（未定义行为）。g++ 默认连警告都不给；加上 <code>-Wall</code> 才会提示 <code>warning: 'sum' is used uninitialized in this function</code>。记住这个画面：<b>程序不报错，只是给你一个错的答案</b>，这是数据统计最危险的失败方式。`},

    {t:"bug",title:"找 bug：总分为什么是个负数",prompt:"下面这段程序要算 1+2+…+10，运行后屏幕上却是一个看不懂的数。指出问题出在第几行，再只改这一行修好它。",

    {t:"fill",title:"补全：把奇数加起来",prompt:"程序要算 1+3+5+…+99。三处横线分别是：累加器初值、循环的上界、每一步跨多大。填完运行，屏幕应输出 2500。",

    {t:"order",title:"把这段求和程序排回能编译的顺序",prompt:"下面 8 行被彻底打乱了。按 C++ 程序从上到下的正确顺序排好，注意 <code>main</code> 的花括号要包住整段逻辑。",

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：84 和 84.00 长得像，其实是同一个坑",text:String.raw`最容易骗过眼睛的一幕：你给平均分加上了 <code>fixed &lt;&lt; setprecision(2)</code>，屏幕上出现 <b>84.00</b>。它看起来“格式很正式”，其实和整数 84 一样——小数在除法那一步就被砍光了，后面的格式只是给整数补了两个零。<b>自查方法：把同一个数用 <code>sum / 3</code> 和 <code>sum / 3.0</code> 各打印一次</b>，屏幕一个 84.00、一个 84.33，差别立刻现形。`},

    {t:"code",file:"format_avg.cpp · 两种平均并排看",code:String.raw`#include <iostream>

    {t:"prose",html:String.raw`<p>到这里，均值的第一个误差来源收拾完了。第二个更隐蔽，它连除法都没有：<b>0.1 + 0.2</b>。</p><p>你在数学课上学的是 0.1 + 0.2 = 0.3，可到了屏幕上，它可能既不是 0.3，也不认自己等于 0.3。下面这段程序不复杂，但它是整个数据科学里最经典的一次“打脸”。</p>`},

    {t:"predict",title:"★ 小预测：0.1 + 0.2 到底等于几",prompt:"三行输出，先别运行。第 1 行你也许觉得 obvious，第 2 行会让你改口，第 3 行最狠。",

      why:String.raw`第 1 行 0.3：<code>cout</code> 默认只显示 6 位有效数字，把尾巴藏起来了。第 2 行 0.30000000000000004：<code>fixed &lt;&lt; setprecision(17)</code> 打开 17 位小数，真实存储值露出来——它比 0.3 大了一点点。第 3 行 0：既然真实值不是 0.3，<code>a + b == 0.3</code> 就是 <b>false</b>，bool 按整数打印成 0。若你以为“浮点数就是有小数点的数、加减法和数学一样”，第 3 行的 0 会当场推翻它：<b>屏幕上看到的 0.3 是格式化出来的，不是存进去的。</b>`},

    {t:"box",kind:"key",title:"浮点数存的是二进制小数的近似值",text:String.raw`计算机用二进制存小数。<code>0.5</code>、<code>0.25</code>、<code>0.125</code> 这类“分母是 2 的幂”的数能精确存；而 <code>0.1</code> 的二进制是无限循环小数（就像十进制里的 1/3 = 0.3333…），double 只有 64 位，只能存一个<b>最接近</b>的近似值。两个近似值一相加，误差落到最低位，于是你在屏幕上看到 0.30000000000000004。这不是 C++ 的 bug，IEEE 754 标准就是这么设计的，所有语言都一样——Python 里 <code>0.1 + 0.2</code> 同样是这个值。`},

    {t:"code",file:"tenth.cpp · 0.1 加十次",code:String.raw`#include <iostream>

    }

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：1 变成了 0.99999999999999989",text:String.raw`十次 0.1 相加，屏幕上第一行是 <b>0.99999999999999989</b>；把精度调回 6 位，第二行又变回 <b>1</b>。同一个变量，两个屏幕、两个数字——因为显示时四舍五入，而存储里一直是那个比 1 小一点点的近似值。<b>由此得到一条铁律：不要用 <code>==</code> 判断两个浮点数相等。</b>比较 0.1+0.2 和 0.3 会得到 false；判断两个浮点是否“相等”，要比它们之差的绝对值小于一个极小值，比如 <code>fabs(a - b) &lt; 1e-9</code>（需要 <code>#include &lt;cmath&gt;</code>）。另外别用 <code>%</code> 对小数取余：编译器会直接报错 error: invalid operands of types 'double' and 'int' to binary 'operator%'——<code>%</code> 只能用于整数。`},

    return 0;
}
// 屏幕：
// 0
// 1`},

    {t:"prose",html:String.raw`<p>均值还有一个搭档：<b>方差</b>。平均数告诉你数据“中心在哪”，方差告诉你数据“散得有多开”。数据科学里判断一次考试难度、一批数据的稳定性，光看平均分是不够的。</p><p>方差的定义是“每个数与均值之差的平方，再取平均”。手算 1 到 5：均值是 3，五个偏差是 -2、-1、0、1、2，平方是 4、1、0、1、4，平均一下就是 2。而程序里更常用的速算公式只有一句：<b>平方的平均 − 平均的平方</b>。</p>`},

    {t:"code",file:"variance.cpp · 平方和与方差",code:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int sum = 0, sq = 0, n = 5;
    for (int i = 1; i <= n; i++) {
        sum += i;                  // 一次遍历同时攒两个罐子
        sq += i * i;
    }
    double mean = sum / 5.0;
    double var = sq / 5.0 - mean * mean;   // 平方的平均 − 平均的平方
    cout << fixed << setprecision(4);
    cout << "mean " << mean << endl;
    cout << "sq " << sq << endl;
    cout << "var " << var << endl;
    return 0;
}
// 屏幕：
// mean 3.0000
// sq 55
// var 2.0000`},

    {t:"box",kind:"key",title:"平方和：一个循环可以同时伺候两个罐子",text:String.raw`<code>sum</code> 攒和，<code>sq</code> 攒平方和，一次遍历两件都办完——这是数据统计里最常用的“一趟扫描同时算多个量”。算方差时注意除法：<code>sq / 5.0</code> 里 5.0 是 double，才会得到 11.0；写成 <code>sq / 5</code> 先算出整数 11，碰上不能整除的平方和就会悄悄截断，屏幕上又是一个“差一点点”。方差算完是 2.0000，和手算一致；屏幕上的 2.0000 是格式化出来的，内部是 2.0。`},

    {t:"prose",html:String.raw`<p>上一课时你追完了均值的“差一点点”。这一课时还有另一种差一点点，而且更常见：<b>循环少跑一圈或多跑一圈</b>。程序没有任何精度问题，也没有报错，只是屏幕上少了最后一个数，或者多打印了一行。</p><p>先看一段你几乎一定会写错一次的程序：用 for 求 1 加到 10。屏幕上给出的答案，是 45。</p>`},

    {t:"code",file:"off_by_one.cpp · 差一个数，差 10",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int a = 0, b = 0;
    for (int i = 1; i < 10; i++) a += i;
    for (int i = 1; i <= 10; i++) b += i;
    cout << "i < 10  " << a << endl;
    cout << "i <= 10 " << b << endl;
    return 0;
}
// 屏幕：
// i < 10  45
// i <= 10 55`},

    {t:"box",kind:"key",title:"边界三问：从几开始、到几停、用小于还是小于等于",text:String.raw`写任何循环之前，先在纸上回答三个问题：<b>① 从哪个数开始？② 到哪个数停？③ 停的条件用 <code>&lt;</code> 还是 <code>&lt;=</code>？</b><code>i &lt; 10</code> 读作“只要 i 小于 10 就继续”，它<b>不包含</b> 10；<code>i &lt;= 10</code> 读作“i 小于或等于 10 都继续”，它<b>包含</b> 10。上面那段程序里，两个循环只差一个等号，屏幕上一个 45 一个 55，正好差了最后那个 10。<b>数据统计里没有“差不多”</b>：少加一个数，平均分就错。`},

    {t:"code",file:"print_1to5.cpp · 打印 1 到 5 的两种写法",code:String.raw`#include <iostream>
using namespace std;

int main() {
    for (int i = 1; i <= 5; i++) cout << i << " ";
    cout << endl;
    for (int i = 1; i < 5; i++) cout << i << " ";
    cout << endl;
    return 0;
}
// 屏幕：
// 1 2 3 4 5
// 1 2 3 4`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：你要 1 到 5，屏幕只给 1 到 4",text:String.raw`把条件写成 <code>i &lt; 5</code>、心里想的却是“一直到 5”，屏幕就会少一个数。反过来，把“从 1 开始数 5 个数”写成 <code>i &lt;= 5</code> 而起点是 <code>i = 0</code>，你会得到 0 1 2 3 4 5 共六个——<b>多出来的 0 是最常见的 off-by-one</b>。这类错误不报错，只是数字悄悄多一个少一个；考试里丢分、报表里人数对不上，都是它干的。写完循环先别急着跑，把 i 的首尾两个值代进去检查一遍，比调试十分钟都快。`},

    {t:"predict",title:"小预测：三段循环各打印什么",prompt:"三段循环都只改了一个地方：起点、条件、方向。先写出三行输出，再编译验证。",
      code:String.raw`#include <iostream>

int main() {
    for (int i = 0; i < 5; i++) cout << i << " ";
    cout << endl;
    for (int i = 1; i <= 5; i++) cout << i << " ";
    cout << endl;
    for (int i = 5; i > 0; i--) cout << i << " ";

1 2 3 4 5
5 4 3 2 1`,
      why:String.raw`第一段从 0 开始、条件不含 5，打印 0 1 2 3 4，正好 5 个数；第二段从 1 开始、条件含 5，打印 1 2 3 4 5，也是 5 个数——<b>“跑 5 次”至少有这两种写法，区别是取值范围</b>。第三段倒着数，条件 <code>i &gt; 0</code> 含 1、步进减一，打印 5 4 3 2 1。若你分不清“跑几次”和“值范围”，这题一定会错一行：次数一样，屏幕内容可以完全不同。`},

    {t:"prose",html:String.raw`<p>边界写错的后果有两种极端，都值得你亲眼见一次。</p><p>第一种叫<b>空循环</b>：条件第一次判断就不成立，循环体一次都不执行。程序不报错，直接跳过——屏幕上少了一整块内容，你却看不出哪里漏了。</p>`},

    {t:"code",file:"empty_loop.cpp · 一次都不跑的循环",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int count = 0;
    for (int i = 10; i < 5; i++) {
        count++;
        cout << "这一行永远不会执行" << endl;
    }
    cout << "循环跑了 " << count << " 次" << endl;
    return 0;
}
// 屏幕：循环跑了 0 次`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：死循环的屏幕是疯狂滚动，不是卡死",text:String.raw`另一种极端是<b>死循环</b>：条件永远成立，循环永远不结束。典型写法有 <code>for (int i = 1; i &gt; 0; i++)</code>（i 只会越来越大，永远大于 0），或者把步进方向写反：<code>for (int i = 10; i &gt;= 0; i++)</code>（想倒数却写了加号）。屏幕上的表现是：同一行字一行一行往下滚，越滚越快，窗口像卡死——其实程序在拼命干活，按 <b>Ctrl+C</b> 可以强行打断。排查口诀：<b>看步进的方向，和条件的要求是不是一路的。</b>要“越来越小”，步进就得 <code>i--</code>；条件写着 <code>i &gt;= 0</code>，步进却是 <code>i++</code>，那就是在跟条件对着干。`},

    {t:"prose",html:String.raw`<p>找这类毛病，最土也最好用的办法是：<b>把循环变量打印出来</b>。你猜的都是“应该跑了几次”，屏幕不会撒谎——它把每一圈的 i 摆给你看，边界一眼就现形。</p>`},

registerLesson(7, 0, {
  id:"7-1",
  title:"不知道要跑几次：while",
  tag:"课时 1 · while 与 do-while",
  meta:["约 50 分钟","6 次编译","6 个原理","8 个互动"],
  summary:"for 数的是圈数，while 等的是条件变假；条件写在门口、变量在体内更新，少更新一步屏幕就永远刷同一行。",
  keypoints:["while = 只要条件真就继续","条件里的变量必须在体内更新","条件先判断，可能一次都不跑","do-while 先做一次再判断","do-while 末尾必须有分号"],
  blocks:[

    {t:"prose",html:String.raw`<p>上一课时你说“循环的边界写对了，for 就无敌了”。可 for 有个前提：<b>你得提前知道跑几次</b>。猜数字游戏里，你可能一次猜中，也可能猜二十次——上界根本写不出来。</p><p>所以今天换一种循环：不数圈数，只等一个条件变假。它叫 <b>while</b>。本周的口号也随之换了：<b>不知道要跑几次</b>。你只回答一个问题——“什么情况下还要继续？”</p>`},

    {t:"code",file:"guess.cpp · 猜中为止",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int target = 7;
    int guess = 0;
    int tries = 0;
    while (guess != target) {      // 只要还没猜中，就继续
        cin >> guess;
        tries++;
        if (guess != target) {
            cout << "不是 " << guess << "，再猜" << endl;
        }
    }
    cout << "猜中了，用了 " << tries << " 次" << endl;
    return 0;
}
// 输入：3 9 7
// 屏幕：
// 不是 3，再猜
// 不是 9，再猜
// 猜中了，用了 3 次`},

    {t:"box",kind:"key",title:"while：条件写在门口，更新写在里面",text:String.raw`<code>while (guess != target) { ... }</code> 的画像是：<b>每圈进门之前先看条件</b>，条件为真就进来干活，为假就出门。它比 for 少了两个格子（没有初始化和步进的位置），所以那两件事要你自己安排在别处：<b>① 进循环之前</b>，把条件里用到的变量准备好（<code>int guess = 0;</code>）；<b>② 循环体里</b>，必须有东西能让条件最终变假（<code>cin &gt;&gt; guess</code>）。少任何一样，循环要么进不去，要么出不来。`},

    {t:"prose",html:String.raw`<p>把 while 和 for 摆在一起看：<code>for (int i = 1; i &lt;= 5; i++)</code> 干的事，等价于先写 <code>int i = 1;</code>，再 <code>while (i &lt;= 5)</code>，最后在循环体末尾写 <code>i++</code>。区别只在<b>谁负责数圈</b>：for 把三步钉在一行里，逼你写清楚；while 把三步散在上下，靠你自己记得。</p>`},

    {t:"code",file:"while_sum.cpp · 加到超过 100 为止",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int sum = 0, n = 0;
    while (sum <= 100) {
        n++;
        sum += n;
    }
    cout << "加到第 " << n << " 项，和是 " << sum << endl;
    return 0;
}
// 屏幕：加到第 14 项，和是 105`},

    {t:"box",kind:"key",title:"while 的圈数是被条件“算”出来的",text:String.raw`上面这段程序事先根本不知道要加多少项：它只知道“和还没超过 100 就继续”。于是 n 从 1 试到 14，sum 一路变成 105，条件 <code>105 &lt;= 100</code> 第一次不成立，循环才收手。<b>for 的圈数写在括号里，while 的圈数写在条件里</b>——调用数据时也一样：读到文件结束、读到输入失败、读到某个标记为止，都属于“次数未知，条件已知”。注意 n 和 sum 都在循环体里被更新：n 加一、sum 加上新的 n，两个变量各司其职。`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：同一行字永远刷不完",text:String.raw`忘写更新，while 就会变成死循环。<code>int i = 1; while (i &lt;= 5) { cout &lt;&lt; i &lt;&lt; endl; }</code> 里没有 <code>i++</code>，i 永远是 1，条件永远成立——屏幕上 <b>1 一行接一行地滚，永远不停</b>，窗口看起来像卡死，按 Ctrl+C 才能打断。还有一种更隐蔽的：条件里的变量没初始化，<code>int i; while (i &lt;= 5)</code>，i 里是垃圾值，循环可能一次都不进，也可能跑出天文数字。写 while 的纪律只有一条：<b>进门之前先赋值，进门之后必须有人改它。</b>检查方法很简单：指着条件里的每个变量问一句“它在循环里被谁改了？”答不上来就是死循环预备役。`},

    {t:"predict",title:"小预测：两个 while，屏幕各打印什么",prompt:"第一段正常跑，第二段呢？先写出两行输出，再编译验证。",
      code:String.raw`#include <iostream>
using namespace std;

int main() {
    int i = 1;
    while (i <= 3) {
        cout << i << " ";
        i++;
    }
    cout << endl;
    int j = 1;

        cout << "不会执行 ";

    }
    cout << "j=" << j << endl;

      output:String.raw`1 2 3
j=1`,
      why:String.raw`第一段从 1 打印到 3，每圈末尾 <code>i++</code>，到 4 时条件不成立退出。第二段条件 <code>j &lt; 1</code> 一上来就不成立（j 是 1），循环体<b>一次都没进</b>，所以屏幕上没有“不会执行”，直接打印 j=1。这正说明 while 和 for 一样是<b>先判断后执行</b>：条件假，一行都不跑。若你以为 while 至少会跑一次，第二行就是答案。`},

    {t:"prose",html:String.raw`<p>但有些场景，你<b>必须至少先干一次</b>，再去判断要不要继续。比如点菜：先上一份，吃了才知道要不要再来一份；比如输入校验：先读一个数，才知道它合不合法。</p><p>C++ 给这种“先做后判”的循环起名叫 <b>do-while</b>。</p>`},

    {t:"code",file:"do_while.cpp · 先做一次再判断",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int i = 10;
    do {
        cout << "do-while 执行了一次，i=" << i << endl;

    } while (i < 5);              // 注意这里的分号

    return 0;
}
// 屏幕：
// do-while 执行了一次，i=10
// 循环结束，i=11`},

    {t:"code",file:"compare.cpp · 同样的条件，两种循环",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int a = 10;
    while (a < 5) {
        cout << "while 执行" << endl;
        a++;
    }
    cout << "while 之后 a=" << a << endl;

    int b = 10;
    do {
        cout << "do-while 执行" << endl;
        b++;
    } while (b < 5);
    cout << "do-while 之后 b=" << b << endl;

}
// 屏幕：
// while 之后 a=10
// do-while 执行
// do-while 之后 b=11`},

    {t:"box",kind:"key",title:"while 条件在门口，do-while 条件在门后",text:String.raw`同样是 <code>i &lt; 5</code> 这个条件、同样是 i = 10 起步：<code>while</code> 先看条件，不成立就不进门，所以屏幕上只剩一句“while 之后 a=10”；<code>do-while</code> 先无条件执行一次循环体，再问“还要不要继续”，所以屏幕上多了一行“do-while 执行”。一句话记：<b>while 可能零次，do-while 至少一次。</b>还有一条语法硬规定：<b>do-while 结尾的 <code>while (...)</code> 后面必须带分号</b>，漏了 g++ 会报 error: expected ';' before 'return'——编译都过不去，屏幕上什么都不会出现。`},

    {t:"prose",html:String.raw`<p>上一课时的猜数字游戏有个硬伤：目标数写死是 7，玩两次就背下来了。真正的猜数字，目标应该<b>每次运行都不一样</b>。可程序是确定性的，你让它算 1+1，它永远给 2——它上哪去变出一个“随机”的数？</p><p>答案是：C++ 没有真随机，它只会给你一串<b>看起来</b>乱、其实是按固定公式算出来的数，叫<b>伪随机数</b>。这一课时就把这串数请出来，顺便让骰子和猜数字都跑起来。</p>`},

    {t:"box",kind:"key",title:"rand() 是伪随机：公式固定，种子决定从哪开始",text:String.raw`<code>rand()</code> 每被调用一次，就按一个固定公式吐出下一个整数，范围从 0 到 <code>RAND_MAX</code>（g++ 13.2 上是 2147483647）。它内部记着“当前算到哪了”，这个起点就是<b>种子</b>。不写 <code>srand</code> 时种子固定是 1，所以<b>同一个程序连跑两次，屏幕上一模一样</b>——这正是“伪”字的含义。想换一串数，就得给种子换值：<code>srand(42)</code> 让序列从 42 对应的位置开始。<b>种子相同，序列必相同</b>；种子不同，序列才不同。`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：六颗骰子全一样",text:String.raw`把 <code>srand(time(0))</code> 写进循环，屏幕会非常诡异：<b>六颗骰子一模一样</b>。因为 <code>time(0)</code> 只精确到秒，同一秒内六次调用的种子都相同，而“种子相同的第一颗骰子”也必然相同——你看到的画面就是 <code>4 4 4 4 4 4</code>。记住：<b>srand 在整个程序里只调一次，放在 main 开头；rand() 才是循环里反复调用的那个。</b>这也解释了另一个疑问：为什么刚运行完立刻再运行一次，偶尔会得到同一串？因为两次落进了同一秒。`},

/* ================= 第 7 周 · 课时 3 · 连续正面：计数与终止 ================= */

  blocks:[

    {t:"prose",html:String.raw`<p>上一课时电脑终于会出随机数了。这一课时我们用它做一件更像“实验”的事：<b>抛硬币，看连续出现几个正面</b>。规则很简单——一枚硬币一直抛，记录正面连击的长度，直到第一次出现反面为止。</p><p>你可能抛出 1 个正面就断了，也可能一口气连出 6 个。循环要跑几次，抛之前没人知道——while 的用武之地。但除了循环，你还需要两样新东西：一个<b>计数器</b>来数连击长度，一把<b>剪刀</b>在遇到反面时立刻收工。</p>`},

    {t:"code",file:"count_streak.cpp · 数到第一个反面为止",code:String.raw`#include <iostream>
#include <cstdlib>
#include <ctime>
using namespace std;

int main() {
    srand(7);
    int streak = 0, tosses = 0;
    while (true) {                     // 不知道要抛几次
        tosses++;
        int coin = rand() % 2;         // 1 = 正面，0 = 反面
        if (coin == 1) {
            streak++;                  // 正面：连击 +1
        } else {
            break;                     // 反面：当场收工
        }
    }
    cout << "连续 " << streak << " 个正面，抛了 " << tosses << " 次" << endl;
    return 0;
}
// 屏幕：连续 6 个正面，抛了 7 次`},

    {t:"box",kind:"key",title:"计数器 + break：数连击，遇到反面就掀桌",text:String.raw`<code>streak</code> 是计数器，和累加器是亲戚：进门先清零（<code>int streak = 0;</code>），每抛出一个正面就 <code>streak++</code>。<code>break</code> 是循环里的一把剪刀：执行到它的那一刻，<b>整条循环立刻结束</b>，程序跳到循环后面的第一行。所以 <code>while (true)</code> 并不是死循环——它没有条件可判断，但它有出口 <code>break</code>。<code>while (true)</code> 的读法是“先跑着，出口我自己安排”。`},

    {t:"prose",html:String.raw`<p>和 break 长得很像的是 <code>continue</code>。它的动作是：<b>跳过本轮剩下的代码，直接回到循环开头</b>，判断条件、开始下一轮。区别一句话：<b>break 剪掉整条循环，continue 只剪掉当前这一轮。</b></p><p>看一个具体的：抛 10 次硬币统计正面个数，遇到反面就 <code>continue</code>——反正反面不需要计数，跳过它，下一轮继续。</p>`},

    {t:"code",file:"continue_heads.cpp · 反面就跳过这一轮",code:String.raw`#include <iostream>
#include <cstdlib>
#include <ctime>
using namespace std;

int main() {
    srand(42);
    int heads = 0;
    for (int i = 1; i <= 10; i++) {
        int coin = rand() % 2;
        cout << coin << " ";
        if (coin == 0) continue;       // 反面：本轮不数，直接下一轮
        heads++;
    }
    cout << endl << "正面 " << heads << " 次" << endl;
    return 0;
}
// 屏幕：
// 0 0 1 1 0 0 1 0 1 1
// 正面 5 次`},

    {t:"box",kind:"key",title:"break vs continue：一个出门，一个回头",text:String.raw`<b>break</b>：从循环里直接跳出去，循环后面的代码继续执行，但剩下的轮次全都不跑了。<b>continue</b>：不出去，只是这一轮提前结束，回到条件判断处开始下一轮。判断用哪个，看你要的是“不干了”还是“这一单不算”。统计正面个数用 continue（反面这轮不算，但还要继续抛）；数到第一个反面就收工用 break（整场结束）。<b>把两者写反，程序不会报错，屏幕上的数字会告诉你后果。</b>顺带一条编译期硬规矩：break 和 continue 只能在循环里用，写在循环外面，g++ 原文是 error: break statement not within loop or switch（continue 版本是 error: continue statement not within a loop）。`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：该停的时候没停，连续长度变成了正面总数",text:String.raw`这段程序要数“第一个反面之前连续几个正面”。关键那几行是：<code>for (int i = 1; i &lt;= 6; i++) { int coin = rand() % 2; if (coin == 1) streak++; else continue; }</code>。它把 <code>break</code> 写成了 <code>continue</code>，于是遇到反面只是跳过这一轮，循环继续抛——最后 <code>streak</code> 数的是“6 次里一共几个正面”，不是“连续几个正面”。<b>屏幕上不会报错，只会给你一个语义完全不同的数。</b>本课后面那个 bug 就是它。`},

    {t:"predict",title:"小预测：continue 和 break 各打印什么",prompt:"两段循环都用了剪刀，但剪的东西不一样。先写出两行输出，再编译验证。",
      code:String.raw`#include <iostream>
using namespace std;

int main() {
    for (int i = 1; i <= 5; i++) {
        if (i % 2 == 0) continue;      // 偶数这一轮不算
        cout << i << " ";
    }
    cout << endl;
    for (int i = 1; i <= 5; i++) {
        if (i == 3) break;             // 到 3 就整场结束
        cout << i << " ";
    }
    cout << endl;
    return 0;
}`,
      output:String.raw`1 3 5
1 2`,
      why:String.raw`第一段：偶数被 <code>continue</code> 跳过，但循环没停，所以 1 3 5 都打出来了。第二段：i 到 3 时 <code>break</code> 一执行，整条循环结束，3 及之后的 4、5 都不再打印，屏幕只有 1 2。若你以为 continue 也会让循环停下，第一行的 1 3 5 就是反证；若你以为 break 只跳过 3、后面继续，第二行的 1 2 会纠正你——<b>break 之后没有“后面”了。</b>`},

    {t:"prose",html:String.raw`<p>回到硬币实验。用 <code>while (true)</code> + break 能停，但它靠的是“每次抛到反面”这个小概率事件——理论上，<b>一直抛不到反面</b>的概率虽然趋近 0，但循环的终止性不是靠条件保证的，是靠概率保证的。程序能跑，但写起来不够硬气。</p><p>更稳的写法是把终止条件直接放进 while：<b>连击还没到 3，就继续抛</b>。</p>`},

    {t:"code",file:"three_heads.cpp · 连出 3 个正面就收工",code:String.raw`#include <iostream>
#include <cstdlib>
#include <ctime>
using namespace std;

int main() {
    srand(2027);
    int streak = 0, tosses = 0;
    while (streak < 3) {               // 终止条件写在门口
        tosses++;
        if (rand() % 2 == 1) {
            streak++;
        } else {
            streak = 0;                // 断了，连击清零
        }
    }
    cout << "抛了 " << tosses << " 次，连续正面 " << streak << " 个" << endl;
    return 0;
}
// 屏幕：抛了 3 次，连续正面 3 个`},

    {t:"box",kind:"key",title:"连续计数的命门：断了必须归零",text:String.raw`<code>streak</code> 和普通计数器有一个关键区别：它不仅加，还要在断掉时<b>归零</b>。抛出反面那一刻，之前的连击全部作废，<code>streak = 0;</code> 把计数器按回起点。少了这一句，程序会数成“总共几个正面”，而不是“连续几个正面”——屏幕上的数字看着合理，语义完全错了。用了归零之后，<code>while (streak &lt; 3)</code> 的终止性也有了保证：每次抛硬币都有 1/2 概率把 streak 清零，连出 3 个正面的概率是 1/8，期望抛 14 次左右就会停，不是靠运气硬撑。`},

    {t:"prose",html:String.raw`<p>上一周你学的是 <code>while</code>：<b>不知道要跑几次</b>，条件成立就一直跑，跑到条件不成立才停。今天换一种重复：<b>次数你事先就知道，而且这些重复排成了一张表</b>。九行九列的乘法表一共 81 个格子；三行四列的星号方阵一共 12 颗星。</p><p>先把最小的画面摆出来：屏幕上要出现 3 行、每行 4 颗星。你手里只有 <code>cout &lt;&lt; "*";</code> 这一句能印一颗星——要印 12 颗，得让它跑 12 次。可这 12 颗星不是一串，而是<b>分成 3 行、每行 4 颗</b>。只用一个循环管不了这件事：它只会一直印，不知道自己什么时候该换行。</p>`},

    {t:"code",file:"rect.cpp · 3 行 4 列",code:String.raw`#include <iostream>
using namespace std;

int main() {
    for (int row = 1; row <= 3; ++row) {        // 外层：管行
        for (int col = 1; col <= 4; ++col) {    // 内层：管列
            cout << "*";                        // 一行里的每一颗星
        }
        cout << endl;                           // 一行印完，换行
    }
    return 0;
}
// 屏幕：
// ****
// ****
// ****`},

    {t:"prose",html:String.raw`<p>盯着屏幕看两秒，你会发现它的节奏：<b>内层先把一行的 4 颗星印完，外层才走一步</b>；然后内层又从 <code>col = 1</code> 重新开始，印下一行。所以那句 <code>cout &lt;&lt; endl;</code> 只能写在外层循环里面、内层循环外面——它的位置决定了"什么时候换行"。</p><p>把两个循环想成两根手指：外层手指按住"现在第几行"，内层手指在这一行里从左往右点 4 下。外层点一下，内层点四下。</p>`},

    {t:"box",kind:"key",title:"外层管行，内层管列；次数是乘积",text:String.raw`外层循环每走一步，内层循环都要<b>从头到尾完整跑一圈</b>。所以内层循环体的执行次数 = 外层次数 × 内层次数：上面这段是 3 × 4 = 12，乘法表是 9 × 9 = 81。记住这一条，你就能在运行之前算出"这段代码到底跑多少次"——这是以后估程序快慢的第一步。看到两层循环，心里先冒出"乘积"两个字。`},

    {t:"predict",title:"小预测：外层变量乘 10 加内层变量",prompt:"先写出三行输出，再编译验证。注意每个数是怎么拼出来的，以及每换一行 j 从哪里开始。",

31 32 33`,why:String.raw`i 是行号、j 是列号，<code>i * 10 + j</code> 把行列拼成一个两位数：第一行 11 12 13，第二行 21 22 23。若你以为内层变量 j 会一直涨到 9、或者每行只打一个数，这三行会立刻露馅：<b>每换一行，j 都从 1 重新开始</b>。这就是"内层变量只属于内层这一圈"最直观的证据。`},

    {t:"box",kind:"tip",title:"内层变量出了这层循环就没了",text:String.raw`两个循环各用各的变量名，是因为循环变量的作用域只在这一层循环的花括号里。<code>for (int j = 1; j &lt;= 4; ++j)</code> 结束后，j 就被收回了；你在循环外面再写 <code>cout &lt;&lt; j;</code>，g++ 会报 <code>error: 'j' was not declared in this scope</code>——不是 j 拼错，是它已经不存在了。反过来，外层变量在内层里看得见，所以 <code>j &lt;= i</code> 这种"内层拿外层当上界"的写法完全合法。`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：endl 写错位置",text:String.raw`你想打印一个方块，却把 <code>cout &lt;&lt; endl;</code> 写进了内层循环的花括号里。程序编译完全通过，没有任何报错，屏幕上却是：12 颗星竖着排成 12 行，每行一颗。因为内层每印一颗星，就紧跟着换一次行。<b>理解错了屏幕上会看到什么：不是报错，是一个形状完全不对的图案</b>。看到"该横着排的竖着排了"，第一件事就是找 endl 躲在哪一层花括号里。`},

    {t:"code",file:"table.cpp · 三角形乘法表",code:String.raw`#include <iostream>

        for (int j = 1; j <= i; ++j) {          // 内层：这一行印 j 个

        }
        cout << endl;

// 1x3=3 2x3=6 3x3=9
// 1x4=4 2x4=8 3x4=12 4x4=16

    {t:"prose",html:String.raw`<p>注意内层的上界：<code>j &lt;= i</code>，不是固定的 5。于是每行的格子数是 1、2、3、4、5——内层跑几圈，由<b>外层当前的值</b>决定。这是嵌套循环的第二层用法：<b>让内层的次数跟着外层变</b>。三角形、乘法表、阶梯图，全是这么来的。</p><p>而总执行次数变成 1 + 2 + 3 + 4 + 5 = 15，不再是整齐的乘积。所以被问"这段代码打印多少次"时，别条件反射地拿两个数相乘——<b>先看内层上界跟不跟外层走</b>。</p>`},

    {t:"box",kind:"tip",title:"估次数三步：先看外层次数，再看内层上界",text:String.raw`第一步，数外层循环跑几次；第二步，看内层上界是固定的数，还是外层变量；第三步，固定就相乘，跟着外层走就求和。屏幕上的行数一定等于外层次数，每行的个数等于内层次数——算完次数，先拿"几行几列"对一下屏幕，对不上就是边界写错了。`},

    {t:"prose",html:String.raw`<p>上一课时我们说"循环变量可以当坐标用"。现在把这张坐标纸铺开：画一个边长为 2 的正方形，里面塞一个半径为 1 的圆——圆正好和正方形四边相切。谁能算出这个圆有多大？数学家算了几千年，可今天你只用 <b>两次循环和一堆"点"</b>，就能把 π 估到小数点后好几位。</p><p>办法只有一句话：<b>往正方形里撒点，数一数有多少点落进了圆里</b>。点撒得越均匀，圆内点数和总点数的比就越接近面积比。先别急着用随机数——我们先用最老实的方式"数满整张格子"。`},

    {t:"code",file:"grid.cpp · 数格子（穷举版）",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int N = 10;                 // 坐标从 1 数到 N
    int inside = 0;             // 圆内的格子数
    for (int i = 1; i <= N; ++i) {          // 横坐标 i
        for (int j = 1; j <= N; ++j) {      // 纵坐标 j
            if (i * i + j * j <= N * N) {   // 离原点的距离不超过 N：在圆内
                ++inside;
            }
        }
    }
    cout << "正方形里的格子: " << N * N << endl;
    cout << "圆里的格子: " << inside << endl;
    cout << "π 的估计: " << 4.0 * inside / (N * N) << endl;
    return 0;
}

// 圆里的格子: 69

    {t:"prose",html:String.raw`<p>屏幕上的 <code>2.76</code> 离 3.14159 差了 0.38，很丑，但它真实地说明了一件事：<b>圆内格子的占比，接近圆面积占正方形面积的比例</b>。为什么最后要乘 4？正方形面积是 (2r)² = 4r²，圆面积是 πr²，两者之比是 π/4；我们数的又只是第一象限里的四分之一圆，所以：</p><p style="text-align:center"><b>π ≈ 4 × 圆内格子数 ÷ 格子总数</b></p><p>格子越细，数得越准：把 N 从 10 加到 1000，屏幕上的估计会变成 3.13755。可 N 翻 10 倍，格子数就翻 100 倍——为了准一位小数，你得多数一百倍的东西。</p>`},

    {t:"box",kind:"key",title:"面积比就是概率比：π = 4 × 圆内点数 / 总点数",text:String.raw`这里没有高深概率论，只有一句话：<b>点落在某个区域里的比例，等于那个区域的面积占总面积的比例</b>（只要点撒得足够均匀）。圆面积占正方形面积的比例是 π/4，所以圆内点数 / 总点数 ≈ π/4，两边乘 4 就得到 π。这个"用随机实验估一个数"的方法叫蒙特卡洛方法——它的好处是不挑形状：哪怕圆改成任何奇怪的图形，只要你能判断"这个点在不在里面"，就能估出面积。`},

    {t:"prose",html:String.raw`<p>数格子有一个躲不开的麻烦：<b>你得把整个正方形数一遍</b>，N × N 个位置一个不落。真实世界里我们常常没这么多时间，也不知道图形边界在哪。</p><p>换个思路：<b>我不数满，我只随机抽查</b>。往正方形里随便扔 N 个点（位置是随机的），数一数几个进了圆，比例照样成立。抽查 10 万个点，和数 10 万个格子一样费劲，但抽查可以选任意位置，不用管 N 的平方——这就是蒙特卡洛。回到第 7 周你学过的武器：<code>rand()</code> 造 0 到 1 之间的随机数，<code>srand()</code> 决定种子。</p>`},

    {t:"prose",html:String.raw`<p>上一课时我们用随机点和面积比估出了 π。现在把同样的思路用到"概率"上。先回答一个会惊到你的问题：<b>一个班里 23 个人，其中至少有两个人生日相同的概率是多少？</b></p><p>你的直觉大概是：一年 365 天，23 个人占 23/365 ≈ <b>6.3%</b>，小概率事件，得凑到一百多人才能撞上。真实答案是 <b>50.73%</b>——比直觉大了 8 倍。这不是魔术，是题目被理解错了：直觉算的是"<b>某个人和我</b>同生日"，而题目问的是"<b>任意两个人</b>同生日"。23 个人能配出多少对？这个数字才是关键。</p>`},

    {t:"prose",html:String.raw`<p>昨天算生日悖论的时候，你有没有觉得别扭：要判断 23 个人里哪一对同生日，得先有 23 个"生日"放在手边。可你只有一个变量装一个数的抽屉，23 个抽屉就得起 23 个名字：<code>b1, b2, b3 …</code>。写起来是灾难，循环也帮不上忙——循环变量 <code>i</code> 没法变成变量名。</p><p>今天给你一个整齐的货架：<b>一排连续的格子，共用同一个名字，用编号找到第几格</b>。这个货架叫数组。先看它长什么样。</p>`},

    {t:"box",kind:"key",title:"数组 = 一排连续格子，一个名字 + 一个下标",text:String.raw`<code>int scores[5]</code> 向内存要了 <b>5 个连续的 int 格子</b>，它们的名字统一叫 <code>scores</code>。想拿第几格，就把编号写在方括号里：<code>scores[0]</code> 是第 1 格，<code>scores[2]</code> 是第 3 格。注意：<b>下标从 0 开始</b>，所以长度为 5 的数组，合法下标是 0、1、2、3、4，最后一个格子是 <code>scores[4]</code> 而不是 <code>scores[5]</code>。为什么从 0 开始？记住一句话就行：<b>下标是"离第一格有多远"</b>，第一格离自己 0 格，所以是 0。`},

    {t:"prose",html:String.raw`<p>屏幕上第 1 格是 88，第 5 格是 61，和初始化列表里的第 1 个、第 5 个数对上了。但要注意两个容易混的编号体系：<b>"第几个"从 1 数，"[ ]"里从 0 数</b>。人说"第 1 格"，代码写 <code>scores[0]</code>；人说"第 5 格"，代码写 <code>scores[4]</code>。这个错位会跟你一整个学期，第 9-3 课时我们会专门收拾它。</p><p>还有：<code>scores[5]</code> 不是"第 5 格"，它已经越过最后一个格子了——那个位置不属于你。今天先记住"没有这一格"，下个课时再看它到底会闯什么祸。</p>`},

    {t:"prose",html:String.raw`<p>这一段是本课时的核心画面：<b>循环变量 i 从 0 走到 4，正好就是数组的下标</b>。<code>scores[i]</code> 不再是一个写死的格子，而是"第 i 号格子"——i 变到哪，就读到哪。数组加循环，是数据批处理的标准姿势：以后你要对一组数求和、找最大、排序、分桶，前半句永远是"用一个循环把每个格子走一遍"。</p><p>注意条件写的是 <code>i &lt; 5</code>：i 取到 4 就停，正好覆盖最后一个合法下标。写成 <code>i &lt;= 5</code> 就会多走一步，踩到那个"不属于你"的位置。</p>`},

    {t:"prose",html:String.raw`<p>上一课时我们给打擂台找好了初始值。收尾时留了一个问题：长度为 5 的数组，合法下标是 0 到 4，那 <code>a[5]</code> 呢？</p><p>它是这条红线的另一边。写出来的时候编译器不拦你，程序照样编译、照样运行，甚至很多时候屏幕上看起来一切正常。但只要越过一格，你读到的、写到的就可能是别人的数据、程序的返回地址、或者一块根本不属于你的内存。这一格之差，是 C++ 里最经典的"看起来能跑，其实已经错了"。</p>`},

    {t:"code",file:"oob.cpp · 越过最后一格",code:String.raw`#include <iostream>
using namespace std;

int main() {

    cout << "a[2] = " << a[2] << endl;   // 合法：最后一格
    cout << "a[3] = " << a[3] << endl;   // 越界：这个位置不存在

}
// 屏幕（不可预测，下面是某一次运行）：

    {t:"box",kind:"key",title:"长度为 n，合法下标是 0 到 n-1——没有第 n 格",text:String.raw`数组的格子编号是 <b>0, 1, 2, …, n-1</b>，一共 n 个。最后一个格子的下标是 <b>n-1</b>，不是 n：长度 5 的数组最后一格是 <code>a[4]</code>，<code>a[5]</code> 已经站在数组外面了。为什么从 0 开始？因为下标本质是"从第一格出发走多远"：第一格走 0 步，最后一格走 n-1 步。C++ <b>不做边界检查</b>——它只看你给的地址，不问那个地址是不是你的。这不是漏洞，是设计取舍：为了快，把检查的责任交给了你。`},

    {t:"prose",html:String.raw`<p>为什么越界了也不报错？因为 <code>a[i]</code> 在机器层面只是一道算术：<b>数组第一个格子的地址 + i × 每格大小</b>。编译器只管算地址，然后把那个位置的内容搬出来。它不记录"这个数组到哪结束"，也不管下标是不是在范围内——所以 <code>a[3]</code> 老老实实算出"第 4 格"的地址，把那里存着的东西读给你。</p><p>那里可能有什么？可能是别的变量、可能是函数调用留下的旧数据、可能是操作系统不许你碰的区域。C++ 标准对此只有一句话：<b>未定义行为</b>（Undefined Behavior）——不是"随机"，是"标准压根不规定会发生什么"。</p>`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：越界有三种结局",text:String.raw`<b>结局一：看起来完全正常。</b>越界读到一个恰好是 0 的位置，屏幕上多打一个 0，你以为是数据里的数，检查都懒得检查。<b>结局二：读到乱数。</b>屏幕上出现 32767、-858993460 这种莫名其妙的值。<b>结局三：当场崩掉。</b>越界踩到操作系统保护的内存，程序被终止，屏幕上打出 <code>Segmentation fault (core dumped)</code>。理解错了屏幕上会看到什么：你会以为"这次没事，说明写法没问题"——可未定义行为不保证下一次还这样：换台机器、加个编译选项、改几行无关代码，结局就从"正常"变成"崩溃"。<b>能跑不等于正确。</b>`},

  blocks:[
    {t:"prose",html:String.raw`<p>第 9 周最后一课时，你亲手在 <code>a[5]</code> 上越了界：五个格子的数组，你偏要读第 6 个，屏幕跑出一个 <code>-842150451</code> 之类的野数，或者干脆 <code>Segmentation fault</code>。那一课的结论只有一句——<b>合法下标永远是 0 到 n-1，一根手指头都不能往外伸。</b></p><p>这把红线守好之后，这排格子才敢真正派上用场。今天要让它干一件事：<b>排序</b>。你手上有一组乱序成绩 <code>88 95 76 60 92</code>，屏幕上要变成 <code>60 76 88 92 95</code>。</p><p>先回答一个直觉问题：这 5 个数要比较多少次才能排好？凭感觉说“5 次左右”就行——先记住你的数字，课时结束我们对答案。</p>`},

    {t:"code",file:"pass1.cpp · 一趟冒泡",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int a[5] = {88, 95, 76, 60, 92};
    const int N = 5;                     // 数组大小用常量，别用变量当大小（VLA）
    for (int j = 0; j < N - 1; j++) {    // 相邻比一轮：j 和 j+1
        if (a[j] > a[j + 1]) {
            int t = a[j];
            a[j] = a[j + 1];
            a[j + 1] = t;
        }
    }
    for (int i = 0; i < N; i++) cout << a[i] << " ";
    cout << endl;
    return 0;
}
// 屏幕：88 76 60 92 95`},

    {t:"prose",html:String.raw`<p>看屏幕：最大的 <b>95 被推到了最后一个位置</b>，它不会再动了。但前四个数还是乱的：<code>88 76 60 92</code>。</p><p>这一趟干了什么？从下标 0 开始，每次拿相邻的两个数比：<code>a[j]</code> 比 <code>a[j+1]</code> 大，就把它俩对调。于是大的数像被后面的人不断“顶”着往右走，一直走到走不动为止。95 是最大的，所以它一路被顶到了队尾。</p><p><b>一趟只保证一个数就位。</b>要把 5 个数都排好，就得再来几趟。</p>`},

    {t:"box",kind:"key",title:"冒泡的比方：高的往右挪，一轮冒一个到队尾",text:String.raw`把数组想成一排按身高打乱的人。规则只有一条：<b>相邻两个人比身高，高的那个往右挪一格。</b>从头比到尾，最高的人一定被一路挪到最右边——这就像水里的大气泡往上冒，所以叫冒泡排序。<b>一轮 = 从 0 号位比到 n-2 号位，共 n-1 次相邻比较。</b>每轮结束，未排好的区间就少一个数：第 1 轮末尾就位 1 个，第 2 轮末尾就位 2 个……所以第 i 轮只需要比到 n-1-i 号位。屏幕上能直接看到这件事：每轮结束后，右边“已经归位”的那一截会越来越长。`},

    {t:"code",file:"swap_trap.cpp · 手写交换的经典翻车",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int a = 88, b = 95;
    a = b;          // 想把两个数对调：先把 b 倒进 a
    b = a;          // 再把 a 倒进 b
    cout << a << " " << b << endl;
    return 0;
}
// 屏幕：95 95`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：95 95，越换越乱",text:String.raw`交换两个变量，得像交换两杯水：手里必须多一个<b>空杯子</b>。上面这段代码没借空杯：<code>a = b;</code> 一执行，a 里原来的 88 就被 95 覆盖了，<b>88 永远找不回来了</b>；下一句 <code>b = a;</code> 拿到的是刚写进去的 95，于是屏幕变成 <code>95 95</code>。放回冒泡排序里，这个错会让数组里出现一堆重复数（本课后面有一个 bug 题专门复现），而且编译器<b>一声不吭</b>，不报错、不警告。正确写法必须是三行、且顺序不能改：<code>int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;</code>。t 就是那只空杯子。`},

    {t:"code",file:"swap_ok.cpp · 三行交换",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int a = 88, b = 95;
    int t = a;      // t 记住 a 原来的水：88
    a = b;          // a 换成 b 的水：95
    b = t;          // b 拿回旧 a 的水：88
    cout << a << " " << b << endl;

}

    {t:"prose",html:String.raw`<p>把“一趟”重复 N-1 轮，排序就完成了。为什么要 N-1 轮而不是 N 轮？因为每轮至少送一个数到最终位置，送完 N-1 个之后，最后剩下的那个<b>只可能在自己的位置上</b>——不用再送。</p><p>再看每一轮的长度：第 1 轮从 0 号位比到 n-2 号位（n-1 次比较）；第 2 轮末尾那个数已经就位，只需要比到 n-3 号位……<b>越往后，比较次数越少。</b>写成循环就是 <code>j &lt; N - 1 - i</code>。</p>`},

      why:String.raw`第 1 轮把 95 顶到末尾，剩下 4 个数；第 2 轮把 88 顶到倒数第二；第 3 轮把 76 顶到第三位，第 4 轮只比 0、1 号位，60 已经在 76 前面，一次都没换，所以屏幕第 3、4 行一模一样。很多同学以为“第 4 轮还会换点什么”，其实<b>排序已经完成了</b>——这正是下一段“提前结束”要利用的信号。若你以为每一轮都会改变数组，最后两行相同的输出就是最直接的证据。`},

    {t:"box",kind:"key",title:"轮数 N-1，比较次数逐轮减一",text:String.raw`5 个数：第 1 轮比 4 次，第 2 轮比 3 次，第 3 轮比 2 次，第 4 轮比 1 次，一共 <b>4+3+2+1 = 10 次</b>。推广到 N 个数：比较总数 = (N-1)+(N-2)+…+1 = <b>N(N-1)/2</b>。100 个数就是 4950 次。这个数在屏幕上不会直接出现，但你可以加一个计数器打印出来（后面的练习会让你做）；更直观的是，数组越长，程序“卡”的那一下越明显。写内层循环时记住：<code>j &lt; N - 1 - i</code>，i 从 0 起，所以第 1 轮（i=0）是 N-1 次。`},

    {t:"trace",title:"推一推：每一轮结束后数组长什么样",prompt:"把 4 轮结束后的数组状态填进右边。提示：每轮只看还没归位的那一段。",

    {t:"prose",html:String.raw`<p>现在讲本课时最实用的一招：<b>提前结束</b>。</p><p>看上面的推演，第 4 轮一次交换都没发生。一次都没换，说明什么？说明任意相邻两个数都已经满足“前小后大”，整个数组<b>已经有序</b>，后面就算再跑 0 轮也不会改变任何东西。</p><p>于是我们放一个布尔开关：每轮开头假设“这一轮不会换”，一旦真的换了就把它改成 true。<b>一轮下来还是 false，立刻 break。</b></p>`},

    {t:"code",file:"bubble_flag.cpp · 带提前结束标志",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int a[5] = {88, 95, 76, 60, 92};
    const int N = 5;
    int compares = 0, swaps = 0, rounds = 0;
    for (int i = 0; i < N - 1; i++) {
        bool changed = false;            // 每轮开头：假设一次都不换
        rounds++;
        for (int j = 0; j < N - 1 - i; j++) {
            compares++;
            if (a[j] > a[j + 1]) {
                int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t;
                swaps++;

    {t:"prose",html:String.raw`<p>上一课时结尾留了一个问题：冒泡排序数据越乱，交换次数越多——最坏情况下 5 个数要换 10 次。有没有一种排序，<b>每一轮只交换一次</b>，就能把一个数安顿好？</p><p>有。它叫<b>选择排序</b>。思路特别像你收拾一叠乱牌：先扫一眼整叠牌，<b>找出最小的那张</b>，把它抽出来放到最左边；再从剩下的牌里找最小的，放到左边第二张……每一轮只动一次手，所以它不慌不忙。</p><p>先猜一下：5 个数选择排序，一共要比较多少次、交换多少次？把这两个数记在纸上。</p>`},

    {t:"code",file:"select_pass.cpp · 一趟选择：把最小换到最前",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int a[5] = {88, 95, 76, 60, 92};
    const int N = 5;
    int minIdx = 0;                       // 先假设 0 号位最小，记“下标”

    }

    {t:"box",kind:"key",title:"选择排序的核心：记下标，不记值",text:String.raw`很多同学会写 <code>int minVal = a[0];</code> 然后循环里更新 minVal。这样能找到最小值，但<b>找不到它在哪</b>——最后要交换时你不知道该拿 a[几] 去换。所以选择排序记的是 <code>minIdx</code>（最小的那个数在几号位）。屏幕上有个细节：一趟之后 <code>60</code> 被放到了最前面，而原来 0 号位上的 <code>88</code> 被换到了 3 号位（60 原来在的位置）。这正是选择排序的动作特征——<b>一轮一次远距离交换</b>，换完这一头就定了。`},

    {t:"prose",html:String.raw`<p>把一趟重复 N-1 轮：第 i 轮在 <code>i</code> 到 <code>N-1</code> 号位里找最小，找到后和 <code>i</code> 号位交换。<b>左边已经排好的那一截越来越长，和冒泡一模一样，只是每轮只换一次。</b></p><p>下面这段程序每轮结束打印一次数组，并统计比较、交换次数。先看屏幕，再推第 2 轮。</p>`},

    {t:"code",file:"selection.cpp · 完整选择排序 + 计数",code:String.raw`#include <iostream>
using namespace std;

int main() {
    int a[5] = {88, 95, 76, 60, 92};
    const int N = 5;
    int compares = 0, swaps = 0;
    for (int i = 0; i < N - 1; i++) {
        int minIdx = i;                       // 每轮从 i 号位开始找最小
        for (int j = i + 1; j < N; j++) {
            compares++;
            if (a[j] < a[minIdx]) minIdx = j;
        }
        if (minIdx != i) {                    // 已经在位就不用换
            int t = a[i]; a[i] = a[minIdx]; a[minIdx] = t;
            swaps++;
        }
        cout << "第" << i + 1 << "轮: ";
        for (int k = 0; k < N; k++) cout << a[k] << " ";
        cout << endl;
    }
    cout << "比较 " << compares << " 次, 交换 " << swaps << " 次" << endl;
    return 0;
}

// 第2轮: 60 76 95 88 92

    {t:"prose",html:String.raw`<p>屏幕上有三件事值得盯住：</p><ol style="margin-left:20px"><li><b>左边归位区一轮长一个数</b>：60、60 76、60 76 88……和冒泡一样。</li><li><b>每轮只做一次交换</b>：第 1 轮把 60 从 3 号位换到 0 号位，88 反向去了 3 号位；第 2 轮把 76 换到 1 号位，95 去到 2 号位。</li><li><b>比较次数永远是 10</b>：第 1 轮 4 次、第 2 轮 3 次、第 3 轮 2 次、第 4 轮 1 次，和冒泡完全相同。</li></ol><p>所以选择排序省的不是比较，是<b>交换</b>。交换在真实机器上比比较贵得多（每次交换要写内存两次），能少换就少换。</p>`},

      why:String.raw`每轮都是“在 i..N-1 里挑最小的换到 i”，所以每轮结束时 <code>a[0..i]</code> 是有序的。第 4 轮结束时整个数组有序，屏幕最后打印 60 76 88 92 95。数一数交换发生的轮次：第 1 轮（60 换到 0 号位）、第 2 轮（76 换到 1 号位）、第 3 轮（88 换到 2 号位）、第 4 轮（92 换到 3 号位），正好 4 次——<b>每一轮都换了一次</b>，这是这组数据碰巧。`},

    {t:"box",kind:"key",title:"比较与交换的账本：一个是固定开销，一个是看运气",text:String.raw`<b>比较次数是固定的</b>：不管数据本来什么顺序，第 i 轮都要拿 N-1-i 个数和当前最小比一遍，总数永远是 N(N-1)/2。5 个数 = 10 次，100 个数 = 4950 次，和冒泡一样。<b>交换次数最多 N-1 次</b>：每轮至多换一次，而且如果最小本来就在 i 号位，就一次也不换。冒泡最坏也才 10 次交换——数量级看着差不多，但数据量一大，冒泡的交换次数是平方级往上涨，选择排序永远封顶在线性的 N-1 次。屏幕上体现不出来，跑 10 万个数时你能明显感觉到谁快。`},

    {t:"predict",title:"小预测：最“逆”的数组，交换几次",prompt:"数组是从大到小的 95 92 88 76 60，用选择排序排成从小到大。先猜比较几次、交换几次，再跑。这题很多人会猜错交换次数。",
      code:String.raw`#include <iostream>
using namespace std;

int main() {
    int a[5] = {95, 92, 88, 76, 60};      // 完全逆序
    const int N = 5;
    int compares = 0, swaps = 0;
    for (int i = 0; i < N - 1; i++) {
        int minIdx = i;
        for (int j = i + 1; j < N; j++) {
            compares++;
            if (a[j] < a[minIdx]) minIdx = j;
        }
        if (minIdx != i) {
            int t = a[i]; a[i] = a[minIdx]; a[minIdx] = t;
            swaps++;
        }
    }
    cout << "比较 " << compares << " 次" << endl;
    cout << "交换 " << swaps << " 次" << endl;
    return 0;
}`,
      output:String.raw`比较 10 次
交换 2 次`,
      why:String.raw`比较次数固定 10 次，不意外。意外的是交换只有 <b>2 次</b>：第 1 轮最小的是 60，它在最后一个位置，换到 0 号位之后数组变成 60 92 88 76 95；第 2 轮最小的是 76，换到 1 号位，数组变成 60 76 88 92 95；后面两轮最小值都已经在位，一次都没换。也就是说<b>越逆序，选择排序的交换次数反而可能越少</b>——因为它一次交换就把一个数送到最终位置，而且不再回头动它。若你以为“逆序 = 交换最多”，屏幕上这个 2 就是最直接的反例；冒泡才是逆序时交换最多（10 次）。`},

    {t:"box",kind:"warn",title:"理解错了屏幕上会看到什么：排完还是乱的",text:String.raw`选择排序最经典的 bug 是 <code>int minIdx = 0;</code> 写成从 0 开始，而不是从 i 开始。每一轮都去整个数组（其实是 j 从 i+1 开始扫，但拿 a[0] 当“当前最小”）找最小，结果前面已经排好的数会被反复卷进来，屏幕上的输出是 <code>95 60 88 92 76</code>——<b>看起来只差一点点，其实一个位置都不对</b>。它不报错、不越界，只是安静地给你一个错的排序结果。记住：每轮的开头永远是 <code>int minIdx = i;</code>，因为 i 之前的区间已经排好，不许再碰。`},

    {t:"bug",title:"找 bug：排序跑完，屏幕还是乱的",prompt:"程序能跑、不报错，但输出是 95 60 88 92 76 而不是 60 76 88 92 95。点击出错的那一行，并说清楚每轮应该从哪个下标开始找最小。",
      symptom:"屏幕上最后打印 95 60 88 92 76：60 被换到了中间，95 却被推到了最前面。",
      code:String.raw`#include <iostream>

    int a[5] = {88, 95, 76, 60, 92};

      answers:[8],

      hint:String.raw`第 1 轮从 0 开始找最小没错；但第 2 轮时 0 号位已经排好了，你却还拿它当“当前最小”的参照，于是 95 被换回了前面。`,
      fix:String.raw`int minIdx = i;                 // 每轮从 i 开始，i 之前已经排好`,
      explain:String.raw`错在第 8 行 <code>int minIdx = 0;</code>。第 1 轮 i=0，从 0 开始恰好对，所以前几步看着没问题；从第 2 轮开始出问题：i=1，本该只比较 1..4 号位，但“当前最小”的参照是 a[0]（此时是 60），j 从 2 扫到 4 都找不到比 60 更小的，minIdx 保持 0，于是 <code>a[1]</code> 和 <code>a[0]</code> 被交换——刚排好的 60 被换走，95 回到最前。后面每轮都这样把已经就位的数卷进来，最终屏幕就是 95 60 88 92 76。修法：把 0 改成 <code>i</code>，并给内层循环配上 <code>j = i + 1</code>，保证每轮只看未排序区。`},

    {t:"fill",title:"补全：选择排序的“起点”和“比较对象”",prompt:"只填 2 个空。填完运行，屏幕应输出排好序的 5 个数，并报告交换 4 次。",

交换 4 次`,
      explain:String.raw`两个空依次是 <code>i</code>、<code>minIdx</code>。第一空决定这一轮的搜索范围从哪开始（i 之前已经排好，不能再碰）；第二空保证每次比较都是“新数”和“当前最小”比，而不是和别的什么比。填完运行，屏幕是 60 76 88 92 95，交换 4 次。若你把第一空填成 0，就会得到课时里那个 bug 的乱序结果 95 60 88 92 76——这也是为什么说选择排序的“起点”比“比较”更容易写错。`},

    {t:"prose",html:String.raw`<p>选择排序还有一件事必须讲：<b>稳定性</b>。先说结论——<b>选择排序不稳定</b>，冒泡排序稳定。</p><p>“稳定”是什么意思？排序时如果有两个数<b>相等</b>，排序前谁在前、谁在后，排序后应该保持不变。成绩单上两个 88 分的学生，录入顺序是<b>小明在前、小红在后</b>；一个稳定的排序排完，屏幕上仍然是先小明、后小红。选择排序却不保证——因为它的一次远距离交换，会把一个同分的人从后面直接拎到前面。</p>`},

    {t:"code",file:"stability.cpp · 同分的两个学生，顺序变了",code:String.raw`#include <iostream>
#include <string>
using namespace std;

int main() {
    string name[3] = {"小明", "小红", "小刚"};
    int score[3] = {88, 88, 95};          // 小明、小红同分，小明先录入
    const int N = 3;
    for (int i = 0; i < N - 1; i++) {
        int maxIdx = i;                   // 从高到低排：找最大
        for (int j = i + 1; j < N; j++) {
            if (score[j] > score[maxIdx]) maxIdx = j;
        }
        if (maxIdx != i) {
            int t = score[i]; score[i] = score[maxIdx]; score[maxIdx] = t;
            string s = name[i]; name[i] = name[maxIdx]; name[maxIdx] = s;
        }
    }
    for (int i = 0; i < N; i++) cout << name[i] << " " << score[i] << endl;
    return 0;
}
// 屏幕：
// 小刚 95
// 小红 88
// 小明 88`},

    {t:"box",kind:"key",title:"稳定性的直觉：一次远距离交换会踩到谁",text:String.raw`第 1 轮找最大值：95 在小刚那里（2 号位），换到 0 号位时，把原来在 0 号位的<b>小明</b>挤到了 2 号位——而小红在 1 号位原地没动。交换之前小明在小红前面，交换之后小红跑到了小明前面，<b>两个 88 分的相对顺序被拆散了</b>。这就是“不稳定”的物理来源：选择排序的交换跨越了整个未排序区，路上踩到谁不关它的事。同样的数据用冒泡排序：冒泡只交换相邻两个，95 只会一格一格往左挪，每挪一次只挤过一个人，同分的两个人根本不会互相越过，所以排完还是<b>小明在前、小红在后</b>。对成绩排名来说这不是小事：同分时按录入顺序排是很多学校的硬规矩。`},

    {t:"order",title:"排顺序：选择排序的七行骨架",prompt:"下面七行被大乱了。按真实执行顺序把它们排好——注意 for 的花括号哪一行先关。",
      items:[

        "}   // 外层轮次结束"

      hint:String.raw`外层 for 先出现；每轮第一件事是设定起点；然后才是内层扫描；内层结束才轮到交换；最后关外层。`,
      why:String.raw`正确顺序：外层 for（第 4 项）→ minIdx = i（第 2 项）→ 内层 for（第 1 项）→ 比较更新 minIdx（第 5 项）→ 关闭内层（第 3 项）→ 交换（第 6 项）→ 关闭外层（第 7 项）。关键点：<b>交换一定在内层循环结束之后</b>。如果交换写在内层循环里，每比较一次就换一次，选择排序就退化成比冒泡还乱的怪东西——屏幕上你会看到数组反复抖动，最后结果对错全看运气。`},

    {t:"match",title:"连连看：选择排序的五张标签",prompt:"左边是概念，右边是它的含义。先自己连一遍，再点检查。",
      pairs:[
        {l:"选择排序一轮做的事",r:"在未排序区找最小，和本轮开头的位置交换一次"},
        {l:"minIdx 记什么",r:"记下标不记值；否则交换时找不到那个数在哪"},
        {l:"比较次数",r:"固定 N(N-1)/2，第 i 轮比较 N-1-i 次，不管数据长什么样"},

        {l:"稳定性",r:"同分元素原来的先后顺序会被一次远距离交换打乱，所以不稳定"}
      ],
      why:String.raw`这五张标签合起来就是选择排序的完整性格：动作简单（找最小 + 换一次）、比较固定、交换少、不稳定。最后一条最容易在考试和作业里踩：题目要求“同分按录入顺序”，你就不能用选择排序，得用冒泡（或后面学的稳定排序）。`},

    {t:"prose",html:String.raw`<p>把两笔账并排放在屏幕上：对这 5 个数，冒泡交换 10 次（最坏），选择排序交换 4 次；两者的比较次数都是 10 次。</p><p>所以排序算法的世界里没有“全能冠军”，只有<b>取舍</b>：冒泡用大量交换换来了稳定性（相邻交换不破坏同分顺序）；选择排序用少量交换换来了“不稳定”。真实系统里数据量大到一定规模时，这两种平方级算法都会退场，但<b>“先看比较、再看交换、最后看稳不稳定”</b>这套审法，你以后每次遇到新排序都要用一遍。</p>`},

    {t:"prose",html:String.raw`<p><b>本课时收尾。</b>四件事：① 选择排序每轮只做两件事——<b>在未排序区找最小下标，和本轮开头换一次</b>；② 记的是 <code>minIdx</code> 下标不是值，起点必须是 <code>i</code>；③ 比较次数固定 N(N-1)/2，交换最多 N-1 次，逆序数组反而可能换得很少；④ 它<b>不稳定</b>，同分元素的顺序会被远距离交换打乱，屏幕上两个同分名字的前后一颠倒就是证据。</p><p>到这里，排序教会了你两件事：怎么把一组数排好，以及怎么数清楚算法花了多少代价。但老师接下来要的不是“谁第几”，而是<b>“90 分以上几个、60 分以下几个”</b>——这问题排序给不了直接答案。下一课时我们换个容器：不复排，改成<b>把每个分数丢进对应的桶里数数</b>，画出一张频次直方图。</p>`}

}
// 屏幕：
// 76 分 -> 7 号桶
// 60 分 -> 6 号桶

    {t:"code",file:"histogram.cpp · 完整直方图",code:String.raw`#include <iostream>

    {t:"prose",html:String.raw`<p>看屏幕：<b>星号就是人</b>。70-79 分段有 3 颗星，说明 76 分出现了 3 次；80-89 有 2 颗，90-99 有 2 颗；50-59、60-69、100 各 1 颗。整张表告诉你：这个班没有人低于 50 分，分数集中在 70 分以上。</p><p>和排序的结果比一比：排序给你的是一串按大小排好的数字，直方图给你的是一张<b>分布轮廓</b>。一个是“排队”，一个是“分堆”——数据科学里第二种往往更有用，因为一眼就能看出集中在哪、偏不偏、有没有异常低分。</p>`},

    {t:"box",kind:"key",title:"分箱边界：60 进 6 号桶，59 进 5 号桶",text:String.raw`每个桶覆盖的是<b>左闭右开</b>区间：6 号桶 = [60, 70)，意思是 60 分算进去、70 分不算。所以 60 → 6、69 → 6、59 → 5、70 → 7。正好由整数除法实现：<code>59/10=5</code>、<code>60/10=6</code>。特殊的只有 100 分：<code>100/10=10</code>，于是它落在 <b>10 号桶</b>，标签写成 <code>100</code>（其实代表 100-109，但满分只有 100）。这就是为什么分数 0-100 必须开 <b>11 个桶</b>（0 号到 10 号），而不是 10 个——最后一个桶专门留给 100 分。`},

    {t:"code",file:"pct_histogram.cpp · 桶 + 百分比",code:String.raw`#include <iostream>
#include <iomanip>
using namespace std;

int main() {
    int score[10] = {88, 95, 76, 60, 92, 76, 88, 100, 59, 76};

    {t:"prose",html:String.raw`<p>最后说一个灵活性：<b>桶宽不是固定的 10 分</b>。刚才用 10 分一段，桶号 = 分数 / 10。如果你想看得更细，用 5 分一段：桶号 = 分数 / 5，0-4 分是 0 号桶、5-9 分是 1 号桶……95-99 是 19 号桶，100 分是 20 号桶，一共要开 <b>21 个桶</b>。唯一改的就是桶的数量和公式里的除数，其余代码（循环、++、打印星号）一个字都不用动。</p><p>这就是“分箱”的思路：桶宽是你看数据的<b>放大倍数</b>。10 分一段看整体轮廓，5 分一段看清及格线附近的堆积。屏幕上星条变细变密，但总人数永远不变——这是检查直方图有没有算错的第二个办法。</p>`},

  blocks:[
    {t:"prose",html:String.raw`<p>上一课时结尾我们说：一个人只有一项成绩时，一维数组够用；可成绩单是“<b>第几个学生</b>”和“<b>第几门课</b>”两个方向交出来的——3 个学生 × 4 门课，一共 12 个分数。一维数组只能给它们排一条线，你就再也分不清“第 5 个数”到底是第 2 个学生的第 1 门课，还是第 1 个学生的第 5 门课（这门课根本不存在）。</p><p>今天就把这张表<b>打印到屏幕上</b>：三个学生、四门课，屏幕上应该是三行四列。先猜一下——如果只用一个数组，你会怎么写它的下标？</p>`},

    {t:"code",file:"table.cpp · 定义并打印一张成绩表",code:String.raw`#include <iostream>
